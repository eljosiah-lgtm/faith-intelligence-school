px;color:#e7cf8e}\n  .dateline .day span{font-size:13px;letter-spacing:.06em}\n  .dateline.crim .day{background:var(--crimson)}\n  .dateline .text p{margin:0 0 8px}\n  .dateline .text p:last-child{margin-bottom:0}\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n  ol.points li strong{color:var(--navy)}\n\n  /* Death / end panels */\n  .end{\n    display:flex;\n    gap:16px;\n    align-items:flex-start;\n    background:var(--crimson-tint);\n    border:1px solid #e6c9ce;\n    border-left:6px solid var(--crimson);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:0 0 14px;\n  }\n  .end .day{\n    flex:0 0 auto;\n    min-width:96px;\n    text-align:center;\n    background:var(--crimson);\n    color:#fff;\n    border-radius:4px;\n    padding:6px 12px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    line-height:1.1;\n  }\n  .end .day b{display:block;font-size:24px}\n  .end .day span{font-size:13px;letter-spacing:.06em}\n  .end p{margin:0}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--navy);\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin:0 0 12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 24px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .dateline,.end{flex-direction:column;align-items:flex-start;gap:8px}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.divider,.fact,.define,.note,.dateline,\n    .dateline .day,.end,.end .day,.instruction,.ans,ol.points li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub,.c-head{break-after:avoid;page-break-after:avoid}\n    .divider,.define,.note,.dateline,.end{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n  <header class=\"cover\">\n    <h1>Military Rule in Nigeria (3)<\/h1>\n  <\/header>\n\n  <main>\n\n    <div class=\"divider\"><h2>Military Heads of State in Nigeria<\/h2><\/div>\n\n    <!-- IRONSI -->\n    <article class=\"card navy\">\n      <div class=\"c-head\"><h2>Major General Johnson Aguiyi-Ironsi<\/h2><\/div>\n      <div class=\"c-body\">\n\n        <h3 class=\"sub\" style=\"margin-top:0\">Early Life and Background<\/h3>\n        <div class=\"facts\">\n          <span class=\"fact\"><b>Born:<\/b> 3 March 1924<\/span>\n          <span class=\"fact\"><b>Place:<\/b> Umuahia, Abia State<\/span>\n          <span class=\"fact\"><b>Joined the Army:<\/b> 1942<\/span>\n        <\/div>\n        <p>Major General Johnson Aguiyi-Ironsi was born on 3 March 1924 in Umuahia, present-day Abia State. He joined the Nigerian Army in 1942.<\/p>\n\n        <h3 class=\"sub\">How He Became Head of State<\/h3>\n        <div class=\"dateline\">\n          <div class=\"day\"><b>15<\/b><span>JAN 1966<\/span><\/div>\n          <div class=\"text\"><p>On 15 January 1966, military officers staged Nigeria's first military coup and overthrew the civilian government. Aguiyi-Ironsi became Nigeria's first military Head of State on 16 January 1966.<\/p><\/div>\n        <\/div>\n\n        <h3 class=\"sub\">Major Action<\/h3>\n        <p>In 1966, he introduced Decree No. 34, which sought to change Nigeria's federal system of government to a unitary system.<\/p>\n        <div class=\"define\">\n          <p>Under a <span class=\"term\">unitary system<\/span>, most government powers are controlled by the central government.<\/p>\n        <\/div>\n\n        <h3 class=\"sub\">Death<\/h3>\n        <div class=\"end\">\n          <div class=\"day\"><b>29<\/b><span>JUL 1966<\/span><\/div>\n          <p>On 29 July 1966, Aguiyi-Ironsi was arrested and killed during a counter-coup in Ibadan. Yakubu Gowon succeeded him.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- GOWON -->\n    <article class=\"card crimson\">\n      <div class=\"c-head\"><h2>General Yakubu Gowon<\/h2><\/div>\n      <div class=\"c-body\">\n\n        <h3 class=\"sub\" style=\"margin-top:0\">Early Life and Background<\/h3>\n        <div class=\"facts\">\n          <span class=\"fact\"><b>Born:<\/b> 19 October 1934<\/span>\n          <span class=\"fact\"><b>Place:<\/b> Pankshin, Plateau State<\/span>\n          <span class=\"fact\"><b>Joined the Army:<\/b> 1954<\/span>\n        <\/div>\n        <p>General Yakubu Gowon was born on 19 October 1934 in Pankshin, present-day Plateau State. He joined the Nigerian Army in 1954.<\/p>\n\n        <h3 class=\"sub\">How He Became Head of State<\/h3>\n        <p class=\"note\">Gowon became Head of State in July 1966, following the counter-coup that killed Aguiyi-Ironsi. He ruled until July 1975.<\/p>\n\n        <h3 class=\"sub\">Major Achievements and Events<\/h3>\n        <ol class=\"points\">\n          <li><strong>Nigerian Civil War:<\/strong> The war lasted from 1967 to 1970 between the Federal Government of Nigeria and Biafra, led by Chukwuemeka Odumegwu Ojukwu.<\/li>\n          <li><strong>National Reconciliation:<\/strong> After the war, Gowon's government adopted the policy “No victor, no vanquished” to promote peace and unity.<\/li>\n          <li><strong>Creation of States:<\/strong> In May 1967, his government divided Nigeria's four regions into 12 states.<\/li>\n          <li><strong>Development:<\/strong> His government carried out reconstruction and development projects after the Civil War.<\/li>\n        <\/ol>\n\n        <h3 class=\"sub\">End of Government<\/h3>\n        <div class=\"end\">\n          <div class=\"day\"><b>29<\/b><span>JUL 1975<\/span><\/div>\n          <p>On 29 July 1975, military officers overthrew Gowon's government while he was attending an international meeting abroad. Murtala Muhammed became Head of State.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- MURTALA -->\n    <article class=\"card gold\">\n      <div class=\"c-head\"><h2>General Murtala Ramat Muhammed<\/h2><\/div>\n      <div class=\"c-body\">\n\n        <h3 class=\"sub\" style=\"margin-top:0\">Early Life and Background<\/h3>\n        <div class=\"facts\">\n          <span class=\"fact\"><b>Born:<\/b> 8 November 1938<\/span>\n          <span class=\"fact\"><b>Place:<\/b> Kano, Nigeria<\/span>\n          <span class=\"fact\"><b>Joined the Army:<\/b> 1958<\/span>\n        <\/div>\n        <p>General Murtala Ramat Muhammed was born on 8 November 1938 in Kano, Nigeria. He joined the Nigerian Army in 1958.<\/p>\n\n        <h3 class=\"sub\">How He Became Head of State<\/h3>\n        <p class=\"note\">Murtala Muhammed became Head of State on 29 July 1975, after Gowon's government was overthrown. He ruled until February 1976.<\/p>\n\n        <h3 class=\"sub\">Major Achievements<\/h3>\n        <ol class=\"points\">\n          <li><strong>Fight Against Corruption:<\/strong> His government took action against corruption and indiscipline.<\/li>\n          <li><strong>Public Service Reforms:<\/strong> His government introduced reforms to improve the public service.<\/li>\n          <li><strong>Return to Civilian Rule:<\/strong> He announced plans to return Nigeria to civilian government in 1979.<\/li>\n          <li><strong>Creation of States:<\/strong> In February 1976, his government created seven additional states, increasing the number from 12 to 19.<\/li>\n          <li><strong>Federal Capital:<\/strong> His government decided to move Nigeria's Federal Capital from Lagos to a more central location. Abuja was chosen.<\/li>\n        <\/ol>\n\n        <h3 class=\"sub\">Death<\/h3>\n        <div class=\"end\">\n          <div class=\"day\"><b>13<\/b><span>FEB 1976<\/span><\/div>\n          <p>On 13 February 1976, Murtala Muhammed was assassinated during an attempted coup in Lagos. General Olusegun Obasanjo succeeded him.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- QUESTIONS -->\n    <div class=\"exam\">\n      <section>\n        <h2>Objective Questions<\/h2>\n        <p class=\"instruction\">Choose the correct answer from options A–D.<\/p>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>How many additional states did Murtala Muhammed's government create in 1976?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Four<\/li><li><b>B.<\/b>Seven<\/li><li><b>C.<\/b>Twelve<\/li><li><b>D.<\/b>Nineteen<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Who became Nigeria's first military Head of State?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Olusegun Obasanjo<\/li><li><b>C.<\/b>Murtala Muhammed<\/li><li><b>D.<\/b>Johnson Aguiyi-Ironsi<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>The Nigerian Civil War lasted from <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1967 to 1970<\/li><li><b>B.<\/b>1960 to 1963<\/li><li><b>C.<\/b>1975 to 1979<\/li><li><b>D.<\/b>1983 to 1985<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Abuja was chosen as Nigeria's new <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>commercial centre<\/li><li><b>B.<\/b>seaport<\/li><li><b>C.<\/b>Federal Capital<\/li><li><b>D.<\/b>military headquarters<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Who succeeded Murtala Muhammed after his death?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Olusegun Obasanjo<\/li><li><b>C.<\/b>Johnson Aguiyi-Ironsi<\/li><li><b>D.<\/b>Shehu Shagari<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Aguiyi-Ironsi became Head of State in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1960<\/li><li><b>B.<\/b>1963<\/li><li><b>C.<\/b>1975<\/li><li><b>D.<\/b>1966<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>The policy “No victor, no vanquished” was associated with <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Murtala Muhammed<\/li><li><b>C.<\/b>Johnson Aguiyi-Ironsi<\/li><li><b>D.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>Who introduced Decree No. 34 in 1966?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Olusegun Obasanjo<\/li><li><b>C.<\/b>Johnson Aguiyi-Ironsi<\/li><li><b>D.<\/b>Murtala Muhammed<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>General Yakubu Gowon was removed from power in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1966<\/li><li><b>B.<\/b>1975<\/li><li><b>C.<\/b>1976<\/li><li><b>D.<\/b>1979<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Who led Biafra during the Nigerian Civil War?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Yakubu Gowon<\/li><li><b>C.<\/b>Murtala Muhammed<\/li><li><b>D.<\/b>Chukwuemeka Odumegwu Ojukwu<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">11.<\/span><span>Murtala Muhammed was assassinated on <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>13 February 1976<\/li><li><b>B.<\/b>15 January 1966<\/li><li><b>C.<\/b>29 July 1975<\/li><li><b>D.<\/b>1 October 1979<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">12.<\/span><span>Aguiyi-Ironsi was killed during a <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>general election<\/li><li><b>B.<\/b>peaceful handover<\/li><li><b>C.<\/b>counter-coup<\/li><li><b>D.<\/b>civil war<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">13.<\/span><span>In which year did Gowon's government create 12 states?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1966<\/li><li><b>B.<\/b>1967<\/li><li><b>C.<\/b>1975<\/li><li><b>D.<\/b>1976<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">14.<\/span><span>Murtala Muhammed announced plans for Nigeria to return to civilian rule in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1966<\/li><li><b>B.<\/b>1970<\/li><li><b>C.<\/b>1976<\/li><li><b>D.<\/b>1979<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">15.<\/span><span>General Yakubu Gowon was born in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Pankshin<\/li><li><b>B.<\/b>Kano<\/li><li><b>C.<\/b>Umuahia<\/li><li><b>D.<\/b>Lagos<\/li><\/ul><\/div>\n      <\/section>\n\n      <section>\n        <h2>Answer Key<\/h2>\n        <div class=\"answers\">\n          <div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>2<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>3<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>4<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>5<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>6<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>7<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>8<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>9<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>10<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>11<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>12<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>13<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>14<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>15<\/span><strong>A<\/strong><\/div>\n        <\/div>\n      <\/section>\n    <\/div>\n\n  <\/main>\n\n  <footer>History – Primary 6 · Military Rule in Nigeria (3)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|2|4":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>History – Primary 6: Military Rule in Nigeria (4)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  .divider{\n    margin-top:30px;\n    padding:12px 18px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n  }\n  .divider h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--navy);\n    font-size:22px;\n    line-height:1.25;\n    margin:0;\n  }\n\n  /* Leader cards */\n  .card{\n    margin-top:30px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:14px 22px 12px;\n    background:var(--accent);\n  }\n  .c-head h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:#fff;\n    margin:0;\n  }\n  .c-body{padding:14px 22px 10px}\n\n  .facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}\n  .fact{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:14px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-radius:20px;\n    padding:3px 14px;\n    color:var(--navy);\n  }\n  .fact b{margin-right:4px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:22px 0 10px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n  h3.sub.first{margin-top:0}\n\n  /* Date highlight */\n  .dateline{\n    display:flex;\n    align-items:center;\n    gap:16px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:0 0 14px;\n  }\n  .dateline .day{\n    flex:0 0 auto;\n    min-width:96px;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:6px 12px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    line-height:1.1;\n  }\n  .dateline .day b{display:block;font-size:24px;color:#e7cf8e}\n  .dateline .day span{font-size:13px;letter-spacing:.06em}\n  .dateline p{margin:0}\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n  ol.points li strong{color:var(--navy)}\n\n  /* End / handover boxes */\n  .end{\n    display:flex;\n    gap:16px;\n    align-items:flex-start;\n    background:var(--crimson-tint);\n    border:1px solid #e6c9ce;\n    border-left:6px solid var(--crimson);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:0 0 14px;\n  }\n  .end.hand{\n    background:var(--tint);\n    border-color:var(--line);\n    border-left-color:var(--navy);\n  }\n  .end .day{\n    flex:0 0 auto;\n    min-width:96px;\n    text-align:center;\n    background:var(--crimson);\n    color:#fff;\n    border-radius:4px;\n    padding:6px 12px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    line-height:1.1;\n  }\n  .end.hand .day{background:var(--navy)}\n  .end .day b{display:block;font-size:24px}\n  .end .day span{font-size:13px;letter-spacing:.06em}\n  .end p{margin:0}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--navy);\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin:0 0 12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 24px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .dateline,.end{flex-direction:column;align-items:flex-start;gap:8px}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.divider,.fact,.dateline,.dateline .day,\n    .end,.end .day,.instruction,.ans,ol.points li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub,.c-head{break-after:avoid;page-break-after:avoid}\n    .divider,.dateline,.end{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n  <header class=\"cover\">\n    <h1>Military Rule in Nigeria (4)<\/h1>\n  <\/header>\n\n  <main>\n\n    <div class=\"divider\"><h2>Military Heads of State in Nigeria<\/h2><\/div>\n\n    <!-- OBASANJO -->\n    <article class=\"card navy\">\n      <div class=\"c-head\"><h2>General Olusegun Obasanjo (1976–1979)<\/h2><\/div>\n      <div class=\"c-body\">\n\n        <h3 class=\"sub first\">Early Life<\/h3>\n        <div class=\"facts\">\n          <span class=\"fact\"><b>Born:<\/b> 5 March 1937<\/span>\n          <span class=\"fact\"><b>Place:<\/b> Abeokuta, Ogun State<\/span>\n          <span class=\"fact\"><b>Joined the Army:<\/b> 1958<\/span>\n        <\/div>\n        <p>General Olusegun Obasanjo was born on 5 March 1937 in Abeokuta, present-day Ogun State. He joined the Nigerian Army in 1958.<\/p>\n\n        <h3 class=\"sub\">How He Became Head of State<\/h3>\n        <div class=\"dateline\">\n          <div class=\"day\"><b>13<\/b><span>FEB 1976<\/span><\/div>\n          <p>After General Murtala Muhammed was assassinated on 13 February 1976, Obasanjo succeeded him as Head of State.<\/p>\n        <\/div>\n\n        <h3 class=\"sub\">Major Achievements<\/h3>\n        <ol class=\"points\">\n          <li>Continued preparations for Nigeria's return to civilian rule.<\/li>\n          <li>Supervised the transition programme and elections that led to civilian government in 1979.<\/li>\n          <li>Continued the development of Abuja as Nigeria's new Federal Capital.<\/li>\n          <li>Supported the struggle against colonialism and racial discrimination in Africa.<\/li>\n        <\/ol>\n\n        <h3 class=\"sub\">Handover of Power<\/h3>\n        <div class=\"end hand\">\n          <div class=\"day\"><b>1<\/b><span>OCT 1979<\/span><\/div>\n          <p>On 1 October 1979, Obasanjo handed power to the elected President, Alhaji Shehu Shagari. This marked the beginning of Nigeria's Second Republic.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- BUHARI -->\n    <article class=\"card crimson\">\n      <div class=\"c-head\"><h2>General Muhammadu Buhari (1983–1985)<\/h2><\/div>\n      <div class=\"c-body\">\n\n        <h3 class=\"sub first\">Early Life<\/h3>\n        <div class=\"facts\">\n          <span class=\"fact\"><b>Born:<\/b> 17 December 1942<\/span>\n          <span class=\"fact\"><b>Place:<\/b> Daura, Katsina State<\/span>\n          <span class=\"fact\"><b>Joined the Army:<\/b> 1962<\/span>\n        <\/div>\n        <p>General Muhammadu Buhari was born on 17 December 1942 in Daura, present-day Katsina State. He joined the Nigerian Army in 1962.<\/p>\n\n        <h3 class=\"sub\">How He Became Head of State<\/h3>\n        <div class=\"dateline\">\n          <div class=\"day\"><b>31<\/b><span>DEC 1983<\/span><\/div>\n          <p>On 31 December 1983, the military overthrew President Shehu Shagari's government. Buhari became Head of State.<\/p>\n        <\/div>\n\n        <h3 class=\"sub\">Major Actions<\/h3>\n        <ol class=\"points\">\n          <li><strong>War Against Indiscipline (WAI):<\/strong> Introduced in 1984 to promote discipline, punctuality and orderliness.<\/li>\n          <li><strong>Fight Against Corruption:<\/strong> His government investigated some former government officials.<\/li>\n          <li><strong>Economic Measures:<\/strong> Introduced restrictions on imports to address Nigeria's economic problems.<\/li>\n          <li><strong>Military Decrees:<\/strong> His government ruled through military decrees and restricted some political activities.<\/li>\n        <\/ol>\n\n        <h3 class=\"sub\">End of Government<\/h3>\n        <div class=\"end\">\n          <div class=\"day\"><b>27<\/b><span>AUG 1985<\/span><\/div>\n          <p>On 27 August 1985, General Ibrahim Babangida removed Buhari from power in a military coup.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- BABANGIDA -->\n    <article class=\"card gold\">\n      <div class=\"c-head\"><h2>General Ibrahim Badamasi Babangida (1985–1993)<\/h2><\/div>\n      <div class=\"c-body\">\n\n        <h3 class=\"sub first\">Early Life<\/h3>\n        <div class=\"facts\">\n          <span class=\"fact\"><b>Born:<\/b> 17 August 1941<\/span>\n          <span class=\"fact\"><b>Place:<\/b> Minna, Niger State<\/span>\n          <span class=\"fact\"><b>Joined the Army:<\/b> 1962<\/span>\n          <span class=\"fact\"><b>Popularly called:<\/b> IBB<\/span>\n        <\/div>\n        <p>General Ibrahim Badamasi Babangida, popularly called IBB, was born on 17 August 1941 in Minna, present-day Niger State. He joined the Nigerian Army in 1962.<\/p>\n\n        <h3 class=\"sub\">How He Became Head of State<\/h3>\n        <div class=\"dateline\">\n          <div class=\"day\"><b>27<\/b><span>AUG 1985<\/span><\/div>\n          <p>Babangida took power from Buhari in a military coup on 27 August 1985.<\/p>\n        <\/div>\n\n        <h3 class=\"sub\">Major Actions and Events<\/h3>\n        <ol class=\"points\">\n          <li><strong>Structural Adjustment Programme (SAP):<\/strong> Introduced in 1986 to address economic problems and change how the economy operated. It caused hardship for many Nigerians.<\/li>\n          <li><strong>Transition Programme:<\/strong> His government announced plans to return Nigeria to civilian rule.<\/li>\n          <li><strong>12 June 1993 Election:<\/strong> The two main candidates were M.K.O. Abiola of the Social Democratic Party (SDP) and Bashir Tofa of the National Republican Convention (NRC).<\/li>\n          <li><strong>Annulment of Election:<\/strong> Babangida's government annulled the 12 June 1993 presidential election, causing protests and political tension.<\/li>\n        <\/ol>\n\n        <h3 class=\"sub\">End of Government<\/h3>\n        <div class=\"end\">\n          <div class=\"day\"><b>AUG<\/b><span>1993<\/span><\/div>\n          <p>In August 1993, Babangida stepped aside and transferred power to the Interim National Government headed by Chief Ernest Shonekan.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- ABDULSALAMI -->\n    <article class=\"card navy\">\n      <div class=\"c-head\"><h2>General Abdulsalami Abubakar (1998–1999)<\/h2><\/div>\n      <div class=\"c-body\">\n\n        <h3 class=\"sub first\">Early Life<\/h3>\n        <div class=\"facts\">\n          <span class=\"fact\"><b>Born:<\/b> 13 June 1942<\/span>\n          <span class=\"fact\"><b>Place:<\/b> Minna, Niger State<\/span>\n          <span class=\"fact\"><b>Joined the Air Force:<\/b> 1963<\/span>\n        <\/div>\n        <p>General Abdulsalami Abubakar was born on 13 June 1942 in Minna, present-day Niger State. He joined the Nigerian Air Force in 1963 and later served in the Nigerian Army.<\/p>\n\n        <h3 class=\"sub\">How He Became Head of State<\/h3>\n        <div class=\"dateline\">\n          <div class=\"day\"><b>8<\/b><span>JUN 1998<\/span><\/div>\n          <p>After General Sani Abacha died on 8 June 1998, Abdulsalami became Head of State.<\/p>\n        <\/div>\n\n        <h3 class=\"sub\">Major Achievements<\/h3>\n        <ol class=\"points\">\n          <li>Released several political prisoners.<\/li>\n          <li>Organised elections as part of the transition to civilian rule.<\/li>\n          <li>Adopted the 1999 Constitution in preparation for civilian government.<\/li>\n          <li>Prepared Nigeria for the return to elected civilian government.<\/li>\n        <\/ol>\n\n        <h3 class=\"sub\">Handover of Power<\/h3>\n        <div class=\"end hand\">\n          <div class=\"day\"><b>29<\/b><span>MAY 1999<\/span><\/div>\n          <p>On 29 May 1999, Abdulsalami handed power to the elected President, Olusegun Obasanjo. This marked the beginning of Nigeria's Fourth Republic.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- QUESTIONS -->\n    <div class=\"exam\">\n      <section>\n        <h2>Objective Questions<\/h2>\n        <p class=\"instruction\">Choose the correct answer from options A–D.<\/p>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Which programme did Muhammadu Buhari introduce in 1984?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Structural Adjustment Programme<\/li><li><b>B.<\/b>War Against Indiscipline<\/li><li><b>C.<\/b>National Youth Service Corps<\/li><li><b>D.<\/b>Transition Programme<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Who headed the Interim National Government in 1993?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Sani Abacha<\/li><li><b>C.<\/b>Ernest Shonekan<\/li><li><b>D.<\/b>Abdulsalami Abubakar<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>On what date did Obasanjo hand power to Shehu Shagari?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1 October 1979<\/li><li><b>B.<\/b>29 May 1999<\/li><li><b>C.<\/b>31 December 1983<\/li><li><b>D.<\/b>12 June 1993<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Who became Head of State after the death of General Sani Abacha?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Ibrahim Babangida<\/li><li><b>B.<\/b>Muhammadu Buhari<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><li><b>D.<\/b>Abdulsalami Abubakar<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>SAP means <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>State Administration Programme<\/li><li><b>B.<\/b>Structural Adjustment Programme<\/li><li><b>C.<\/b>Social Affairs Programme<\/li><li><b>D.<\/b>State Adjustment Policy<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Muhammadu Buhari was removed from power by <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Olusegun Obasanjo<\/li><li><b>C.<\/b>Ibrahim Babangida<\/li><li><b>D.<\/b>Ernest Shonekan<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Who received power from Abdulsalami Abubakar in 1999?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>M.K.O. Abiola<\/li><li><b>C.<\/b>Ibrahim Babangida<\/li><li><b>D.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>The 12 June 1993 presidential election was annulled under <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Muhammadu Buhari<\/li><li><b>B.<\/b>Ibrahim Babangida<\/li><li><b>C.<\/b>Abdulsalami Abubakar<\/li><li><b>D.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>General Olusegun Obasanjo was born in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Abeokuta<\/li><li><b>B.<\/b>Daura<\/li><li><b>C.<\/b>Minna<\/li><li><b>D.<\/b>Kano<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Buhari became Head of State after the military coup of <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1979<\/li><li><b>B.<\/b>1985<\/li><li><b>C.<\/b>1983<\/li><li><b>D.<\/b>1993<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">11.<\/span><span>Which constitution was adopted in preparation for Nigeria's return to civilian rule in 1999?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1960 Constitution<\/li><li><b>B.<\/b>1979 Constitution<\/li><li><b>C.<\/b>1989 Constitution<\/li><li><b>D.<\/b>1999 Constitution<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">12.<\/span><span>One of the main candidates in the 12 June 1993 presidential election was <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>M.K.O. Abiola<\/li><li><b>C.<\/b>Sani Abacha<\/li><li><b>D.<\/b>Yakubu Gowon<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">13.<\/span><span>General Abdulsalami Abubakar handed over power on <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1 October 1979<\/li><li><b>B.<\/b>27 August 1985<\/li><li><b>C.<\/b>29 May 1999<\/li><li><b>D.<\/b>8 June 1998<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">14.<\/span><span>General Ibrahim Babangida took over from Buhari in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1983<\/li><li><b>B.<\/b>1985<\/li><li><b>C.<\/b>1993<\/li><li><b>D.<\/b>1998<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">15.<\/span><span>General Olusegun Obasanjo succeeded <span class=\"blank\">&nbsp;<\/span> as Head of State in 1976.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Murtala Muhammed<\/li><li><b>B.<\/b>Yakubu Gowon<\/li><li><b>C.<\/b>Muhammadu Buhari<\/li><li><b>D.<\/b>Sani Abacha<\/li><\/ul><\/div>\n      <\/section>\n\n      <section>\n        <h2>Answer Key<\/h2>\n        <div class=\"answers\">\n          <div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>3<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>4<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>5<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>6<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>7<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>8<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>9<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>10<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>11<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>12<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>13<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>14<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>15<\/span><strong>A<\/strong><\/div>\n        <\/div>\n      <\/section>\n    <\/div>\n\n  <\/main>\n\n  <footer>History – Primary 6 · Military Rule in Nigeria (4)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"eng|1|0":{
  duration:"40 minutes", period:"Week 1",
  objectives:["define a noun and give examples;","identify common, proper, abstract, collective and material nouns in sentences;","use nouns correctly in their own sentences."],
  intro:"Ask pupils to name five things they can see in the classroom, five people they know and five places in Delta State. Write their answers on the board. Explain that every one of these words is a noun.",
  content:`<p><b>A noun</b> is a word that names a person, place, animal, thing or idea.</p>
  <table class="t"><tr><th>Type of noun</th><th>Meaning</th><th>Examples</th></tr>
  <tr><td>Common noun</td><td>Names any person, place or thing</td><td>girl, market, book, river</td></tr>
  <tr><td>Proper noun</td><td>Names a particular person, place or thing; starts with a capital letter</td><td>Ngozi, Asaba, Monday, Niger</td></tr>
  <tr><td>Abstract noun</td><td>Names a feeling, idea or quality you cannot touch</td><td>honesty, love, courage, peace</td></tr>
  <tr><td>Collective noun</td><td>Names a group of people, animals or things</td><td>a class of pupils, a flock of birds, a bunch of keys</td></tr>
  <tr><td>Material noun</td><td>Names what things are made of</td><td>gold, wood, water, cotton</td></tr></table>
  <div class="ex"><p><b>Examples in sentences</b></p><ul>
  <li>The <u>teacher</u> read a <u>story</u> to the <u>class</u>. (common and collective nouns)</li>
  <li><u>Emeka</u> travelled from <u>Warri</u> to <u>Asaba</u>. (proper nouns)</li>
  <li><u>Honesty</u> is the best policy. (abstract noun)</li></ul></div>`,
  evaluation:["What is a noun?","Name the type of noun: <i>a team of footballers</i>.","Pick the abstract noun: table, kindness, river.","Write one sentence using the proper noun <i>Delta</i>.","Give two examples of material nouns."],
  assignment:"Write ten sentences. Use two nouns of each type (common, proper, abstract, collective, material) and underline them."
},
"math|1|0":{
  duration:"40 minutes", period:"Week 1",
  objectives:["state the place value and face value of digits up to millions;","read, write and expand numbers up to 9,999,999;","compare and order large numbers."],
  intro:"Write 4,305,276 on the board and ask pupils to read it. Revise the columns they already know: units, tens, hundreds and thousands.",
  content:`<p><b>Place value</b> is the value of a digit because of where it sits in a number. <b>Face value</b> is the digit itself.</p>
  <table class="t"><tr><th>Millions</th><th>Hundred thousands</th><th>Ten thousands</th><th>Thousands</th><th>Hundreds</th><th>Tens</th><th>Units</th></tr>
  <tr><td>4</td><td>3</td><td>0</td><td>5</td><td>2</td><td>7</td><td>6</td></tr></table>
  <div class="ex"><p><b>Worked example: 4,305,276</b></p><ul>
  <li><b>In words:</b> Four million, three hundred and five thousand, two hundred and seventy-six.</li>
  <li><b>Expanded form:</b> 4,000,000 + 300,000 + 0 + 5,000 + 200 + 70 + 6</li>
  <li><b>Place value of 3:</b> 300,000 (three hundred thousand). <b>Face value of 3:</b> 3</li></ul></div>
  <p><b>Comparing numbers:</b> compare digits from the left. The first place where they differ decides which number is bigger. So 4,305,276 &gt; 4,299,999 because 3 hundred-thousands is greater than 2 hundred-thousands.</p>`,
  evaluation:["Write 6,070,408 in words.","What is the place value of 7 in 5,716,239?","Write 2,450,030 in expanded form.","Arrange from smallest to largest: 3,404,500; 3,044,500; 3,440,500.","What is the face value of 9 in 9,120,000?"],
  assignment:"Write five seven-digit numbers of your own. For each, write the number in words and in expanded form."
},
"bst|1|0":{
  duration:"40 minutes", period:"Week 1",
  objectives:["define digestion and name the parts of the human digestive system;","describe the function of each part;","state ways of keeping the digestive system healthy."],
  intro:"Ask: “What happens to the food you ate this morning?” Let pupils share ideas, then explain that the body breaks food down into small parts it can use. This process is called digestion.",
  content:`<p><b>Digestion</b> is the breaking down of food into small soluble parts that the body can absorb and use.</p>
  <table class="t"><tr><th>Part</th><th>Function</th></tr>
  <tr><td>Mouth</td><td>Teeth chew food; saliva softens it and starts digesting starch.</td></tr>
  <tr><td>Oesophagus (food pipe)</td><td>Pushes food down to the stomach.</td></tr>
  <tr><td>Stomach</td><td>Churns food and mixes it with digestive juices.</td></tr>
  <tr><td>Small intestine</td><td>Digestion is completed here; digested food passes into the blood.</td></tr>
  <tr><td>Large intestine</td><td>Absorbs water; waste is formed.</td></tr>
  <tr><td>Rectum and anus</td><td>Store and remove solid waste (faeces).</td></tr></table>
  <div class="ex"><p><b>Keeping the digestive system healthy</b></p><ul>
  <li>Wash your hands before eating and after using the toilet.</li><li>Chew food well and eat a balanced diet.</li><li>Drink clean water and eat fruits and vegetables.</li></ul></div>`,
  evaluation:["What is digestion?","Where does digestion of starch begin?","Which part absorbs digested food into the blood?","Name two ways of keeping the digestive system healthy.","Draw and label the digestive system."],
  assignment:"Draw the human digestive system in your notebook. Label six parts and write one function beside each."
},
"civ|1|0":{
  duration:"35 minutes", period:"Week 1",
  objectives:["name the national symbols of Nigeria;","explain the meaning of the colours and parts of each symbol;","show respect for the national symbols."],
  intro:"Lead the class in the National Anthem. Ask: “What do we see on our flag, our coat of arms and our naira notes?” Explain that these are national symbols.",
  content:`<p><b>National symbols</b> are things that stand for a nation and remind citizens of its identity and values.</p>
  <table class="t"><tr><th>Symbol</th><th>Meaning</th></tr>
  <tr><td>National flag</td><td>Green stands for agriculture and natural wealth; white stands for peace and unity.</td></tr>
  <tr><td>Coat of arms</td><td>Black shield for fertile soil; two horses for dignity; eagle for strength; Y-shape for the Rivers Niger and Benue; yellow flowers for the national flower (Costus spectabilis).</td></tr>
  <tr><td>National anthem</td><td>A song of loyalty, prayer and hope for Nigeria.</td></tr>
  <tr><td>National pledge</td><td>A promise to be faithful, loyal and honest and to serve Nigeria.</td></tr></table>
  <div class="ex"><p><b>Showing respect</b></p><ul><li>Stand at attention when the anthem is sung or the flag is raised.</li><li>Never let the flag touch the ground.</li><li>Recite the pledge with sincerity.</li></ul></div>`,
  evaluation:["List four national symbols of Nigeria.","What does the green colour of the flag stand for?","What does the white colour stand for?","Why do the rivers appear on the coat of arms?","Recite the National Pledge."],
  assignment:"Draw the Nigerian flag, colour it correctly and write two sentences about what it means."
}
};

/* Build topic lists for every class: Week 1 is always "Revision" */
const TOPICS_BY_CLASS={};
(function(){
  TOPICS_BY_CLASS[6]={};
  Object.keys(TOPICS).forEach(sub=>{
    TOPICS_BY_CLASS[6][sub]=TOPICS[sub].map(t=>t.length?(t[0]==="Revision"?t:["Revision",...t]):[]);
  });
  Object.keys(LOWER).forEach(c=>{
    TOPICS_BY_CLASS[c]={};
    Object.keys(LOWER[c]).forEach(sub=>{
      TOPICS_BY_CLASS[c][sub]=LOWER[c][sub].map(str=>["Revision",...str.split(";")]);
    });
  });
  /* Primary 6 written notes (other than History) move one week down because of Revision */
  Object.keys(NOTES).filter(k=>!k.startsWith("hist|")).sort().reverse().forEach(k=>{
    const [a,b,i]=k.split("|"); NOTES[`${a}|${b}|${+i+1}`]=NOTES[k]; delete NOTES[k];
  });
})();
const topicsOf=(subj,term,cls)=>{
  const c=TOPICS_BY_CLASS[cls===undefined?state.cls:cls]||{};
  return (c[subj]&&c[subj][term-1])||[];
};
const noteFor=i=>state.cls===6?NOTES[`${state.subj}|${state.term}|${i}`]:undefined;

const classLabel=n=>n===6?"Primary 5~6":"Primary "+n;
/* Things that must be switched off when the screen changes (listeners, observers) */
const cleanups=[];
const registerCleanup=fn=>cleanups.push(fn);
const state = {cls:null, term:null, subj:null, topic:null};
const app = document.getElementById("app");
const termName = id => TERMS.find(t=>t.id===id).name;
const subjOf   = id => SUBJECTS.find(s=>s.id===id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function go(patch){ Object.assign(state,patch); render(); window.scrollTo({top:0}); }

function crumbs(){
  const parts=[];
  parts.push(["Classes",()=>go({cls:null,term:null,subj:null,topic:null})]);
  if(state.cls) parts.push([classLabel(state.cls),()=>go({term:null,subj:null,topic:null})]);
  if(state.term) parts.push([termName(state.term),()=>go({subj:null,topic:null})]);
  if(state.subj) parts.push([subjOf(state.subj).name,()=>go({topic:null})]);
  if(state.topic!==null) parts.push(["Note",null]);
  const wrap=document.createElement("nav");
  wrap.className="crumbs"; wrap.setAttribute("aria-label","Breadcrumb");
  parts.forEach((p,i)=>{
    if(i) wrap.insertAdjacentHTML("beforeend","<i>/</i>");
    const last = i===parts.length-1;
    if(last){ const s=document.createElement("span"); s.className="cur"; s.textContent=p[0]; wrap.appendChild(s); }
    else { const b=document.createElement("button"); b.textContent=p[0]; b.onclick=p[1]; wrap.appendChild(b); }
  });
  return wrap;
}

function screenTopics(){
  const s=subjOf(state.subj), list=topicsOf(state.subj,state.term);
  const box=document.createElement("section");
  box.innerHTML=`<h1>${esc(s.name)}</h1><p class="lead">${termName(state.term)} topics. Choose a topic to open its lesson note.</p><ul class="topics"></ul>`;
  const ul=box.querySelector(".topics");
  list.forEach((t,i)=>{
    const li=document.createElement("li");
    if(i===0&&t==="Revision"){
      li.innerHTML=`<div class="rev-row"><span class="wk">Week 1</span><span class="t-title">${esc(t)}</span></div>`;
      ul.appendChild(li);
      return;
    }
    const ready = !!noteFor(i);
    li.innerHTML=`<button><span class="wk">Week ${i+1}</span><span class="t-title">${esc(t)}</span>${ready?'<span class="t-ready">Full note ready</span>':'<span class="t-ready" style="color:var(--muted);font-weight:500">Note coming soon</span>'}</button>`;
    li.firstChild.onclick=()=>go({topic:i});
    ul.appendChild(li);
  });
  {
    const li=document.createElement("li");
    li.className="exam-item";
    li.innerHTML=`<button class="exam-row"><span class="exam-t">Examination</span><span class="exam-s">End of ${termName(state.term)}</span></button>`;
    li.firstChild.onclick=()=>go({topic:"exam"});
    ul.appendChild(li);
  }
  return box;
}

function fallbackNote(topic){
  return {duration:"40 minutes",
    body:`<div class="soon"><b>${esc(topic)}</b><p>This note has not been added yet.</p></div>`};
}

function quizHTML(n){
  if(!n.quiz) return "";
  const L="ABCD";
  let h='<div class="sec quiz"><h3>Test yourself</h3><p class="qh">Choose the correct answer. Tap an option to check it.</p>';
  n.quiz.forEach((q,i)=>{
    h+=`<div class="q"><p class="qt"><b>${i+1}.</b> ${esc(q.q)}</p><div class="opts">`+
       q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}"><span class="ol">${L[j]}</span>${esc(o)}</button>`).join("")+`</div></div>`;
  });
  h+='<h3 class="akh">Objective answers</h3><div class="akey">'+
     n.quiz.map((q,i)=>`<span><b>${i+1}</b>${L[q.a]}</span>`).join("")+'</div></div>';
  return h;
}

function noteTitle(){
  return `${classLabel(state.cls)} ${subjOf(state.subj).name} Week ${state.topic+1} - ${topicsOf(state.subj,state.term)[state.topic]}`;
}
function saveNote(box,printFn,frame){
  const T=noteTitle(), old=document.title;
  document.title=T;
  try{ if(frame) frame.contentDocument.title=T; }catch(e){}
  box.querySelector("#svh").hidden=false;
  printFn();
  setTimeout(()=>{document.title=old},1500);
}

/* Weeks where Period 1 should end after a chosen number of topic blocks (otherwise split by length) */
const PERIOD_SPLIT={"1|2":5};

function fileNote(html,week){
  const box=document.createElement("section");
  box.innerHTML=`
  <button class="btn alt backbtn no-print" id="bk">← Back to topics</button>
  <div class="bar acts no-print">
    <button class="btn" id="pr">Print</button>
    <button class="btn" id="sv">Save</button>
  </div>
  <p class="hint no-print" id="svh" hidden>In the window that opens, choose “Save as PDF” as the printer.</p>
  <div class="seg no-print" id="seg" role="tablist" aria-label="Periods" hidden></div>
  <iframe id="nf" title="Lesson note" style="width:100%;border:2px solid var(--ink);border-radius:4px;background:#fff;min-height:600px"></iframe>`;
  const fr=box.querySelector("#nf"), seg=box.querySelector("#seg");
  /* Sizes the frame to its content so the PAGE scrolls (smooth on Android).
     It never shrinks the frame first (that clamped and reset the scroll position),
     it only resizes when the height really changed, and it restores the reading position. */
  let ro=null;
  const fit=()=>{
    try{
      const d=fr.contentDocument; if(!d||!d.documentElement) return;
      const content=Math.ceil(d.documentElement.getBoundingClientRect().height);
      const border=fr.offsetHeight-fr.clientHeight;
      const want=content+border;
      if(Math.abs(want-fr.offsetHeight)<2) return;
      const y=window.scrollY;
      fr.style.height=want+"px";
      if(Math.abs(window.scrollY-y)>1) window.scrollTo({top:y,behavior:"instant"});
    }catch(e){}
  };
  let labels=[];
  const show=p=>{
    const d=fr.contentDocument;
    d.querySelectorAll("[data-period]").forEach(el=>{el.style.display=(el.dataset.period==p)?"":"none";});
    [...seg.children].forEach((b,i)=>{b.classList.toggle("on",i+1===p);b.setAttribute("aria-selected",i+1===p);});
    fit(); setTimeout(fit,120); window.scrollTo({top:0});
  };
  const setup=()=>{
    const d=fr.contentDocument, main=d.querySelector("main");
    if(!main) return fit();
    const kids=[...main.children];
    const exam=kids.filter(k=>k.classList.contains("exam"));
    const units=[];
    const pending=[];
    kids.filter(k=>!k.classList.contains("exam")).forEach(k=>{
      const c=k.className||"";
      if(/\bdivider\b/.test(c)){ pending.push(k); return; }
      if(!units.length||/\b(l-head|c-head)\b/.test(c)){ units.push([...pending,k]); pending.length=0; }
      else if(/\b(l-body|c-body)\b/.test(c)) units[units.length-1].push(k);
      else { units.push([...pending,k]); pending.length=0; }
    });
    if(pending.length&&units.length) units[0].unshift(...pending);
    if(units.length<2) return fit();
    const len=u=>u.reduce((a,e)=>a+e.textContent.length,0);
    let k=PERIOD_SPLIT[state.term+"|"+week];
    if(!k){
      const total=units.reduce((a,u)=>a+len(u),0); let run=0,best=1,bd=Infinity;
      for(let i=0;i<units.length-1;i++){run+=len(units[i]); const dd=Math.abs(run-total/2); if(dd<bd){bd=dd;best=i+1;}}
      k=best;
    }
    units.forEach((u,i)=>u.forEach(e=>e.dataset.period=i<k?1:2));
    exam.forEach(e=>e.dataset.period=2);
    const head=u=>u[0].textContent.trim().split(/\n/)[0].trim();
    labels=[head(units[0]),head(units[k])];
    seg.innerHTML="";
    [1,2].forEach(n=>{
      const b=document.createElement("button");
      b.setAttribute("role","tab");
      b.innerHTML=`Period ${n}<small>${labels[n-1].replace(/</g,"&lt;")}</small>`;
      b.onclick=()=>show(n);
      seg.appendChild(b);
    });
    seg.hidden=false;
    show(1);
  };
  fr.addEventListener("load",()=>{
    setup(); setTimeout(fit,150);
    try{
      if(window.ResizeObserver){ ro=new ResizeObserver(()=>fit()); ro.observe(fr.contentDocument.documentElement); }
    }catch(e){}
  });
  let rt=null;
  const onResize=()=>{ clearTimeout(rt); rt=setTimeout(fit,150); };
  window.addEventListener("resize",onResize);
  registerCleanup(()=>{ window.removeEventListener("resize",onResize); clearTimeout(rt); if(ro) ro.disconnect(); });
  fr.srcdoc=html;
  const doPrint=()=>{fr.contentWindow.focus();fr.contentWindow.print();};
  box.querySelector("#pr").onclick=doPrint;
  box.querySelector("#sv").onclick=()=>saveNote(box,doPrint,fr);
  box.querySelector("#bk").onclick=()=>go({topic:null});
  return box;
}

function examHist(){
  let setKey="A", view="paper";
  const box=document.createElement("section");
  box.innerHTML=`
  <button class="btn alt backbtn no-print" id="bk">← Back to topics</button>
  <div class="ex-ctl no-print">
    <div class="seg three" id="sets" role="tablist" aria-label="Examination sets"></div>
    <div class="seg" id="views" role="tablist" aria-label="View"></div>
  </div>
  <div class="bar acts no-print">
    <button class="btn" id="pr">Print</button>
    <button class="btn" id="sv">Save</button>
  </div>
  <p class="hint no-print" id="svh" hidden>In the window that opens, choose “Save as PDF” as the printer.</p>
  <div id="paper"></div>`;
  const E=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const head=(sub,showSet)=>`
    <header class="p-head">
      <div class="p-school">FAITH INTELLIGENCE SCHOOL</div>
      <div class="p-addr">Oghara, Delta State, Nigeria</div>
      <div class="p-title">${sub}</div>
      <div class="p-sub">HISTORY · PRIMARY 6${showSet?" · SET "+setKey:""}</div>
    </header>`;
  const dash='<span class="dash"></span>';
  const paperHTML=()=>{
    const mc=HIST_EXAM.mc[setKey], th=HIST_EXAM.theory[setKey];
    let h=`<article class="paper">${head("FIRST TERM EXAMINATION",false)}
    <div class="p-meta">
      <div class="full">Academic Session: <span class="blank" style="min-width:260px"></span></div>
      <div>Name: <span class="blank"></span></div>
      <div>Date: <span class="blank"></span></div>
      <div>Class: Primary 6</div>
      <div>Total Marks: 70</div>
    </div>
    <section class="p-sec"><h2>SECTION A – OBJECTIVE (30 marks)</h2>
      <p class="inst">Answer all questions. Each question carries 2 marks. Choose the correct option and write its letter in the box.</p>
      <ol class="mcq">`;
    mc.forEach((q,i)=>{
      h+=`<li><div class="q-t"><span class="n">${i+1}.</span><span class="qs">${E(q.q)}</span><span class="abox"></span><span class="m">[2 marks]</span></div>
        <div class="opts">${q.o.map((o,j)=>`<span>${"ABCD"[j]}. ${E(o)}</span>`).join("")}</div></li>`;
    });
    h+=`</ol></section>
    <section class="p-sec sec-b"><h2>SECTION B – THEORY (40 marks)</h2>
      <p class="inst">Answer all questions. Each question carries 8 marks (4 marks for each part).</p>`;
    th.forEach((q,i)=>{
      h+=`<div class="tq"><div class="tq-h"><span class="n">${i+1}.</span><span></span><span class="m">[8 marks]</span></div>`;
      q.forEach((p,j)=>{
        const lab="("+"ab"[j]+")";
        if(p.type==="fill"){
          h+=`<div class="part"><div class="pt"><span class="pl">${lab}</span><ol class="fill4">${p.items.map(it=>`<li>${E(it.s).replace("{}",dash)} <span class="m2">(2 marks)</span></li>`).join("")}</ol><span class="m">(4 marks)</span></div></div>`;
        }else if(p.type==="def"){
          h+=`<div class="part"><div class="pt"><span class="pl">${lab}</span><span>Define the following:</span><span class="m">(4 marks)</span></div>
            <ol class="fill4 defl">${p.items.map(it=>`<li>${E(it.t)} <span class="m2">(2 marks)</span><div class="lines" style="--n:2;margin-left:0"></div></li>`).join("")}</ol></div>`;
        }else{
          h+=`<div class="part"><div class="pt"><span class="pl">${lab}</span><span>${E(p.t)}</span><span class="m">(4 marks)</span></div><div class="lines" style="--n:2"></div></div>`;
        }
      });
      h+=`</div>`;
    });
    h+=`</section></article>`;
    return h;
  };
  const schemeHTML=()=>{
    const mc=HIST_EXAM.mc[setKey], th=HIST_EXAM.theory[setKey];
    let h=`<article class="paper">${head("MARKING SCHEME",true)}
    <section class="p-sec"><h2>SECTION A – OBJECTIVE (15 × 2 = 30 marks)</h2>
      <div class="key" style="margin-top:10px">${mc.map((q,i)=>`<span><b>${i+1}.</b>${q.a}</span>`).join("")}</div></section>
    <section class="p-sec ms-break"><h2>SECTION B – THEORY (5 × 8 = 40 marks)</h2>`;
    th.forEach((q,i)=>{
      h+=`<div class="ms-q"><b>${i+1}. [8 marks]</b>`;
      q.forEach((p,j)=>{
        const lab="("+"ab"[j]+")";
        if(p.type==="fill"){
          h+=`<div class="ma">${lab} <em>(4 marks, 2 marks each)</em></div>`;
          p.items.forEach((it,k)=>{ h+=`<div class="ma" style="margin-left:60px">(${["i","ii"][k]}) ${E(it.s).replace("{}","<b><u>"+E(it.a)+"</u></b>")}</div>`; });
        }else if(p.type==="def"){
          h+=`<div class="ma">${lab} <em>Define (4 marks, 2 marks each)</em></div>`;
          p.items.forEach((it,k)=>{ h+=`<div class="ma" style="margin-left:60px">(${["i","ii"][k]}) <b>${E(it.t)}:</b> ${E(it.a)}</div>`; });
        }else{
          h+=`<div class="ma">${lab} <em>(4 marks)</em> ${E(p.t)}<br>${E(p.a)}</div>`;
        }
      });
      h+=`</div>`;
    });
    h+=`</section></article>`;
    return h;
  };
  const paper=box.querySelector("#paper"), sets=box.querySelector("#sets"), views=box.querySelector("#views");
  const draw=()=>{
    paper.innerHTML=view==="paper"?paperHTML():schemeHTML();
    [...sets.children].forEach((b,i)=>{b.classList.toggle("on","ABC"[i]===setKey);b.setAttribute("aria-selected","ABC"[i]===setKey);});
    [...views.children].forEach((b,i)=>{b.classList.toggle("on",["paper","scheme"][i]===view);b.setAttribute("aria-selected",["paper","scheme"][i]===view);});
    window.scrollTo({top:0});
  };
  ["A","B","C"].forEach(k=>{
    const b=document.createElement("button"); b.setAttribute("role","tab"); b.textContent="Set "+k;
    b.onclick=()=>{setKey=k;draw();}; sets.appendChild(b);
  });
  [["Question paper","paper"],["Marking scheme","scheme"]].forEach(([l,v])=>{
    const b=document.createElement("button"); b.setAttribute("role","tab"); b.textContent=l;
    b.onclick=()=>{view=v;draw();}; views.appendChild(b);
  });
  box.querySelector("#bk").onclick=()=>go({topic:null});
  box.querySelector("#pr").onclick=()=>window.print();
  box.querySelector("#sv").onclick=()=>{
    const old=document.title;
    document.title=`Primary 6 History First Term Examination - Set ${setKey}${view==="scheme"?" Marking Scheme":""}`;
    box.querySelector("#svh").hidden=false;
    window.print();
    setTimeout(()=>{document.title=old},1500);
  };
  draw();
  return box;
}

function emptyNote(topic,msg){
  const box=document.createElement("section");
  box.innerHTML=`<button class="btn alt backbtn no-print" id="bk">← Back to topics</button>
  <h1>${esc(topic)}</h1><p class="lead">${msg||("The note for Week "+(state.topic+1)+" has not been added yet.")}</p>`;
  box.querySelector("#bk").onclick=()=>go({topic:null});
  return box;
}

function screenNote(){
  if(state.topic==="exam"){
    if(state.cls===6&&state.subj==="hist"&&state.term===1) return examHist();
    return emptyNote("Examination","The Examination has not been added yet.");
  }
  const s=subjOf(state.subj), topic=topicsOf(state.subj,state.term)[state.topic];
  const n=noteFor(state.topic);
  const full=!!n;
  if(!n) return emptyNote(topic);
  if(n.file) return fileNote(n.file,state.topic+1);
  const box=document.createElement("section");
  box.innerHTML=`
  <button class="btn alt backbtn no-print" id="bk">← Back to topics</button>
  <div class="bar acts no-print">
    <button class="btn" id="pr">Print</button>
    <button class="btn" id="sv">Save</button>
  </div>
  <p class="hint no-print" id="svh" hidden>In the window that opens, choose “Save as PDF” as the printer.</p>
  <p class="hint">Study this note on screen, or print it or save it as a PDF.</p>
  <article class="sheet${n.body?" study":""}">
    <div class="sheet-head">
      <div class="sn">FAITH INTELLIGENCE SCHOOL</div>
      <div class="st">Oghara, Delta State, Nigeria</div>
      <div class="ln">LESSON NOTE</div>
    </div>
    <table class="meta">
      <tr><td class="k">Class</td><td>${classLabel(state.cls)}</td><td class="k">Term</td><td>${termName(state.term)}</td></tr>
      <tr><td class="k">Subject</td><td>${esc(s.name)}</td><td class="k">Week</td><td>${state.topic+1}</td></tr>
      <tr><td class="k">Topic</td><td colspan="3">${esc(topic)}</td></tr>
      <tr><td class="k">Duration</td><td>${n.duration}</td><td class="k">Date</td><td>&nbsp;</td></tr>
    </table>
    ${n.body?n.body+quizHTML(n):`    <div class="sec"><h3>Objectives</h3><p>By the end of the lesson, pupils should be able to:</p>
      <ol>${n.objectives.map(o=>`<li>${o}</li>`).join("")}</ol></div>
    <div class="sec"><h3>Introduction</h3><p>${n.intro}</p></div>
    <div class="sec"><h3>Lesson content</h3><div>${n.content}</div></div>
    <div class="sec"><h3>Evaluation</h3>
      <ol>${n.evaluation.map(q=>`<li>${q}</li>`).join("")}</ol></div>
    <div class="sec"><h3>Assignment</h3><p>${n.assignment}</p></div>`}
    <div class="sign"><div>Teacher's signature</div><div>Head teacher's signature</div></div>
  </article>`;
  box.querySelectorAll("[contenteditable]").forEach(e=>e.removeAttribute("contenteditable"));
  box.addEventListener("click",ev=>{
    const b=ev.target.closest(".opt"); if(!b) return;
    const grp=b.closest(".opts"); if(grp.dataset.done) return;
    grp.dataset.done="1";
    const q=n.quiz[+b.dataset.q], pick=+b.dataset.o;
    grp.querySelectorAll(".opt").forEach(o=>{
      const j=+o.dataset.o;
      if(j===q.a) o.classList.add("right");
      else if(j===pick) o.classList.add("wrong");
    });
  });
  box.querySelector("#pr").onclick=()=>window.print();
  box.querySelector("#sv").onclick=()=>saveNote(box,()=>window.print(),null);
  box.querySelector("#bk").onclick=()=>go({topic:null});
  return box;
}

function render(){
  while(cleanups.length){ try{ cleanups.pop()(); }catch(e){} }
  app.innerHTML="";
  app.appendChild(crumbs());
  let view, back=null;
  if(state.cls===null) view=screenClass();
  else if(state.term===null){ view=screenTerm(); back=["Back to classes",{cls:null}]; }
  else if(state.subj===null){ view=screenSubjects(); back=["Back to terms",{term:null}]; }
  else if(state.topic===null){ view=screenTopics(); back=["Back to subjects",{subj:null}]; }
  else view=screenNote();
  if(back){
    const b=document.createElement("button");
    b.className="btn alt backbtn no-print";
    b.textContent="← "+back[0];
    b.onclick=()=>go(back[1]);
    app.appendChild(b);
  }
  app.appendChild(view);
}
render();
</script>
<script>
/* Progressive Web App: register the service worker (works from a GitHub Pages repo URL).
   Skipped when the file is opened directly from storage (file://). */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
      .then(function (reg) {
        reg.update();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update();
        });
      })
      .catch(function () {});
