x.<\/li><li>Materials used to make plastics and other petrochemicals.<\/li><\/ul>\n<h3>Benefits of the Petroleum Industry<\/h3>\n<ul><li>Generates government revenue and foreign exchange.<\/li><li>Creates jobs.<\/li><li>Provides fuel for vehicles and machines.<\/li><li>Supplies raw materials to factories.<\/li><li>Supports transportation and construction.<\/li><\/ul>\n<p>Problems: Oil spills, water and air pollution, damage to farmland and fishing areas, oil theft and dependence on oil revenue.<\/p>\n<h3>4. Chemical Industries<\/h3>\n<p>Chemical industries use chemical processes to manufacture useful products.<\/p>\n<p>Examples: soap, detergents, paints, fertilisers, plastics, medicines and some cosmetics.<\/p>\n<h3>Benefits:<\/h3>\n<ul><li>Supply products for homes and factories.<\/li><li>Provide fertilisers for agriculture.<\/li><li>Supply materials to other industries.<\/li><li>Create employment.<\/li><\/ul>\n<p>Chemical industries must follow safety rules to protect people and the environment.<\/p>\n<\/section>\n\n<section>\n<h2>TOURISM, BASIC METAL PRODUCTION, CONSTRUCTION AND INDUSTRIAL GROWTH<\/h2>\n<h3>1. Tourism Industry<\/h3>\n<p>The tourism industry provides services to people who visit places for leisure, education, business or other purposes.<\/p>\n<h3>Examples of tourist attractions in Nigeria:<\/h3>\n<ul><li>Yankari Game Reserve, Bauchi State.<\/li><li>Olumo Rock, Ogun State.<\/li><li>Obudu Mountain Resort, Cross River State.<\/li><\/ul>\n<h3>Benefits:<\/h3>\n<ul><li>Creates jobs and income.<\/li><li>Supports hotels, restaurants and transport businesses.<\/li><li>Promotes Nigerian culture.<\/li><li>Can earn foreign exchange from international visitors.<\/li><\/ul>\n<h3>2. Basic Metal Production Industry<\/h3>\n<p>Basic metal production involves extracting metals from ores or processing raw metals for use by other industries.<\/p>\n<h3>Examples and uses:<\/h3>\n<ul><li>Iron and steel: Buildings, bridges and machines.<\/li><li>Aluminium: Roofing sheets and cans.<\/li><li>Copper: Electrical wires and equipment.<\/li><\/ul>\n<p>Importance: Supplies materials for construction and manufacturing, creates jobs and supports engineering industries.<\/p>\n<h3>3. Construction Industry<\/h3>\n<p>The construction industry involves planning, building, repairing and maintaining structures and infrastructure.<\/p>\n<p>Examples: houses, roads, bridges, schools, hospitals and factories.<\/p>\n<p>Materials used include cement, sand, stones, iron rods, steel and timber.<\/p>\n<h3>Benefits:<\/h3>\n<ul><li>Provides buildings and roads.<\/li><li>Creates jobs for engineers, builders and artisans.<\/li><li>Supports cement, metal and transport businesses.<\/li><li>Promotes national development.<\/li><\/ul>\n<h3>4. Growth of Industries in Nigeria<\/h3>\n<p>Industrial growth means an increase in the number, size, productivity and variety of industries in a country.<\/p>\n<h3>Factors That Encourage Industrial Growth<\/h3>\n<ol><li>Availability of raw materials.<\/li><li>Reliable electricity supply.<\/li><li>Good roads, railways and ports.<\/li><li>Availability of capital.<\/li><li>Skilled workers.<\/li><li>Modern technology.<\/li><li>Markets for finished products.<\/li><li>Government support and good policies.<\/li><\/ol>\n<h3>Problems Facing Industries in Nigeria<\/h3>\n<ol><li>Unreliable electricity supply.<\/li><li>High cost of production.<\/li><li>Poor transportation in some areas.<\/li><li>Shortage of skilled workers.<\/li><li>Limited access to loans and investment.<\/li><li>Competition from imported goods.<\/li><li>Environmental pollution.<\/li><li>Poor maintenance of equipment.<\/li><\/ol>\n<h3>Ways to Promote Industrial Growth<\/h3>\n<ul><li>Improve electricity supply.<\/li><li>Build and maintain roads and other transport facilities.<\/li><li>Train workers and develop technical skills.<\/li><li>Provide loans and support local manufacturers.<\/li><li>Encourage modern technology and research.<\/li><li>Enforce environmental and safety regulations.<\/li><li>Develop agriculture to supply raw materials.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. Which of these is an example of a utility service?<\/p><div class=\"options\"><span>A. Tailoring<\/span><span>B. Electricity supply<\/span><span>C. Hairdressing<\/span><span>D. Shoe polishing<\/span><\/div><\/article>\n<article class=\"question\"><p>2. Crude oil was discovered in commercial quantities in Nigeria in ______.<\/p><div class=\"options\"><span>A. 1966<\/span><span>B. 1979<\/span><span>C. 1999<\/span><span>D. 1956<\/span><\/div><\/article>\n<article class=\"question\"><p>3. Which industry processes raw materials into finished or semi-finished products?<\/p><div class=\"options\"><span>A. Secondary industry<\/span><span>B. Primary industry<\/span><span>C. Tertiary industry<\/span><span>D. Tourism industry<\/span><\/div><\/article>\n<article class=\"question\"><p>4. ICT stands for ______.<\/p><div class=\"options\"><span>A. Industrial Construction Training<\/span><span>B. International Chemical Trade<\/span><span>C. Information and Communication Technology<\/span><span>D. Internal Computer Transport<\/span><\/div><\/article>\n<article class=\"question\"><p>5. Which of the following is a product of the chemical industry?<\/p><div class=\"options\"><span>A. Fresh cassava<\/span><span>B. Detergent<\/span><span>C. Raw timber<\/span><span>D. Live poultry<\/span><\/div><\/article>\n<article class=\"question\"><p>6. Which industry provides medical care and medicines?<\/p><div class=\"options\"><span>A. Tourism<\/span><span>B. Construction<\/span><span>C. Healthcare<\/span><span>D. Basic metal production<\/span><\/div><\/article>\n<article class=\"question\"><p>7. One major problem facing industries in Nigeria is ______.<\/p><div class=\"options\"><span>A. Unlimited electricity supply<\/span><span>B. Unlimited capital<\/span><span>C. Too many skilled workers<\/span><span>D. Unreliable electricity supply<\/span><\/div><\/article>\n<article class=\"question\"><p>8. Which of these is an agricultural product?<\/p><div class=\"options\"><span>A. Cocoa<\/span><span>B. Cement<\/span><span>C. Steel rod<\/span><span>D. Plastic chair<\/span><\/div><\/article>\n<article class=\"question\"><p>9. The tourism industry provides services mainly to people who ______.<\/p><div class=\"options\"><span>A. drill oil wells only<\/span><span>B. manufacture iron rods only<\/span><span>C. visit places for different purposes<\/span><span>D. produce cement only<\/span><\/div><\/article>\n<article class=\"question\"><p>10. Which of these is a natural resource found in Nigeria?<\/p><div class=\"options\"><span>A. Exercise book<\/span><span>B. Limestone<\/span><span>C. Plastic bucket<\/span><span>D. School uniform<\/span><\/div><\/article>\n<article class=\"question\"><p>11. A factory that processes cassava into garri belongs mainly to the ______ industry.<\/p><div class=\"options\"><span>A. Tertiary<\/span><span>B. Banking<\/span><span>C. Tourism<\/span><span>D. Secondary<\/span><\/div><\/article>\n<article class=\"question\"><p>12. Iron and steel are important in the ______ industry.<\/p><div class=\"options\"><span>A. Construction<\/span><span>B. Tourism<\/span><span>C. Fishing<\/span><span>D. Healthcare only<\/span><\/div><\/article>\n<article class=\"question\"><p>13. An industry is an economic activity concerned with producing goods or ______.<\/p><div class=\"options\"><span>A. destroying roads<\/span><span>B. reducing knowledge<\/span><span>C. providing services<\/span><span>D. wasting resources<\/span><\/div><\/article>\n<article class=\"question\"><p>14. Which action can help promote industrial growth in Nigeria?<\/p><div class=\"options\"><span>A. Destroying roads<\/span><span>B. Improving electricity supply<\/span><span>C. Discouraging technical education<\/span><span>D. Preventing local production<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Which of the following is a primary industry?<\/p><div class=\"options\"><span>A. Banking<\/span><span>B. Tourism<\/span><span>C. Telecommunications<\/span><span>D. Fishing<\/span><\/div><\/article>\n<\/div>\n<\/section>\n\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\">\n<div class=\"answer\"><span>1.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>2.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>3.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>4.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>5.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>6.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>7.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>8.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>9.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>10.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>11.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>12.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>13.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>14.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>15.<\/span><strong>D<\/strong><\/div>\n<\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"},
"hist|3|2":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n:root{--ink:#243447;--muted:#5b6b7a;--teal:#0f766e;--soft:#e7f5f2;--gold:#d99a24;--paper:#fffdf8;--line:#dfe7e5;--shadow:0 18px 45px rgba(33,55,72,.11)}\n*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(15,118,110,.08),transparent 28rem),linear-gradient(135deg,#eef7f5,#f8f4ea);font-family:\"Segoe UI\",Arial,sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 32px));margin:32px auto;padding:clamp(24px,5vw,62px);background:var(--paper);border:1px solid rgba(15,118,110,.14);border-radius:24px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 32px;padding-bottom:18px;border-bottom:3px solid var(--gold);color:var(--teal);font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;letter-spacing:.08em}section{margin:0 0 40px}h2{margin:0 0 19px;padding:12px 16px;border-left:6px solid var(--teal);border-radius:0 10px 10px 0;background:var(--soft);color:#155e59;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.35;letter-spacing:.045em}h3{margin:24px 0 8px;color:#315263;font-size:1.08rem}p{margin:9px 0}ul,ol{margin:10px 0 16px;padding-left:28px}li{margin:5px 0;padding-left:4px}.questions{display:grid;gap:16px;margin-top:12px}.question{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.question p{margin:0 0 7px;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;color:var(--muted)}.answer-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #c9e3de;border-radius:11px;background:#f1faf8;font-weight:700}.answer strong{color:var(--teal)}\n@media(max-width:560px){main{width:min(100% - 18px,920px);margin:9px auto;padding:22px 17px;border-radius:17px}.options{grid-template-columns:1fr}.answer-key{grid-template-columns:repeat(3,minmax(0,1fr))}}\n<\/style>\n<\/head>\n<body>\n<main>\n<p class=\"eyebrow\">THE GROWTH OF INDUSTRIES IN NIGERIA (2)<\/p>\n<section>\n<h2>LOCATION OF INDUSTRIES IN NIGERIA<\/h2>\n<h3>Meaning of Location of Industries<\/h3>\n<p>The location of industries refers to the places where factories, companies and other industrial activities are established.<\/p>\n<h3>Major Industrial Areas in Nigeria<\/h3>\n<ol><li>Lagos State: Manufacturing, food processing, textiles and chemicals.<\/li><li>Ogun State: Cement production, manufacturing and food processing.<\/li><li>Kano State: Textiles, leather and food processing.<\/li><li>Rivers State: Oil and gas industries.<\/li><li>Delta State: Oil and gas and agricultural processing.<\/li><li>Anambra State: Automobile-related businesses and manufacturing.<\/li><li>Kaduna State: Textiles and food processing.<\/li><li>Oyo State: Food processing and manufacturing.<\/li><\/ol>\n<h3>Why Industries Are Located in Different Places<\/h3>\n<p>Industries are established in places that provide the resources and facilities they need. For example, an oil-related industry may locate near crude oil production areas, while a food factory may locate near farms.<\/p>\n<\/section>\n<section>\n<h2>FACTORS THAT DETERMINE THE LOCATION OF INDUSTRIES<\/h2>\n<p>The major factors that influence industrial location are:<\/p>\n<ol><li>Raw materials: Industries locate near materials needed for production to reduce transport costs. For example, cement factories may locate near limestone deposits.<\/li><li>Electricity and water: Factories need electricity to operate machines and water for production.<\/li><li>Transportation: Roads, railways and ports help move raw materials and finished goods.<\/li><li>Labour: Industries need skilled and unskilled workers.<\/li><li>Markets: Industries may locate near towns and cities where their products can be sold.<\/li><li>Capital: Money and resources are needed to establish and operate industries.<\/li><li>Government policies: Good policies, industrial estates and infrastructure can attract industries.<\/li><li>Security: Safe locations protect workers, equipment and goods.<\/li><\/ol>\n<\/section>\n<section>\n<h2>LOCATION OF DIFFERENT TYPES OF INDUSTRIES IN NIGERIA<\/h2>\n<p>Different industries are located according to the resources, facilities and markets they need.<\/p>\n<ol><li>Petroleum and Oil and Gas Industries: Found mainly in the Niger Delta, including Delta, Rivers, Bayelsa and Akwa Ibom States, where crude oil and natural gas are produced.<\/li><li>Cement Industries: Found in states such as Ogun, Kogi, Benue and Cross River. They need raw materials such as limestone, clay and gypsum.<\/li><li>Food-Processing Industries: Found in Lagos, Ogun, Kano and Oyo States, often near farms or markets.<\/li><li>Textile and Garment Industries: Found in places such as Kano, Kaduna, Lagos and Ogun States.<\/li><li>Automobile and Metal Industries: Nnewi in Anambra State is known for automobile-related businesses. Lagos and Ogun also have metalworking and manufacturing industries.<\/li><li>Chemical Industries: Found in industrial areas of Lagos, Ogun, Kano and Rivers States.<\/li><li>Agricultural Industries: Process crops such as cocoa, cassava, rice and palm produce. They often locate near farming areas.<\/li><li>ICT Industries: Technology businesses are found in cities such as Lagos and Abuja, where there are markets, skilled workers and communication networks.<\/li><\/ol>\n<\/section>\n<section>\n<h2>BENEFITS OF INDUSTRIES TO THE NIGERIAN ECONOMY<\/h2>\n<h3>Meaning of Economy<\/h3>\n<p>An economy is the system through which people produce, distribute and consume goods and services in a country.<\/p>\n<h3>Benefits of Industries<\/h3>\n<ol><li>Employment: Industries provide jobs for engineers, technicians, drivers, accountants and other workers.<\/li><li>Production of Goods: They produce goods such as cement, clothes, medicines, processed food and furniture.<\/li><li>Government Revenue: They pay taxes, duties and other charges that help the government provide public services.<\/li><li>Infrastructure Development: Industries encourage the development of roads, electricity, water systems and communication facilities.<\/li><li>Trade: They produce goods for sale within Nigeria and for export.<\/li><li>Improved Living Standards: Jobs and useful products can improve people's living conditions.<\/li><li>Skills and Technology: Workers learn technical skills and use modern machines.<\/li><li>Growth of Small Businesses: Industries provide business opportunities for suppliers, transport companies and repair services.<\/li><\/ol>\n<\/section>\n<section>\n<h2>OTHER BENEFITS, PROBLEMS AND PROMOTION OF INDUSTRIAL GROWTH<\/h2>\n<h3>Other Benefits of Industries<\/h3>\n<ol><li>Use of Local Raw Materials: Industries provide markets for agricultural produce and minerals.<\/li><li>Foreign Exchange: Exporting manufactured goods can earn foreign exchange.<\/li><li>Rural Development: Industries can create jobs and encourage the provision of facilities in rural areas.<\/li><li>Economic Diversification: Industries help Nigeria develop other sources of income instead of depending too heavily on crude oil.<\/li><li>Support for Agriculture: Food-processing factories buy crops from farmers.<\/li><li>National Development: Industrial growth supports production, trade, investment and skills development.<\/li><\/ol>\n<h3>Problems Facing Industries in Nigeria<\/h3>\n<ol><li>Unreliable electricity supply.<\/li><li>Poor roads and transportation facilities.<\/li><li>High cost of production.<\/li><li>Shortage of skilled workers.<\/li><li>Limited access to capital and loans.<\/li><li>Competition from imported goods.<\/li><li>Environmental pollution.<\/li><li>Insecurity.<\/li><\/ol>\n<h3>Ways to Promote Industrial Growth<\/h3>\n<ol><li>Improve electricity supply.<\/li><li>Build and maintain good roads and transport facilities.<\/li><li>Provide technical and vocational education.<\/li><li>Make loans and funding available to suitable businesses.<\/li><li>Support local manufacturers and small businesses.<\/li><li>Encourage modern technology.<\/li><li>Improve security in industrial areas.<\/li><li>Enforce environmental protection laws.<\/li><li>Ensure access to raw materials.<\/li><li>Encourage investment in different sectors of the economy.<\/li><\/ol>\n<\/section>\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. Which of the following is a major industrial state in Nigeria?<\/p><div class=\"options\"><span>A. No state has industries<\/span><span>B. Only rural villages have industries<\/span><span>C. Industries exist only outside Nigeria<\/span><span>D. Lagos State<\/span><\/div><\/article>\n<article class=\"question\"><p>2. The money and resources needed to establish a business are called ______.<\/p><div class=\"options\"><span>A. Capital<\/span><span>B. Tourism<\/span><span>C. Pollution<\/span><span>D. Rainfall<\/span><\/div><\/article>\n<article class=\"question\"><p>3. Petroleum industries are strongly associated with the ______ region of Nigeria.<\/p><div class=\"options\"><span>A. Sahara<\/span><span>B. Sahel<\/span><span>C. Niger Delta<\/span><span>D. Jos Plateau only<\/span><\/div><\/article>\n<article class=\"question\"><p>4. Industries contribute to government revenue through ______.<\/p><div class=\"options\"><span>A. School attendance only<\/span><span>B. Rainfall<\/span><span>C. Sporting activities only<\/span><span>D. Taxes and other payments<\/span><\/div><\/article>\n<article class=\"question\"><p>5. The location of industries refers to ______.<\/p><div class=\"options\"><span>A. The names of industrial workers<\/span><span>B. The places where industries are established<\/span><span>C. The prices of manufactured goods<\/span><span>D. The number of customers in a shop<\/span><\/div><\/article>\n<article class=\"question\"><p>6. Which of the following is a problem facing industries in Nigeria?<\/p><div class=\"options\"><span>A. Unlimited capital for every business<\/span><span>B. Perfect electricity supply everywhere<\/span><span>C. Unreliable electricity supply<\/span><span>D. No need for transportation<\/span><\/div><\/article>\n<article class=\"question\"><p>7. Which of the following is an important factor in locating a cement factory?<\/p><div class=\"options\"><span>A. Availability of limestone<\/span><span>B. Number of football teams<\/span><span>C. Distance from every road<\/span><span>D. Lack of water<\/span><\/div><\/article>\n<article class=\"question\"><p>8. One benefit of exporting manufactured goods is that Nigeria can earn ______.<\/p><div class=\"options\"><span>A. Rainfall<\/span><span>B. School uniforms<\/span><span>C. Raw soil<\/span><span>D. Foreign exchange<\/span><\/div><\/article>\n<article class=\"question\"><p>9. Industries need good transportation to ______.<\/p><div class=\"options\"><span>A. Prevent the sale of goods<\/span><span>B. Move raw materials and finished products<\/span><span>C. Stop workers from coming to work<\/span><span>D. Increase the distance to markets<\/span><\/div><\/article>\n<article class=\"question\"><p>10. Which of the following can help promote industrial growth?<\/p><div class=\"options\"><span>A. Destroying roads<\/span><span>B. Discouraging technical education<\/span><span>C. Improving electricity supply<\/span><span>D. Preventing access to raw materials<\/span><\/div><\/article>\n<article class=\"question\"><p>11. Which industry processes agricultural products into food?<\/p><div class=\"options\"><span>A. Food-processing industry<\/span><span>B. Tourism industry<\/span><span>C. Banking industry<\/span><span>D. Entertainment industry<\/span><\/div><\/article>\n<article class=\"question\"><p>12. Industrial growth can help reduce dependence on imported goods by ______.<\/p><div class=\"options\"><span>A. Stopping all local production<\/span><span>B. Increasing local production<\/span><span>C. Closing every factory<\/span><span>D. Discouraging skilled workers<\/span><\/div><\/article>\n<article class=\"question\"><p>13. Industries can support small businesses by ______.<\/p><div class=\"options\"><span>A. Preventing them from earning income<\/span><span>B. Stopping all transportation<\/span><span>C. Removing every market<\/span><span>D. Buying their supplies and using their services<\/span><\/div><\/article>\n<article class=\"question\"><p>14. Which of the following is a factor that attracts industries to a location?<\/p><div class=\"options\"><span>A. Lack of workers<\/span><span>B. Poor security<\/span><span>C. Availability of raw materials<\/span><span>D. Absence of transportation<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Industries can help improve living standards when they ______.<\/p><div class=\"options\"><span>A. Create jobs and produce useful goods<\/span><span>B. Pollute every river<\/span><span>C. Prevent people from working<\/span><span>D. Destroy all roads<\/span><\/div><\/article>\n<\/div>\n<\/section>\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\"><div class=\"answer\"><span>1.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>2.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>3.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>4.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>5.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>6.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>7.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>8.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>9.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>10.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>11.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>12.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>13.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>14.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>15.<\/span><strong>A<\/strong><\/div><\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"},
"eng|1|0":{
  duration:"40 minutes", period:"Week 1",
  objectives:["define a noun and give examples;","identify common, proper, abstract, collective and material nouns in sentences;","use nouns correctly in their own sentences."],
  intro:"Ask pupils to name five things they can see in the classroom, five people they know and five places in Delta State. Write their answers on the board. Explain that every one of these words is a noun.",
  content:`<p><b>A noun</b> is a word that names a person, place, animal, thing or idea.</p>
  <table class="t"><tr><th>Type of noun</th><th>Meaning</th><th>Examples</th></tr>
  <tr><td>Common noun</td><td>Names any person, place or thing</td><td>girl, market, book, river</td></tr>
  <tr><td>Proper noun</td><td>Names a particular person, place or thing; starts with a capital letter</td><td>Ngozi, Asaba, Monday, Niger</td></tr>
  <tr><td>Abstract noun</td><td>Names a feeling, idea or quality you cannot touch</td><td>honesty, love, courage, peace</td></tr>
  <tr><td>Collective noun</td><td>Names a group of people, animals or things</td><td>a class of pupils, a flock of birds, a bunch of keys</td></tr>
  <tr><td>Material noun</td><td>Names what things are made of</td><td>gold, wood, water, cotton</td></tr></table>
  <div class="ex"><p><b>Examples in sentences</b></p><ul>
  <li>The <u>teacher</u> read a <u>story</u> to the <u>class</u>. (common and collective nouns)</li>
  <li><u>Emeka</u> travelled from <u>Warri</u> to <u>Asaba</u>. (proper nouns)</li>
  <li><u>Honesty</u> is the best policy. (abstract noun)</li></ul></div>`,
  evaluation:["What is a noun?","Name the type of noun: <i>a team of footballers</i>.","Pick the abstract noun: table, kindness, river.","Write one sentence using the proper noun <i>Delta</i>.","Give two examples of material nouns."],
  assignment:"Write ten sentences. Use two nouns of each type (common, proper, abstract, collective, material) and underline them."
},
"math|1|0":{
  duration:"40 minutes", period:"Week 1",
  objectives:["state the place value and face value of digits up to millions;","read, write and expand numbers up to 9,999,999;","compare and order large numbers."],
  intro:"Write 4,305,276 on the board and ask pupils to read it. Revise the columns they already know: units, tens, hundreds and thousands.",
  content:`<p><b>Place value</b> is the value of a digit because of where it sits in a number. <b>Face value</b> is the digit itself.</p>
  <table class="t"><tr><th>Millions</th><th>Hundred thousands</th><th>Ten thousands</th><th>Thousands</th><th>Hundreds</th><th>Tens</th><th>Units</th></tr>
  <tr><td>4</td><td>3</td><td>0</td><td>5</td><td>2</td><td>7</td><td>6</td></tr></table>
  <div class="ex"><p><b>Worked example: 4,305,276</b></p><ul>
  <li><b>In words:</b> Four million, three hundred and five thousand, two hundred and seventy-six.</li>
  <li><b>Expanded form:</b> 4,000,000 + 300,000 + 0 + 5,000 + 200 + 70 + 6</li>
  <li><b>Place value of 3:</b> 300,000 (three hundred thousand). <b>Face value of 3:</b> 3</li></ul></div>
  <p><b>Comparing numbers:</b> compare digits from the left. The first place where they differ decides which number is bigger. So 4,305,276 &gt; 4,299,999 because 3 hundred-thousands is greater than 2 hundred-thousands.</p>`,
  evaluation:["Write 6,070,408 in words.","What is the place value of 7 in 5,716,239?","Write 2,450,030 in expanded form.","Arrange from smallest to largest: 3,404,500; 3,044,500; 3,440,500.","What is the face value of 9 in 9,120,000?"],
  assignment:"Write five seven-digit numbers of your own. For each, write the number in words and in expanded form."
},
"bst|1|1":{
  duration:"40 minutes", period:"Week 1",
  objectives:["define digestion and name the parts of the human digestive system;","describe the function of each part;","state ways of keeping the digestive system healthy."],
  intro:"Ask: “What happens to the food you ate this morning?” Let pupils share ideas, then explain that the body breaks food down into small parts it can use. This process is called digestion.",
  content:`<p><b>Digestion</b> is the breaking down of food into small soluble parts that the body can absorb and use.</p>
  <table class="t"><tr><th>Part</th><th>Function</th></tr>
  <tr><td>Mouth</td><td>Teeth chew food; saliva softens it and starts digesting starch.</td></tr>
  <tr><td>Oesophagus (food pipe)</td><td>Pushes food down to the stomach.</td></tr>
  <tr><td>Stomach</td><td>Churns food and mixes it with digestive juices.</td></tr>
  <tr><td>Small intestine</td><td>Digestion is completed here; digested food passes into the blood.</td></tr>
  <tr><td>Large intestine</td><td>Absorbs water; waste is formed.</td></tr>
  <tr><td>Rectum and anus</td><td>Store and remove solid waste (faeces).</td></tr></table>
  <div class="ex"><p><b>Keeping the digestive system healthy</b></p><ul>
  <li>Wash your hands before eating and after using the toilet.</li><li>Chew food well and eat a balanced diet.</li><li>Drink clean water and eat fruits and vegetables.</li></ul></div>`,
  evaluation:["What is digestion?","Where does digestion of starch begin?","Which part absorbs digested food into the blood?","Name two ways of keeping the digestive system healthy.","Draw and label the digestive system."],
  assignment:"Draw the human digestive system in your notebook. Label six parts and write one function beside each."
},
"civ|1|0":{
  duration:"35 minutes", period:"Week 1",
  objectives:["name the national symbols of Nigeria;","explain the meaning of the colours and parts of each symbol;","show respect for the national symbols."],
  intro:"Lead the class in the National Anthem. Ask: “What do we see on our flag, our coat of arms and our naira notes?” Explain that these are national symbols.",
  content:`<p><b>National symbols</b> are things that stand for a nation and remind citizens of its identity and values.</p>
  <table class="t"><tr><th>Symbol</th><th>Meaning</th></tr>
  <tr><td>National flag</td><td>Green stands for agriculture and natural wealth; white stands for peace and unity.</td></tr>
  <tr><td>Coat of arms</td><td>Black shield for fertile soil; two horses for dignity; eagle for strength; Y-shape for the Rivers Niger and Benue; yellow flowers for the national flower (Costus spectabilis).</td></tr>
  <tr><td>National anthem</td><td>A song of loyalty, prayer and hope for Nigeria.</td></tr>
  <tr><td>National pledge</td><td>A promise to be faithful, loyal and honest and to serve Nigeria.</td></tr></table>
  <div class="ex"><p><b>Showing respect</b></p><ul><li>Stand at attention when the anthem is sung or the flag is raised.</li><li>Never let the flag touch the ground.</li><li>Recite the pledge with sincerity.</li></ul></div>`,
  evaluation:["List four national symbols of Nigeria.","What does the green colour of the flag stand for?","What does the white colour stand for?","Why do the rivers appear on the coat of arms?","Recite the National Pledge."],
  assignment:"Draw the Nigerian flag, colour it correctly and write two sentences about what it means."
}
};

closer to the Sun.<\/li><li>They have solid, rocky surfaces.<\/li><li>They are smaller than the giant outer planets.<\/li><li>Earth is the only planet currently known to support life.<\/li><\/ul>\n<h3>Outer Planets<\/h3>\n<p>The four outer planets are Jupiter, Saturn, Uranus and Neptune.<\/p>\n<h3>Characteristics:<\/h3>\n<ul><li>They are farther from the Sun.<\/li><li>They are much larger than the inner planets.<\/li><li>They have rings and many moons.<\/li><li>Saturn has the most noticeable ring system.<\/li><\/ul>\n<h3>Important Terms<\/h3>\n<ol><li>Rotation: The spinning of a planet on its axis. Earth's rotation causes day and night.<\/li><li>Revolution: The movement of a planet around the Sun. Earth takes about 365¼ days to complete one revolution.<\/li><li>Orbit: The path followed by a planet around the Sun.<\/li><li>Natural Satellite: A heavenly body that moves around a planet. The Moon is Earth's natural satellite.<\/li><\/ol>\n<h3>Importance of the Solar System<\/h3>\n<ul><li>The Sun provides energy for life on Earth.<\/li><li>Earth provides a home for plants, animals and human beings.<\/li><li>Studying the planets helps us understand Earth and space.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>3. GRAVITY<\/h2>\n<p>Gravity is the force of attraction between objects that have mass. Earth's gravity pulls objects towards its centre.<\/p>\n<h3>Examples of Gravity<\/h3>\n<ul><li>A mango falling from a tree.<\/li><li>A ball returning to the ground after being thrown up.<\/li><li>The Moon moving around the Earth.<\/li><\/ul>\n<h3>Importance of Gravity<\/h3>\n<ol><li>It keeps people and objects on Earth's surface.<\/li><li>It helps hold the atmosphere around Earth.<\/li><li>It causes unsupported objects to fall towards the ground.<\/li><li>It helps keep the planets in orbit around the Sun.<\/li><li>It helps keep the Moon in orbit around Earth.<\/li><\/ol>\n<h3>Mass and Weight<\/h3>\n<ul><li>Mass: The amount of matter in an object. It is measured in kilograms (kg).<\/li><li>Weight: The force with which gravity pulls an object. It is measured in newtons (N).<\/li><\/ul>\n<p>Mass remains the same on Earth and the Moon, but weight changes because the Moon's gravity is weaker than Earth's gravity.<\/p>\n<\/section>\n\n<section>\n<h2>4. WEIGHTLESSNESS<\/h2>\n<h3>Meaning of Weightlessness<\/h3>\n<p>Weightlessness is a condition in which a person or object experiences no supporting force and feels weightless.<\/p>\n<p>Astronauts experience weightlessness while orbiting Earth because they and their spacecraft are falling freely together. Gravity still acts on them.<\/p>\n<h3>Causes of Weightlessness<\/h3>\n<ol><li>Free fall.<\/li><li>Movement in an orbiting spacecraft.<\/li><li>Astronauts and objects falling freely together around Earth.<\/li><\/ol>\n<h3>Effects of Weightlessness<\/h3>\n<ol><li>Astronauts and objects appear to float inside spacecraft.<\/li><li>Food and water can float away if not handled carefully.<\/li><li>Prolonged weightlessness can weaken muscles and bones.<\/li><\/ol>\n<h3>How Astronauts Live in Space<\/h3>\n<ul><li>They sleep in sleeping bags attached to the spacecraft.<\/li><li>They use special food containers.<\/li><li>They hold rails or push gently against surfaces to move.<\/li><li>They exercise regularly to reduce muscle and bone loss.<\/li><li>They secure tools to prevent them from floating away.<\/li><\/ul>\n<h3>Difference Between Gravity and Weightlessness<\/h3>\n<table class=\"comparison\"><thead><tr><th>Gravity<\/th><th>Weightlessness<\/th><\/tr><\/thead><tbody><tr><td>It is a force of attraction between objects with mass.<\/td><td>It is a condition in which an object feels weightless.<\/td><\/tr><tr><td>It pulls objects towards one another.<\/td><td>It can occur during free fall.<\/td><\/tr><tr><td>It helps keep us on Earth's surface.<\/td><td>It allows astronauts to float inside orbiting spacecraft.<\/td><\/tr><tr><td>It acts on objects on Earth and in space.<\/td><td>It can occur even when gravity is still acting.<\/td><\/tr><\/tbody><\/table>\n<\/section>\n\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. Which planet is the largest in the solar system?<\/p><div class=\"options\"><span>A. Earth<\/span><span>B. Jupiter<\/span><span>C. Neptune<\/span><span>D. Venus<\/span><\/div><\/article>\n<article class=\"question\"><p>2. The force that pulls objects towards Earth is called ______.<\/p><div class=\"options\"><span>A. Electricity<\/span><span>B. Friction<\/span><span>C. Gravity<\/span><span>D. Magnetism<\/span><\/div><\/article>\n<article class=\"question\"><p>3. Which of these is Earth's natural satellite?<\/p><div class=\"options\"><span>A. Mars<\/span><span>B. The Moon<\/span><span>C. The Sun<\/span><span>D. Venus<\/span><\/div><\/article>\n<article class=\"question\"><p>4. The smallest planet in the solar system is ______.<\/p><div class=\"options\"><span>A. Mercury<\/span><span>B. Saturn<\/span><span>C. Earth<\/span><span>D. Jupiter<\/span><\/div><\/article>\n<article class=\"question\"><p>5. The spinning of a planet on its axis is called ______.<\/p><div class=\"options\"><span>A. Revolution<\/span><span>B. Weightlessness<\/span><span>C. Rotation<\/span><span>D. Gravity<\/span><\/div><\/article>\n<article class=\"question\"><p>6. Which planet is known as the Red Planet?<\/p><div class=\"options\"><span>A. Venus<\/span><span>B. Mars<\/span><span>C. Uranus<\/span><span>D. Saturn<\/span><\/div><\/article>\n<article class=\"question\"><p>7. The unit used to measure mass is the ______.<\/p><div class=\"options\"><span>A. Metre<\/span><span>B. Newton<\/span><span>C. Litre<\/span><span>D. Kilogram<\/span><\/div><\/article>\n<article class=\"question\"><p>8. Astronauts experience weightlessness in an orbiting spacecraft because they are ______.<\/p><div class=\"options\"><span>A. Outside the reach of all gravity<\/span><span>B. In continuous free fall with the spacecraft<\/span><span>C. No longer made of matter<\/span><span>D. Heavier than Earth<\/span><\/div><\/article>\n<article class=\"question\"><p>9. Which planet is closest to the Sun?<\/p><div class=\"options\"><span>A. Mercury<\/span><span>B. Earth<\/span><span>C. Mars<\/span><span>D. Neptune<\/span><\/div><\/article>\n<article class=\"question\"><p>10. The path followed by a planet around the Sun is called its ______.<\/p><div class=\"options\"><span>A. Axis<\/span><span>B. Surface<\/span><span>C. Orbit<\/span><span>D. Atmosphere<\/span><\/div><\/article>\n<article class=\"question\"><p>11. Which planet is famous for its large ring system?<\/p><div class=\"options\"><span>A. Mercury<\/span><span>B. Saturn<\/span><span>C. Earth<\/span><span>D. Mars<\/span><\/div><\/article>\n<article class=\"question\"><p>12. Weight is measured in ______.<\/p><div class=\"options\"><span>A. Kilograms<\/span><span>B. Litres<\/span><span>C. Metres<\/span><span>D. Newtons<\/span><\/div><\/article>\n<article class=\"question\"><p>13. Earth's rotation causes ______.<\/p><div class=\"options\"><span>A. Day and night<\/span><span>B. Weightlessness<\/span><span>C. The Moon to disappear<\/span><span>D. The Sun to stop shining<\/span><\/div><\/article>\n<article class=\"question\"><p>14. Which of these can help astronauts maintain muscle strength in space?<\/p><div class=\"options\"><span>A. Avoiding movement<\/span><span>B. Sleeping all day<\/span><span>C. Exercising regularly<\/span><span>D. Eating only solid food<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Which statement about gravity is correct?<\/p><div class=\"options\"><span>A. Gravity exists only on Earth.<\/span><span>B. Gravity helps keep planets in orbit around the Sun.<\/span><span>C. Gravity acts only on living things.<\/span><span>D. Gravity makes all objects float.<\/span><\/div><\/article>\n<\/div>\n<\/section>\n\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\"><div class=\"answer\"><span>1.<   "bst|1|1":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n:root{--ink:#243447;--muted:#5b6b7a;--teal:#0f766e;--soft:#e7f5f2;--gold:#d99a24;--paper:#fffdf8;--line:#dfe7e5;--space:#172554;--shadow:0 18px 45px rgba(33,55,72,.11)}\n*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(15,118,110,.08),transparent 28rem),linear-gradient(135deg,#eef7f5,#f8f4ea);font-family:\"Segoe UI\",Arial,sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 32px));margin:32px auto;padding:clamp(24px,5vw,62px);background:var(--paper);border:1px solid rgba(15,118,110,.14);border-radius:24px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 32px;padding-bottom:18px;border-bottom:3px solid var(--gold);color:var(--teal);font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;letter-spacing:.08em}section{margin:0 0 40px}h2{margin:0 0 19px;padding:12px 16px;border-left:6px solid var(--teal);border-radius:0 10px 10px 0;background:var(--soft);color:#155e59;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.35;letter-spacing:.045em}h3{margin:24px 0 8px;color:#315263;font-size:1.08rem}p{margin:9px 0}ul,ol{margin:10px 0 16px;padding-left:28px}li{margin:5px 0;padding-left:4px}.comparison{width:100%;margin:18px 0;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff}.comparison th,.comparison td{padding:13px 15px;text-align:left;vertical-align:top;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.comparison th{background:var(--soft);color:#155e59;font-weight:800}.comparison th:last-child,.comparison td:last-child{border-right:0}.comparison tr:last-child td{border-bottom:0}.questions{display:grid;gap:16px;margin-top:12px}.question{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.question p{margin:0 0 7px;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;color:var(--muted)}.answer-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #c9e3de;border-radius:11px;background:#f1faf8;font-weight:700}.answer strong{color:var(--teal)}\n@media(max-width:560px){main{width:min(100% - 18px,920px);margin:9px auto;padding:22px 17px;border-radius:17px}.options{grid-template-columns:1fr}.comparison{font-size:.91rem}.comparison th,.comparison td{padding:10px}.answer-key{grid-template-columns:repeat(3,minmax(0,1fr))}}\n.comparison{width:100%;margin:18px 0;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #dfe7e5;border-radius:14px;background:#fff}.comparison th,.comparison td{padding:13px 15px;text-align:left;vertical-align:top;border-right:1px solid #dfe7e5;border-bottom:1px solid #dfe7e5}.comparison th{background:#e7f5f2;color:#155e59;font-weight:800}.comparison th:last-child,.comparison td:last-child{border-right:0}.comparison tr:last-child td{border-bottom:0}<\/style>\n<\/head>\n<body>\n<main>\n<section>\n<p class=\"eyebrow\">THE EARTH AND ITS MOVEMENT<\/p>\n<h2>THE SUN<\/h2>\n<p>The Sun is a star at the centre of our solar system. It produces its own light and heat and is the main source of energy for Earth.<\/p>\n<h3>Characteristics of the Sun<\/h3>\n<ol><li>It is a star made mainly of hot gases.<\/li><li>It produces its own light and heat.<\/li><li>It is much larger than Earth.<\/li><li>It is about 150 million kilometres from Earth.<\/li><\/ol>\n<h3>Importance of the Sun<\/h3>\n<ol><li>Provides light and heat.<\/li><li>Helps plants make food through photosynthesis.<\/li><li>Drives the water cycle through evaporation.<\/li><li>Helps dry clothes and agricultural products.<\/li><li>Provides solar energy for generating electricity.<\/li><li>Supports life on Earth.<\/li><\/ol>\n<h3>Harmful Effects of Excessive Sunlight<\/h3>\n<ol><li>Sunburn and damage to the skin and eyes.<\/li><li>Dehydration and heatstroke.<\/li><li>Drying up of crops when water is insufficient.<\/li><\/ol>\n<p><strong>Safety Measures:<\/strong> Drink enough water, wear a hat, stay in the shade and avoid prolonged exposure to strong sunlight.<\/p>\n<\/section>\n\n<section>\n<h2>EFFECTS OF THE INTERACTION BETWEEN THE SUN AND THE EARTH<\/h2>\n<p>The Earth receives light and heat from the Sun. Their interaction has several effects:<\/p>\n<ol><li>Day and Night: Earth's rotation causes the side facing the Sun to experience day and the opposite side to experience night.<\/li><li>Temperature: Places receiving more direct sunlight generally become warmer.<\/li><li>Plant Growth: Plants use sunlight, water and carbon dioxide to make food through photosynthesis.<\/li><li>Water Cycle: The Sun heats water, causing evaporation. Water vapour cools and condenses into clouds before falling as precipitation, such as rain.<\/li><li>Weather: Uneven heating of Earth's surface contributes to winds and other weather changes.<\/li><li>Seasons: Earth's revolution and the tilt of its axis cause seasonal changes.<\/li><li>Solar Energy: Solar panels convert sunlight into electricity.<\/li><\/ol>\n<\/section>\n\n<section>\n<h2>ROTATION OF THE EARTH<\/h2>\n<h3>Meaning of Rotation<\/h3>\n<p>Rotation is the spinning of the Earth on its imaginary axis, which passes through the North Pole and South Pole.<\/p>\n<p>Earth rotates from west to east and takes approximately 24 hours to complete one rotation.<\/p>\n<h3>Effects of Earth's Rotation<\/h3>\n<ol><li>Day and Night: The side facing the Sun has day, while the opposite side has night.<\/li><li>Apparent Movement of the Sun: The Sun appears to rise in the east and set in the west.<\/li><li>Differences in Local Time: Different places face the Sun at different times.<\/li><li>Movement of Winds and Ocean Currents: Earth's rotation influences their directions through the Coriolis effect.<\/li><\/ol>\n<h3>Simple Demonstration<\/h3>\n<p>Use a ball to represent Earth and a torch to represent the Sun. Shine the torch on the ball and turn it slowly. The illuminated side represents day, while the dark side represents night.<\/p>\n<h3>Rotation and Time<\/h3>\n<ul><li>One complete rotation = 24 hours.<\/li><li>Earth rotates through 360° in 24 hours.<\/li><li>360° ÷ 24 = 15° per hour.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>REVOLUTION OF THE EARTH<\/h2>\n<h3>Meaning of Revolution<\/h3>\n<p>Revolution is the movement of the Earth around the Sun along an approximately elliptical path called an orbit.<\/p>\n<p>Earth takes about 365¼ days to complete one revolution, which is approximately one year.<\/p>\n<h3>Effects of Earth's Revolution<\/h3>\n<ol><li>Seasons: Revolution combined with Earth's tilted axis causes seasons in many parts of the world.<\/li><li>Length of a Year: One revolution takes approximately 365¼ days.<\/li><li>Leap Year: The extra quarter-day each year adds up to approximately one day every four years. A leap year usually has 366 days, with 29 days in February.<\/li><li>Changes in Day and Night Length: The tilted axis causes daytime and nighttime lengths to change during the year in many places. Nigeria experiences less variation because it lies close to the Equator.<\/li><\/ol>\n<h3>Difference Between Rotation and Revolution<\/h3>\n<table class=\"comparison\"><thead><tr><th>Rotation<\/th><th>Revolution<\/th><\/tr><\/thead><tbody><tr><td>Spinning of Earth on its axis.<\/td><td>Movement of Earth around the Sun.<\/td><\/tr><tr><td>Takes approximately 24 hours.<\/td><td>Takes approximately 365¼ days.<\/td><\/tr><tr><td>Causes day and night.<\/td><td>Together with Earth's axial tilt, causes seasons.<\/td><\/tr><tr><td>Determines the daily cycle.<\/td><td>Determines the length of a year.<\/td><\/tr><\/tbody><\/table>\n<\/section>\n\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. The Earth takes approximately how long to complete one revolution around the Sun?<\/p><div class=\"options\"><span>A. 24 hours<\/span><span>B. 30 days<\/span><span>C. 365¼ days<\/span><span>D. 180 days<\/span><\/div><\/article>\n<article class=\"question\"><p>2. Which of these is a harmful effect of excessive sunlight?<\/p><div class=\"options\"><span>A. Improved electricity supply<\/span><span>B. Dehydration<\/span><span>C. Increased rainfall everywhere<\/span><span>D. Prevention of evaporation<\/span><\/div><\/article>\n<article class=\"question\"><p>3. The imaginary line passing through the North Pole and South Pole is called Earth's _____.<\/p><div class=\"options\"><span>A. Orbit<\/span><span>B. Equator<\/span><span>C. Revolution<\/span><span>D. Axis<\/span><\/div><\/article>\n<article class=\"question\"><p>4. Which process allows green plants to make food using sunlight?<\/p><div class=\"options\"><span>A. Evaporation<\/span><span>B. Condensation<\/span><span>C. Photosynthesis<\/span><span>D. Precipitation<\/span><\/div><\/article>\n<article class=\"question\"><p>5. The Earth rotates from _____.<\/p><div class=\"options\"><span>A. East to west<\/span><span>B. West to east<\/span><span>C. North to south<\/span><span>D. South to north<\/span><\/div><\/article>\n<article class=\"question\"><p>6. A year with 366 days is called a _____.<\/p><div class=\"options\"><span>A. Solar day<\/span><span>B. Rotation year<\/span><span>C. Normal year<\/span><span>D. Leap year<\/span><\/div><\/article>\n<article class=\"question\"><p>7. The Sun is a _____.<\/p><div class=\"options\"><span>A. Star<\/span><span>B. Planet<\/span><span>C. Satellite<\/span><span>D. Comet<\/span><\/div><\/article>\n<article class=\"question\"><p>8. Which movement of the Earth causes day and night?<\/p><div class=\"options\"><span>A. Revolution<\/span><span>B. Evaporation<\/span><span>C. Rotation<\/span><span>D. Condensation<\/span><\/div><\/article>\n<article class=\"question\"><p>9. Solar panels convert sunlight into _____.<\/p><div class=\"options\"><span>A. Rainfall<\/span><span>B. Electricity<\/span><span>C. Soil<\/span><span>D. Wind<\/span><\/div><\/article>\n<article class=\"question\"><p>10. Earth's revolution, together with its tilted axis, causes _____.<\/p><div class=\"options\"><span>A. Day and night only<\/span><span>B. Earthquakes<\/span><span>C. The Sun to stop shining<\/span><span>D. Seasons<\/span><\/div><\/article>\n<article class=\"question\"><p>11. The side of Earth facing the Sun experiences _____.<\/p><div class=\"options\"><span>A. Night<\/span><span>B. Darkness throughout the year<\/span><span>C. Day<\/span><span>D. Weightlessness<\/span><\/div><\/article>\n<article class=\"question\"><p>12. The Sun helps drive the water cycle by causing _____.<\/p><div class=\"options\"><span>A. Evaporation<\/span><span>B. Earthquakes<\/span><span>C. Rotation<\/span><span>D. Revolution<\/span><\/div><\/article>\n<article class=\"question\"><p>13. Which of these helps protect people from strong sunlight?<\/p><div class=\"options\"><span>A. Avoiding drinking water<\/span><span>B. Staying in the shade<\/span><span>C. Standing in the Sun for long periods<\/span><span>D. Wearing no protective clothing<\/span><\/div><\/article>\n<article class=\"question\"><p>14. One complete rotation of Earth takes approximately _____.<\/p><div class=\"options\"><span>A. 365¼ days<\/span><span>B. 30 days<\/span><span>C. 12 hours<\/span><span>D. 24 hours<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Earth's rotation influences the direction of large-scale winds through the _____.<\/p><div class=\"options\"><span>A. Water cycle<\/span><span>B. Photosynthesis process<\/span><span>C. Coriolis effect<\/span><span>D. Leap-year system<\/span><\/div><\/article>\n<\/div>\n<\/section>\n\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\"><div class=\"answer\"><span>1.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>2.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>3.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>4.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>5.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>6.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>7.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>8.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>9.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>10.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>11.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>12.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>13.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>14.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>15.<\/span><strong>C<\/strong><\/div><\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"},

}

/* ---------- saved edits (kept on this phone only) ---------- */
const LSP="dc1:";
const store={
  get(k){ try{ const v=localStorage.getItem(LSP+k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(LSP+k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(LSP+k); }catch(e){} },
  keys(){ const o=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(LSP)===0) o.push(k.slice(LSP.length)); } }catch(e){} return o; }
};
const hash=str=>{ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36)+"-"+str.length.toString(36); };

function toast(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast no-print"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2800);
}
const safeName=s=>String(s).replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").slice(0,80)||"note";

function downloadFile(file){
  const u=URL.createObjectURL(file), a=document.createElement("a");
  a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function shareDoc(title,html){
  const file=new File([html],safeName(title)+".html",{type:"text/html"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  downloadFile(file);

}
/* Prints the page itself (the note, paper or vocabulary sheet). The frame inside a note is printed
   as part of the page, which works on phones where printing from inside a frame does not. */
function doPrint(title){
  let fired=false; const bp=()=>{ fired=true; };
  window.addEventListener("beforeprint",bp,{once:true});
  const old=document.title; document.title=title;
  try{ window.print(); }catch(e){ toast("Printing is not available here. Tap Share and print from another app."); }
  setTimeout(()=>{
    window.removeEventListener("beforeprint",bp); document.title=old;
    if(!fired) toast("If no print window opened, tap Share and print from another app.");
  },2000);
}

/* Edit / Save changes / Cancel / Restore original / "newer original" notice.
   o = {key, baseHash, setEditable(bool), getSaveHTML()} */
function mountEditor(box,o){
  const row=box.querySelector("#editrow"), msg=box.querySelector("#edmsg"), nb=box.querySelector("#newer");
  let editing=false;
  const paint=()=>{
    const has=!!store.get(o.key);
    if(editing){
      row.innerHTML=`<button class="btn y" id="ed-save">${ic("save")}Save changes</button><button class="btn" id="ed-cancel">Cancel</button>`;
      msg.hidden=false; msg.textContent='Editing is on. Tap "Save changes" to keep your edits on this phone.';
    }else{
      row.innerHTML=`<button class="btn" id="ed-edit">${ic("edit")}Edit</button>`+(has?`<button class="btn alt" id="ed-restore">Restore original</button>`:"");
      msg.hidden=true;
    }
    const q=s=>row.querySelector(s);
    if(q("#ed-edit")) q("#ed-edit").onclick=()=>{ editing=true; editingNow=true; o.setEditable(true); paint(); };
    if(q("#ed-save")) q("#ed-save").onclick=()=>{
      const ok=store.set(o.key,{html:o.getSaveHTML(),base:o.baseHash,savedAt:Date.now()});
      if(!ok){ toast("Could not save: phone storage is full or blocked."); return; }
      editing=false; editingNow=false; o.setEditable(false); paint(); toast("Saved on this phone.");
    };
    if(q("#ed-cancel")) q("#ed-cancel").onclick=()=>{ editingNow=false; render(); };
    if(q("#ed-restore")) q("#ed-restore").onclick=()=>{
      if(confirm("Restore the original? Your edits on this phone will be removed.")){ store.del(o.key); editingNow=false; render(); toast("Original restored."); }
    };
  };
  paint();
  const ed=store.get(o.key);
  if(ed && ed.base!==o.baseHash){
    nb.hidden=false;
    nb.innerHTML=`<b>A newer original is available.</b><span>Your edited copy was made from an older version.</span><div class="nbtns"><button class="btn" id="nw-use">Use the new original</button><button class="btn alt" id="nw-keep">Keep mine</button></div>`;
    nb.querySelector("#nw-use").onclick=()=>{ store.del(o.key); render(); toast("Showing the new original."); };
    nb.querySelector("#nw-keep").onclick=()=>{ store.set(o.key,Object.assign({},ed,{base:o.baseHash})); nb.hidden=true; toast("Keeping your version."); };
  }
}

function crumbs(){

  if(state.type==="extra"){
    if(state.extra) P.push([EXTRA_NAMES[state.extra],state.xcls!==null?()=>go({xcls:null}):null]);
    if(state.xcls!==null) P.push([classLabel(state.xcls),null]);
  }else if(state.type!=="edits"){
    if(state.cls!==null) P.push([classLabel(state.cls),()=>go({term:null,subj:null,topic:null,set:null,view:null})]);
    if(state.term!==null) P.push([termName(state.term),()=>go({subj:null,topic:null,set:null,view:null})]);
    if(state.subj!==null) P.push([subjOf(state.subj).name,()=>go({topic:null,set:null,view:null})]);
    if(state.type==="classes"&&state.topic!==null) P.push(["Week "+(state.topic+1),state.view?()=>go({view:null}):null]);
    if(state.set!==null) P.push(["Set "+state.set,null]);
    if(state.view) P.push([state.view==="diagram"?"Diagram":"Note",null]);
  }
  const wrap=document.createElement("nav");
  wrap.className="crumbs"; wrap.setAttribute("aria-label","Breadcrumb");
  P.forEach((p,i)=>{
    if(i) wrap.insertAdjacentHTML("beforeend","<i>/</i>");
    if(p[1]===null||i===P.length-1){ const s=document.createElement("span"); s.className="cur"; s.textContent=p[0]; wrap.appendChild(s); }
    else { const b=document.createElement("button"); b.textContent=p[0]; b.onclick=p[1]; wrap.appendChild(b); }
  });
  return wrap;
}

/* ---------- selection box (bottom sheet) for Classes / Test / Examination / Brush sheets / Results ---------- */
function openPicker(type){
  if(document.querySelector(".pk")) return;
  const STEPS={classes:["cls","term","subj","topic"],test:["cls","term","subj","set"],exam:["cls","term","subj","set"],brush:["cls","term","sheet"],results:["cls","term","sheet"]}[type];
  const LAB={cls:"Class",term:"Term",subj:"Subject",topic:"Topic",set:"Set",sheet:"Sheet"};
  const sel={cls:null,term:null,subj:null,topic:null,set:null,sheet:null,view:"note"};
  let step=0;
  const dim=document.createElement("div"); dim.className="pk-dim";
  const sh=document.createElement("div"); sh.className="pk"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true"); sh.setAttribute("aria-label",TYPE_NAMES[type]); sh.tabIndex=-1;
  document.body.appendChild(dim); document.body.appendChild(sh); document.body.classList.add("pk-open");
  const onKey=e=>{ if(e.key==="Escape") close(); };
  const close=()=>{ dim.remove(); sh.remove(); document.body.classList.remove("pk-open"); document.removeEventListener("keydown",onKey); };
  document.addEventListener("keydown",onKey);
  dim.onclick=close;
  const val=k=>{
    if(sel[k]===null) return null;
    if(k==="cls") return classLabel(sel.cls);
    if(k==="term") return termName(sel.term);
    if(k==="subj") return subjOf(sel.subj).name;
    if(k==="topic") return "Week "+(sel.topic+1);
    if(k==="set") return "Set "+sel.set;
    return String(sel.sheet);
  };
  const clearAfter=i=>{ STEPS.slice(i+1).forEach(k=>{ sel[k]=null; }); };
  const firstOpen=()=>{ const i=STEPS.findIndex(k=>sel[k]===null); return i<0?STEPS.length-1:i; };
  const pick=(k,v)=>{
    const i=STEPS.indexOf(k); sel[k]=v; clearAfter(i);
    if(i<STEPS.length-1) step=i+1;
    paint();
  };
  const sheetList=()=>((type==="brush"?BRUSH:RESULTS)[sel.cls+"|"+sel.term])||[];
  const done=()=>{
    const last=STEPS[STEPS.length-1]; if(sel[last]===null) return;
    const patch=Object.assign({},BLANK,{type,cls:sel.cls,term:sel.term});
    if(type==="classes") Object.assign(patch,{subj:sel.subj,topic:sel.topic,view:sel.view});
    if(type==="test"||type==="exam") Object.assign(patch,{subj:sel.subj,set:sel.set});
    close(); go(patch);
  };
  function paint(){
    const k=STEPS[step], last=STEPS.length-1, reach=firstOpen();
    let h=`<div class="pk-grab"></div><div class="pk-top"><b>${TYPE_NAMES[type]}</b><button class="pk-x" aria-label="Close">×</button></div>`;
    const chips=STEPS.slice(0,step).filter(x=>sel[x]!==null);
    if(chips.length) h+=`<div class="pk-sum">${chips.map(x=>`<button data-go="${STEPS.indexOf(x)}">${esc(val(x))} <span aria-hidden="true">✎</span></button>`).join("")}</div>`;
    h+=`<div class="pk-steps">${STEPS.map((x,i)=>`<button ${i>reach?"disabled":""} data-go="${i}" class="${i===step?"cur":(sel[x]!==null?"ok":"")}">${i+1} ${LAB[x]}</button>`).join("")}</div>`;
    h+=`<div class="pk-body"><p class="pk-q">Choose a ${LAB[k].toLowerCase()}</p>`;
    if(k==="cls"){
      h+=`<div class="pk-opts">${[1,2,3,4,6].map(n=>`<button data-v="${n}" class="${sel.cls===n?"sel":""}">${classLabel(n)}</button>`).join("")}</div>`;
    }else if(k==="term"){
      h+=`<div class="pk-opts">${TERMS.map(t=>`<button data-v="${t.id}" class="${sel.term===t.id?"sel":""}">${t.name}<small>${t.span}</small></button>`).join("")}</div>`;
    }else if(k==="subj"){
      const list=SUBJECTS.filter(x=>topicsOf(x.id,sel.term,sel.cls).length>0);
      h+=`<div class="pk-opts">${list.map(x=>`<button data-v="${x.id}" class="${sel.subj===x.id?"sel":""}">${x.name}</button>`).join("")}</div>`;
    }else if(k==="topic"){
      const list=topicsOf(sel.subj,sel.term,sel.cls);
      h+=`<div class="pk-list">${list.map((t,i)=>{
        if(i===0&&t==="Revision") return `<div class="pk-rv"><span class="pk-wk">Week 1</span>${esc(t)}</div>`;
        const ready=sel.cls===6&&!!NOTES[`${sel.subj}|${sel.term}|${i}`];
        return `<button data-v="${i}" class="${sel.topic===i?"sel":""}"><span class="pk-wk">Week ${i+1}</span><span>${esc(t)}</span>${ready?"<small>Full note ready</small>":""}</button>`;
      }).join("")}</div>
      <div class="pk-open2"><button data-view="note" class="${sel.view==="note"?"sel":""}">Note</button><button data-view="diagram" class="${sel.view==="diagram"?"sel":""}">Diagram</button></div>`;
    }else if(k==="set"){
      h+=`<div class="pk-opts three">${["A","B","C"].map(x=>`<button data-v="${x}" class="${sel.set===x?"sel":""}">Set ${x}</button>`).join("")}</div>`;
    }else{
      const L=sheetList();
      h+=L.length?`<div class="pk-list">${L.map((d,i)=>`<button data-v="${i}" class="${sel.sheet===i?"sel":""}"><span>${esc(d.title)}</span></button>`).join("")}</div>`
                 :`<div class="pk-empty">No ${TYPE_NAMES[type].toLowerCase()} have been added here yet.</div>`;
    }
    h+=`</div><button class="pk-done" ${sel[STEPS[last]]===null?"disabled":""}>Done</button>`;
    sh.innerHTML=h;
    sh.querySelector(".pk-x").onclick=close;
    sh.querySelector(".pk-done").onclick=done;
    sh.querySelectorAll("[data-go]").forEach(b=>{ b.onclick=()=>{ step=+b.dataset.go; paint(); }; });
    sh.querySelectorAll("[data-v]").forEach(b=>{
      b.onclick=()=>{
        let v=b.dataset.v;
        if(k==="cls"||k==="term"||k==="topic") v=+v;
        if(k==="sheet") v=sheetList()[+v].title;
        pick(k,v);
      };
    });
    sh.querySelectorAll("[data-view]").forEach(b=>{ b.onclick=()=>{ sel.view=b.dataset.view; paint(); }; });
    const cur=sh.querySelector(".pk-list .sel, .pk-opts .sel"); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:"nearest"});
  }
  paint(); sh.focus();
}

function fileNote(origHtml,week){
  const box=document.createElement("section");
  box.innerHTML=noteTop()+`<div id="vslot"></div>
  <div class="seg no-print" id="seg" role="tablist" aria-label="Periods" hidden></div>
  <iframe id="nf" title="Lesson note" style="width:100%;border:2px solid var(--ink);border-radius:4px;background:#fff;min-height:600px"></iframe>`+noteBottom;
  box.querySelector("#vslot").replaceWith(viewSeg(box,"note"));
  const fr=box.querySelector("#nf"), seg=box.querySelector("#seg");
  /* Sizes the frame to its content so the PAGE scrolls (smooth on Android).
     It never shrinks the frame first, only resizes when the height really changed,
     and it restores the reading position. */
  let ro=null;
  const fit=()=>{
    try{
      const d=fr.contentDocument; if(!d||!d.documentElement) return;
      const content=Math.ceil(d.documentElement.getBoundingClientRect().height);
      const border=fr.offsetHeight-fr.clientHeight;
      const want=content+border;
      if(Math.abs(want-fr.offsetHeight)<2) return;
      const y=window.scrollY;
      fr.style.height=want+"px";
      if(Math.abs(window.scrollY-y)>1) window.scrollTo({top:y,behavior:"instant"});
    }catch(e){}
  };
  let labels=[];
  const show=p=>{
    const d=fr.contentDocument;
    d.querySelectorAll("[data-period]").forEach(el=>{el.style.display=(el.dataset.period==p)?"":"none";});
    [...seg.children].forEach((b,i)=>{b.classList.toggle("on",i+1===p);b.setAttribute("aria-selected",i+1===p);});
    fit(); setTimeout(fit,120); window.scrollTo({top:0});
  };
  const setup=()=>{
    const d=fr.contentDocument, main=d.querySelector("main");
    if(!main) return fit();
    const kids=[...main.children];
    const isQuiz=k=>k.classList.contains("exam")||(k.tagName==="SECTION"&&/^(OBJECTIVE QUESTIONS|ANSWER KEY)/i.test(((k.querySelector("h2")||{}).textContent||"").trim()));
    const exam=kids.filter(isQuiz);
    const units=[];
    const pending=[];
    kids.filter(k=>!isQuiz(k)).forEach(k=>{
      const c=k.className||"";
      if(/\b(divider|eyebrow)\b/.test(c)){ pending.push(k); return; }
      if(!units.length||/\b(l-head|c-head)\b/.test(c)){ units.push([...pending,k]); pending.length=0; }
      else if(/\b(l-body|c-body)\b/.test(c)) units[units.length-1].push(k);
      else { units.push([...pending,k]); pending.length=0; }
    });
    if(pending.length&&units.length) units[0].unshift(...pending);
    if(units.length<2) return fit();
    const len=u=>u.reduce((a,e)=>a+e.textContent.length,0);
    let k=PERIOD_SPLIT[state.subj+"|"+state.term+"|"+week];
    if(!k||k>=units.length){
      const total=units.reduce((a,u)=>a+len(u),0); let run=0,best=1,bd=Infinity;
      for(let i=0;i<units.length-1;i++){run+=len(units[i]); const dd=Math.abs(run-total/2); if(dd<bd){bd=dd;best=i+1;}}
      k=best;
    }
    units.forEach((u,i)=>u.forEach(e=>e.dataset.period=i<k?1:2));
    exam.forEach(e=>e.dataset.period=2);
    const head=u=>{ const e=u.find(x=>!x.classList.contains("eyebrow"))||u[0]; return e.textContent.trim().split(/\n/)[0].trim(); };
    labels=[head(units[0]),head(units[k])];
    seg.innerHTML="";
    [1,2].forEach(n=>{
      const b=document.createElement("button");
      b.setAttribute("role","tab");
      b.innerHTML=`Period ${n}<small>${labels[n-1].replace(/</g,"&lt;")}</small>`;
      b.onclick=()=>show(n);
      seg.appendChild(b);
    });
    seg.hidden=false;
    show(1);
  };
  fr.addEventListener("load",()=>{
    setup(); setTimeout(fit,150);
    try{
      if(window.ResizeObserver){ ro=new ResizeObserver(()=>fit()); ro.observe(fr.contentDocument.documentElement); }
    }catch(e){}
  });
  let rt=null;
  const onResize=()=>{ clearTimeout(rt); rt=setTimeout(fit,150); };
  window.addEventListener("resize",onResize);
  registerCleanup(()=>{ window.removeEventListener("resize",onResize); clearTimeout(rt); if(ro) ro.disconnect(); });
  /* Copy of the document with the period tabs' temporary hiding removed (used for saving and sharing) */
  const cleanDoc=()=>{
    const d=fr.contentDocument, root=d.documentElement.cloneNode(true);
    root.querySelectorAll("[data-period]").forEach(e=>{ e.removeAttribute("data-period"); e.style.removeProperty("display"); if(!e.getAttribute("style")) e.removeAttribute("style"); });
    const b=root.querySelector("body"); if(b){ b.style.removeProperty("box-shadow"); if(!b.getAttribute("style")) b.removeAttribute("style"); }
    return "<!DOCTYPE html>\n"+root.outerHTML;
  };
  fr.srcdoc=origHtml;
  box.querySelector("#pr").onclick=()=>doPrint(noteTitle());
  box.querySelector("#sh").onclick=()=>shareDoc(noteTitle(),cleanDoc());
  box.querySelector("#bk").onclick=()=>go(Object.assign({},BLANK));
  return box;
}

function examHist(initSet){
  let setKey=initSet||"A", view="paper";
  const box=document.createElement("section");
  box.innerHTML=`
  <button class="btn alt backbtn no-print" id="bk">← Back to home</button>
  <div class="ex-ctl no-print">
    <div class="seg three" id="sets" role="tablist" aria-label="Examination sets"></div>
    <div class="seg" id="views" role="tablist" aria-label="View"></div>
  </div>
  <div class="bar acts no-print">
    <button class="btn" id="pr">${ic("print")}Print</button>
    <button class="btn" id="sh">${ic("share")}Share</button>
  </div>
  <div id="paper"></div>`;
  const E=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const head=(sub,showSet)=>`
    <header class="p-head">
      <div class="p-school">FAITH INTELLIGENCE SCHOOL</div>
      <div class="p-addr">Oghara, Delta State, Nigeria</div>
      <div class="p-title">${sub}</div>
      <div class="p-sub">HISTORY · PRIMARY 6${showSet?" · SET "+setKey:""}</div>
    </header>`;
  const dash='<span class="dash"></span>';
  const paperHTML=()=>{
    const mc=HIST_EXAM.mc[setKey], th=HIST_EXAM.theory[setKey];
    let h=`<article class="paper">${head("FIRST TERM EXAMINATION",false)}
    <div class="p-meta">
      <div class="full">Academic Session: <span class="blank" style="min-width:260px"></span></div>
      <div>Name: <span class="blank"></span></div>
      <div>Date: <span class="blank"></span></div>
      <div>Class: Primary 6</div>
      <div>Total Marks: 70</div>
    </div>
    <section class="p-sec"><h2>SECTION A – OBJECTIVE (30 marks)</h2>
      <p class="inst">Answer all questions. Each question carries 2 marks. Choose the correct option and write its letter in the box.</p>
      <ol class="mcq">`;
    mc.forEach((q,i)=>{
      h+=`<li><div class="q-t"><span class="n">${i+1}.</span><span class="qs">${E(q.q)}</span><span class="abox"></span><span class="m">[2 marks]</span></div>
        <div class="opts">${q.o.map((o,j)=>`<span>${"ABCD"[j]}. ${E(o)}</span>`).join("")}</div></li>`;
    });
    h+=`</ol></section>
    <section class="p-sec sec-b"><h2>SECTION B – THEORY (40 marks)</h2>
      <p class="inst">Answer all questions. Each question carries 8 marks (4 marks for each part).</p>`;
    th.forEach((q,i)=>{
      h+=`<div class="tq"><div class="tq-h"><span class="n">${i+1}.</span><span></span><span class="m">[8 marks]</span></div>`;
      q.forEach((p,j)=>{
        const lab="("+"ab"[j]+")";
        if(p.type==="fill"){
          h+=`<div class="part"><div class="pt"><span class="pl">${lab}</span><ol class="fill4">${p.items.map(it=>`<li>${E(it.s).replace("{}",dash)} <span class="m2">(2 marks)</span></li>`).join("")}</ol><span class="m">(4 marks)</span></div></div>`;
        }else if(p.type==="def"){
          h+=`<div class="part"><div class="pt"><span class="pl">${lab}</span><span>Define the following:</span><span class="m">(4 marks)</span></div>
            <ol class="fill4 defl">${p.items.map(it=>`<li>${E(it.t)} <span class="m2">(2 marks)</span><div class="lines" style="--n:2;margin-left:0"></div></li>`).join("")}</ol></div>`;
        }else{
          h+=`<div class="part"><div class="pt"><span class="pl">${lab}</span><span>${E(p.t)}</span><span class="m">(4 marks)</span></div><div class="lines" style="--n:2"></div></div>`;
        }
      });
      h+=`</div>`;
    });
    h+=`</section></article>`;
    return h;
  };
  const schemeHTML=()=>{
    const mc=HIST_EXAM.mc[setKey], th=HIST_EXAM.theory[setKey];
    let h=`<article class="paper">${head("MARKING SCHEME",true)}
    <section class="p-sec"><h2>SECTION A – OBJECTIVE (15 × 2 = 30 marks)</h2>
      <div class="key" style="margin-top:10px">${mc.map((q,i)=>`<span><b>${i+1}.</b>${q.a}</span>`).join("")}</div></section>
    <section class="p-sec ms-break"><h2>SECTION B – THEORY (5 × 8 = 40 marks)</h2>`;
    th.forEach((q,i)=>{
      h+=`<div class="ms-q"><b>${i+1}. [8 marks]</b>`;
      q.forEach((p,j)=>{
        const lab="("+"ab"[j]+")";
        if(p.type==="fill"){
          h+=`<div class="ma">${lab} <em>(4 marks, 2 marks each)</em></div>`;
          p.items.forEach((it,k)=>{ h+=`<div class="ma" style="margin-left:60px">(${["i","ii"][k]}) ${E(it.s).replace("{}","<b><u>"+E(it.a)+"</u></b>")}</div>`; });
        }else if(p.type==="def"){
          h+=`<div class="ma">${lab} <em>Define (4 marks, 2 marks each)</em></div>`;
          p.items.forEach((it,k)=>{ h+=`<div class="ma" style="margin-left:60px">(${["i","ii"][k]}) <b>${E(it.t)}:</b> ${E(it.a)}</div>`; });
        }else{
          h+=`<div class="ma">${lab} <em>(4 marks)</em> ${E(p.t)}<br>${E(p.a)}</div>`;
        }
      });
      h+=`</div>`;
    });
    h+=`</section></article>`;
    return h;
  };
  const paper=box.querySelector("#paper"), sets=box.querySelector("#sets"), views=box.querySelector("#views");
  const draw=()=>{
    paper.innerHTML=view==="paper"?paperHTML():schemeHTML();
    [...sets.children].forEach((b,i)=>{b.classList.toggle("on","ABC"[i]===setKey);b.setAttribute("aria-selected","ABC"[i]===setKey);});
    [...views.children].forEach((b,i)=>{b.classList.toggle("on",["paper","scheme"][i]===view);b.setAttribute("aria-selected",["paper","scheme"][i]===view);});
    window.scrollTo({top:0});
  };
  ["A","B","C"].forEach(k=>{
    const b=document.createElement("button"); b.setAttribute("role","tab"); b.textContent="Set "+k;
    b.onclick=()=>{setKey=k;draw();}; sets.appendChild(b);
  });
  [["Question paper","paper"],["Marking scheme","scheme"]].forEach(([l,v])=>{
    const b=document.createElement("button"); b.setAttribute("role","tab"); b.textContent=l;
    b.onclick=()=>{view=v;draw();}; views.appendChild(b);
  });
  const paperTitle=()=>`${classLabel(state.cls)} ${subjOf(state.subj).name} ${termName(state.term)} ${state.type==="test"?"Test":"Examination"} Set ${setKey}${view==="scheme"?" Marking Scheme":""}`;
  box.querySelector("#bk").onclick=()=>go(Object.assign({},BLANK));
  box.querySelector("#pr").onclick=()=>doPrint(paperTitle());
  box.querySelector("#sh").onclick=()=>shareDoc(paperTitle(),wrapDoc(paperTitle(),paper.innerHTML));
  draw();
  return box;
}

  return box;
}
