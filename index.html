      <ol>${n.objectives.map(o=>`<li>${o}</li>`).join("")}</ol></div>
    <div class="sec"><h3>Introduction</h3><p>${n.intro}</p></div>
    <div class="sec"><h3>Lesson content</h3><div>${n.content}</div></div>
    <div class="sec"><h3>Evaluation</h3>
      <ol>${n.evaluation.map(q=>`<li>${q}</li>`).join("")}</ol></div>
    <div class="sec"><h3>Assignment</h3><p>${n.assignment}</p></div>`}
    <div class="sign"><div>Teacher's signature</div><div>Head teacher's signature</div></div>
  </article>`+noteBottom;
  box.querySelector("#vslot").replaceWith(viewSeg(box,"note"));
  const sheet=box.querySelector(".sheet");
  box.addEventListener("click",ev=>{
    const b=ev.target.closest(".opt"); if(!b||!n.quiz) return;
    const grp=b.closest(".opts"); if(grp.dataset.done) return;
    grp.dataset.done="1";
    const q=n.quiz[+b.dataset.q], pick=+b.dataset.o;
    grp.querySelectorAll(".opt").forEach(o=>{
      const j=+o.dataset.o;
      if(j===q.a) o.classList.add("right");
      else if(j===pick) o.classList.add("wrong");
    });
  });
  const plain=()=>{ const c=sheet.cloneNode(true); c.removeAttribute("contenteditable"); c.classList.remove("editing"); return c; };
  box.querySelector("#pr").onclick=()=>doPrint(noteTitle());
  box.querySelector("#sh").onclick=()=>shareDoc(noteTitle(),wrapDoc(noteTitle(),plain().outerHTML));
  box.querySelector("#bk").onclick=()=>go(Object.assign({},BLANK));
  return box;
}
function screenNote(){
  const topic=topicsOf(state.subj,state.term)[state.topic];
  const n=noteFor(state.topic);
  if(!n) return emptyNote(topic);
  if(n.file) return fileNote(n.file,state.topic+1);
  return writtenNote(n,topic);
}

function screenPaper(){
  const kind=state.type==="test"?"Test":"Examination";
  if(state.type==="exam"&&state.cls===6&&state.subj==="hist"&&state.term===1) return examHist(state.set);
  const box=document.createElement("section");
  box.innerHTML=`<button class="btn alt backbtn no-print" id="bk">← Back to home</button><h1>${kind}: ${esc(subjOf(state.subj).name)}</h1><p class="lead">${classLabel(state.cls)}, ${termName(state.term)}, Set ${state.set}</p><div class="empty">This ${kind.toLowerCase()} has not been added yet.</div>`;
  box.querySelector("#bk").onclick=()=>go(Object.assign({},BLANK));
  return box;
}

/* ---------- Learning Plus ---------- */
function classPicker(title,lead){
  const box=document.createElement("section");
  box.innerHTML=`<h1>${title}</h1><p class="lead">${lead}</p><div class="grid g-pick"></div>`;
  const g=box.querySelector(".grid");
  [1,2,3,4,6].forEach(n=>{
    const b=document.createElement("button"); b.className="card plain";
    b.innerHTML=`<span class="name">${classLabel(n)}</span><span class="sub">Open</span>`;
    b.onclick=()=>go({xcls:n}); g.appendChild(b);
  });
  return box;
}
function screenExtraHome(){
  const box=document.createElement("section");
  box.innerHTML=`<h1>Learning Plus</h1><p class="lead">Choose a section.</p><div class="grid g-pick"></div>`;
  const g=box.querySelector(".grid");
  [["topics","Phonics","Phonics lessons"],["vocab","Vocabulary Development","All classes, editable"],["past","Past Questions and Answers","By class"],["gallery","Gallery","Images and diagrams"]].forEach(([k,l,sub])=>{
    const b=document.createElement("button"); b.className="card plain";
    b.innerHTML=`<span class="name">${l}</span><span class="sub">${sub}</span>`;
    b.onclick=()=>go({extra:k,xcls:null}); g.appendChild(b);
  });
  return box;
}
function screenExtraTopics(){
  const box=document.createElement("section");
  box.innerHTML=`<h1>Phonics</h1><p class="lead">Phonics lessons and activities.</p>`;
  if(!EXTRA_TOPICS.length) box.insertAdjacentHTML("beforeend",'<div class="empty">No phonics lessons have been added yet.</div>');
  return box;
}
function screenVocab(){
  if(state.xcls===null) return classPicker("Vocabulary Development","Choose a class.");
  const key="vocab:"+state.xcls, saved=store.get(key), baseHash=hash(VOCAB_DEFAULT);
  const box=document.createElement("section");
  box.innerHTML=`<h1>Vocabulary Development</h1><p class="lead">${classLabel(state.xcls)}</p>`+noteEditArea+`<article class="sheet study" id="vsheet">${saved?saved.html:VOCAB_DEFAULT}</article>`+noteBottom;
  const sheet=box.querySelector("#vsheet");
  const plain=()=>{ const c=sheet.cloneNode(true); c.removeAttribute("contenteditable"); c.classList.remove("editing"); return c; };
  mountEditor(box,{key,baseHash,
    setEditable:on=>{ sheet.contentEditable=on?"true":"false"; sheet.classList.toggle("editing",on); },
    getSaveHTML:()=>plain().innerHTML});
  const title=`Vocabulary Development - ${classLabel(state.xcls)}`;
  box.querySelector("#pr").onclick=()=>doPrint(title);
  box.querySelector("#sh").onclick=()=>shareDoc(title,wrapDoc(title,plain().outerHTML));
  return box;
}
function screenPast(){
  if(state.xcls===null) return classPicker("Past Questions and Answers","Choose a class.");
  const list=PAST[state.xcls]||[];
  const box=document.createElement("section");
  box.innerHTML=`<h1>Past Questions and Answers</h1><p class="lead">${classLabel(state.xcls)}</p>`;
  if(!list.length) box.insertAdjacentHTML("beforeend",'<div class="empty">No past questions have been added for this class yet.</div>');
  return box;
}
function screenGallery(){
  const box=document.createElement("section");
  box.innerHTML=`<h1>Gallery</h1><p class="lead">Images, diagrams and other learning materials.</p>`;
  if(!GALLERY.length) box.insertAdjacentHTML("beforeend",'<div class="empty">No images have been added to the gallery yet.</div>');
  else{
    const w=document.createElement("div"); w.className="figs";
    GALLERY.forEach(f=>{ const d=document.createElement("div"); d.className="fig"; d.innerHTML=`<b>${esc(f.title||"")}</b><img alt="${esc(f.title||"Image")}" src="${esc(f.src)}">`; w.appendChild(d); });
    box.appendChild(w);
  }
  return box;
}

/* ---------- My edits: list, backup (export / import), restore all ---------- */
function describeKey(k){
  if(k.indexOf("note:")===0){
    const p=k.slice(5).split("|"), c=+p[0], t=+p[1], s=p[2], i=+p[3];
    const topic=topicsOf(s,t,c)[i]||"";
    return {label:`${classLabel(c)} › ${termName(t)} › ${(subjOf(s)||{name:s}).name} › Week ${i+1} · ${topic}`,
      open:()=>go(Object.assign({},BLANK,{type:"classes",cls:c,term:t,subj:s,topic:i,view:"note"}))};
  }
  if(k.indexOf("vocab:")===0){ const c=+k.slice(6); return {label:`Vocabulary Development › ${classLabel(c)}`, open:()=>go(Object.assign({},BLANK,{type:"extra",extra:"vocab",xcls:c}))}; }
  return {label:k,open:null};
}
function exportEdits(){
  const edits={}; store.keys().forEach(k=>{ edits[k]=store.get(k); });
  const payload={app:"faith-intelligence-school-classroom",version:1,exportedAt:new Date().toISOString(),edits};
  downloadFile(new File([JSON.stringify(payload)],"my-edits-"+new Date().toISOString().slice(0,10)+".json",{type:"application/json"}));
  toast("Your edits were saved to a backup file.");
}
function importEdits(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result); let n=0;
      if(!d||d.app!=="faith-intelligence-school-classroom"||typeof d.edits!=="object") throw new Error("bad");
      Object.keys(d.edits).forEach(k=>{ const v=d.edits[k]; if(v&&typeof v.html==="string"&&(k.indexOf("note:")===0||k.indexOf("vocab:")===0)){ if(store.set(k,v)) n++; } });
      render(); toast(n?`${n} edit${n>1?"s":""} restored from the backup file.`:"The backup file had no edits.");
    }catch(e){ toast("That file is not a valid edits backup."); }
  };
  r.readAsText(file);
}
function screenEdits(){
  const keys=store.keys();
  const box=document.createElement("section");
  box.innerHTML=`<h1>My edits and backup</h1><p class="lead">Edits you save are kept on this phone only. Back them up, move them to another phone, or restore every original.</p>`;
  if(keys.length){
    const ul=document.createElement("ul"); ul.className="editlist";
    keys.forEach(k=>{ const d=describeKey(k); const li=document.createElement("li"); li.innerHTML=`<button>${esc(d.label)}</button>`; if(d.open) li.firstChild.onclick=d.open; ul.appendChild(li); });
    box.appendChild(ul);
  }else box.insertAdjacentHTML("beforeend",'<div class="empty" style="margin-bottom:16px">You have not saved any edits yet.</div>');
  const acts=document.createElement("div"); acts.className="acts2";
  acts.innerHTML=`<button class="btn" id="ex">Export my edits</button><button class="btn alt" id="im">Import edits</button><button class="btn alt" id="ra">Restore all originals</button><input type="file" id="fi" accept=".json,application/json" hidden>`;
  box.appendChild(acts);
  acts.querySelector("#ex").onclick=()=>{ if(!keys.length) return toast("There are no edits to export."); exportEdits(); };
  acts.querySelector("#im").onclick=()=>acts.querySelector("#fi").click();
  acts.querySelector("#fi").onchange=e=>{ if(e.target.files[0]) importEdits(e.target.files[0]); };
  acts.querySelector("#ra").onclick=()=>{
    if(!keys.length) return toast("There are no edits to restore.");
    if(confirm("Restore every original? All edits saved on this phone will be removed. Export them first if you want a backup.")){ keys.forEach(k=>store.del(k)); render(); toast("All originals restored."); }
  };
  return box;
}

/* =========================================================
   ROUTER
   ========================================================= */
function routeExtra(){
  if(!state.extra) return {view:screenExtraHome(),back:["Back to home",BLANK]};
  let back=["Back to Learning Plus",{extra:null,xcls:null}];
  if((state.extra==="vocab"||state.extra==="past")&&state.xcls!==null) back=state.extra==="vocab"?["Back to home",BLANK]:["Back to classes",{xcls:null}];
  if(state.extra==="topics") return {view:screenExtraTopics(),back};
  if(state.extra==="gallery") return {view:screenGallery(),back};
  if(state.extra==="past") return {view:screenPast(),back};
  return {view:screenVocab(),back};
}
function route(){
  const t=state.type;
  if(t==="edits") return {view:screenEdits(),back:["Back to home",BLANK]};
  if(t==="extra") return routeExtra();
  if(state.cls===null) return {view:screenClass(),back:["Back to home",BLANK]};
  if(state.term===null) return {view:screenTerm(),back:["Back to classes",{cls:null}]};
  if(t==="brush"||t==="results") return {view:screenListOnly(),back:["Back to home",BLANK]};
  if(state.subj===null) return {view:screenSubjects(),back:["Back to terms",{term:null}]};
  if(t==="test"||t==="exam"){
    if(state.set===null) return {view:screenSets(),back:["Back to subjects",{subj:null}]};
    return {view:screenPaper(),back:null};
  }
  if(state.topic===null) return {view:screenTopics(),back:["Back to subjects",{subj:null}]};
  if(!state.view) return {view:screenOpen(),back:["Back to topics",{topic:null,view:null}]};
  if(state.view==="diagram") return {view:screenDiagram(),back:null};
  return {view:screenNote(),back:null};
}
function render(){
  while(cleanups.length){ try{ cleanups.pop()(); }catch(e){} }
  editingNow=false;
  app.innerHTML="";
  if(!state.type){ app.appendChild(screenHome()); return; }
  const t=state.type;
  const showingContent=(t==="classes"&&state.view)||((t==="test"||t==="exam")&&state.set!==null)||((t==="brush"||t==="results")&&state.term!==null)||(t==="extra"&&state.extra==="vocab"&&state.xcls!==null);
  if(!showingContent) app.appendChild(crumbs());
  const r=route();
  if(r.back){
    const b=document.createElement("button"); b.className="btn alt backbtn no-print"; b.textContent="← "+r.back[0];
    b.onclick=()=>go(r.back[1]); app.appendChild(b);
  }
  app.appendChild(r.view);
}
render();
</script>
<script>
/* Progressive Web App: register the service worker (works from a GitHub Pages repo URL).
   Skipped when the file is opened directly from storage (file://). */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
      .then(function (reg) {
        reg.update();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update();
        });
      })
      .catch(function () {});
  });
}
</script>
