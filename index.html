"hist|2|1":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>History – Primary 6: Military Rule in Nigeria (1)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Section cards */\n  .card{\n    margin-top:32px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:14px 22px 12px;\n    background:var(--accent);\n  }\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:#fff;\n    margin:0;\n  }\n  .c-body{padding:8px 22px 10px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:22px 0 10px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n  .lead-in{font-weight:700;color:var(--navy);margin:14px 0 8px}\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:14px 18px;\n    margin:14px 0;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n  .define.alt{border-left-color:var(--crimson)}\n  .define.alt .term{color:var(--crimson)}\n\n  .note{\n    background:var(--gold-tint);\n    border-left:5px solid var(--crimson);\n    padding:10px 16px;\n    margin:4px 0 14px;\n  }\n  .banner{\n    background:var(--navy);\n    color:#fff;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 20px;\n    margin:6px 0 14px;\n  }\n  .banner p{margin:0}\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n  ol.points li strong{color:var(--navy)}\n\n  /* Leaders grid */\n  ol.leaders{\n    list-style:none;\n    counter-reset:l;\n    margin:0 0 14px;\n    padding:0;\n    display:grid;\n    grid-template-columns:repeat(2,1fr);\n    gap:10px 14px;\n  }\n  ol.leaders li{\n    counter-increment:l;\n    display:flex;\n    align-items:center;\n    gap:12px;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:8px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    font-weight:700;\n    color:var(--navy);\n  }\n  ol.leaders li::before{\n    content:counter(l);\n    flex:0 0 28px;\n    height:28px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    text-align:center;\n    line-height:28px;\n    font-size:14px;\n  }\n  ol.leaders li:nth-child(even){border-left-color:var(--crimson)}\n  ol.leaders li:nth-child(even)::before{background:var(--crimson)}\n\n  /* Panels */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 16px 10px;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    margin:12px 0 8px;\n    padding:4px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel p{margin:0}\n  .panel.good{border-top:4px solid var(--navy);--accent:var(--navy)}\n  .panel.good h3{background:var(--navy)}\n  .panel.hard{border-top:4px solid var(--crimson);--accent:var(--crimson)}\n  .panel.hard h3{background:var(--crimson)}\n  .panel ol.points li{padding-left:40px}\n  .panel ol.points li::before{width:26px;height:26px;line-height:26px;font-size:13px}\n\n  /* Date highlight */\n  .dateline{\n    display:flex;\n    align-items:center;\n    gap:16px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:6px 0 14px;\n  }\n  .dateline .day{\n    flex:0 0 auto;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:6px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    line-height:1.1;\n  }\n  .dateline .day b{display:block;font-size:26px;color:#e7cf8e}\n  .dateline .day span{font-size:13px;letter-spacing:.06em}\n  .dateline .text p{margin:0 0 8px}\n  .dateline .text p:last-child{margin-bottom:0}\n\n  /* Return to civilian rule timeline */\n  ul.timeline{list-style:none;margin:6px 0 14px;padding:0}\n  ul.timeline li{\n    position:relative;\n    padding:0 0 18px 150px;\n    min-height:44px;\n  }\n  ul.timeline li .when{\n    position:absolute;\n    left:0;\n    top:0;\n    width:136px;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:5px 6px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:14px;\n    line-height:1.3;\n  }\n  ul.timeline li:nth-child(2) .when{background:var(--crimson)}\n  ul.timeline li::after{\n    content:\"\";\n    position:absolute;\n    left:67px;\n    top:46px;\n    bottom:2px;\n    width:3px;\n    background:var(--line);\n  }\n  ul.timeline li:last-child{padding-bottom:4px}\n  ul.timeline li:last-child::after{display:none}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    color:var(--navy);\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin-bottom:12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 24px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .two-col,ol.leaders{grid-template-columns:1fr}\n    .dateline{flex-direction:column;align-items:flex-start;gap:8px}\n    ul.timeline li{padding-left:0;padding-top:34px}\n    ul.timeline li .when{width:auto;display:inline-block;padding:4px 14px}\n    ul.timeline li::after{display:none}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.define,.note,.banner,ol.leaders li,\n    ol.leaders li::before,.dateline,.dateline .day,.panel h3,ul.timeline li .when,\n    .instruction,.ans,ol.points li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub{break-after:avoid;page-break-after:avoid}\n    .c-head{break-after:avoid;page-break-after:avoid}\n    .panel,.banner,.dateline,.define,.note,ol.leaders li,ul.timeline li{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n  <header class=\"cover\">\n    <h1>Military Rule in Nigeria (1)<\/h1>\n  <\/header>\n\n  <main>\n\n    <!-- MEANING -->\n    <article class=\"card navy\">\n      <div class=\"c-head\"><h2>Meaning of Military Rule<\/h2><\/div>\n      <div class=\"c-body\">\n        <div class=\"define\">\n          <p><span class=\"term\">Military rule<\/span> is a system of government in which the armed forces control the government instead of elected civilian leaders.<\/p>\n        <\/div>\n        <div class=\"define\">\n          <p>A <span class=\"term\">military government<\/span> is a government controlled by members of the armed forces.<\/p>\n        <\/div>\n        <div class=\"define alt\">\n          <p>A <span class=\"term\">coup d'état<\/span> is the sudden and unlawful seizure of political power, often by military officers.<\/p>\n        <\/div>\n\n        <h3 class=\"sub\">Examples of Military Leaders in Nigeria<\/h3>\n        <ol class=\"leaders\">\n          <li>Johnson Aguiyi-Ironsi<\/li>\n          <li>Yakubu Gowon<\/li>\n          <li>Murtala Muhammed<\/li>\n          <li>Olusegun Obasanjo<\/li>\n          <li>Muhammadu Buhari<\/li>\n          <li>Ibrahim Babangida<\/li>\n          <li>Sani Abacha<\/li>\n          <li>Abdulsalami Abubakar<\/li>\n        <\/ol>\n      <\/div>\n    <\/article>\n\n    <!-- CHARACTERISTICS -->\n    <article class=\"card crimson\">\n      <div class=\"c-head\"><h2>Characteristics of Military Rule<\/h2><\/div>\n      <div class=\"c-body\">\n        <ol class=\"points\" style=\"margin-top:14px\">\n          <li>Government is controlled by military officers.<\/li>\n          <li>The country is led by a military Head of State.<\/li>\n          <li>Laws are often made through decrees.<\/li>\n          <li>Parts of the Constitution may be suspended or modified.<\/li>\n          <li>Political parties and elections may be restricted.<\/li>\n          <li>Power is often concentrated in the hands of military leaders.<\/li>\n          <li>Citizens' political rights and freedoms may be restricted.<\/li>\n          <li>Military officers may be appointed to administer states.<\/li>\n        <\/ol>\n\n        <div class=\"define\">\n          <p>A <span class=\"term\">decree<\/span> is a law or order issued by a military government.<\/p>\n        <\/div>\n        <div class=\"define alt\">\n          <p>An <span class=\"term\">edict<\/span> is a law or order issued by a state military administration under the applicable arrangements.<\/p>\n        <\/div>\n\n        <h3 class=\"sub\">Differences Between Military and Civilian Rule<\/h3>\n        <div class=\"two-col\">\n          <div class=\"panel hard\">\n            <h3>Military rule<\/h3>\n            <p>Leaders are military officers, power may be taken through a coup, and political activities may be restricted.<\/p>\n          <\/div>\n          <div class=\"panel good\">\n            <h3>Civilian rule<\/h3>\n            <p>Leaders are civilians generally chosen through elections, and political parties operate under the law.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- HOW IT BEGAN -->\n    <article class=\"card gold\">\n      <div class=\"c-head\"><h2>How Military Rule Began in Nigeria<\/h2><\/div>\n      <div class=\"c-body\">\n        <p style=\"margin-top:14px\">Nigeria gained independence on 1 October 1960. After independence, the country operated under the First Republic.<\/p>\n        <p>Political crises, election disputes, corruption allegations and ethnic and regional tensions contributed to the problems facing the civilian government.<\/p>\n\n        <h3 class=\"sub\">The First Military Coup<\/h3>\n        <div class=\"dateline\">\n          <div class=\"day\"><b>15<\/b><span>JAN 1966<\/span><\/div>\n          <div class=\"text\">\n            <p>On 15 January 1966, military officers overthrew the civilian government. Prime Minister Sir Abubakar Tafawa Balewa was among those killed.<\/p>\n            <p>Major General Johnson Aguiyi-Ironsi became Nigeria's military Head of State after the coup.<\/p>\n          <\/div>\n        <\/div>\n\n        <h3 class=\"sub\">Factors That Contributed to the Coup<\/h3>\n        <ol class=\"points\">\n          <li>Political crises.<\/li>\n          <li>Election disputes and violence.<\/li>\n          <li>Corruption allegations.<\/li>\n          <li>Ethnic and regional tensions.<\/li>\n          <li>Disagreements among political leaders.<\/li>\n        <\/ol>\n        <p class=\"note\">The coup ended the First Republic and began a period of military government.<\/p>\n      <\/div>\n    <\/article>\n\n    <!-- HOW GOVERNMENTS OPERATED -->\n    <article class=\"card navy\">\n      <div class=\"c-head\"><h2>How Military Governments Operated<\/h2><\/div>\n      <div class=\"c-body\">\n        <ol class=\"points\" style=\"margin-top:14px\">\n          <li><strong>Head of State:<\/strong> A military officer led the country and exercised executive power.<\/li>\n          <li><strong>Governing councils:<\/strong> Senior military officers helped make national decisions through military councils.<\/li>\n          <li><strong>State administration:<\/strong> Military officers were appointed to administer states instead of elected civilian Governors.<\/li>\n          <li><strong>Law-making:<\/strong> Federal military governments issued decrees, while state administrations could issue edicts under the applicable arrangements.<\/li>\n          <li><strong>Political activities:<\/strong> Political parties and elections were often suspended or restricted.<\/li>\n          <li><strong>Government institutions:<\/strong> Legislatures and other democratic institutions could be suspended or have their powers changed.<\/li>\n          <li><strong>Centralised power:<\/strong> Major decisions were often controlled by the Head of State and military leaders.<\/li>\n        <\/ol>\n      <\/div>\n    <\/article>\n\n    <!-- ADVANTAGES & DISADVANTAGES -->\n    <article class=\"card crimson\">\n      <div class=\"c-head\"><h2>Advantages and Disadvantages of Military Rule<\/h2><\/div>\n      <div class=\"c-body\">\n        <div class=\"two-col\" style=\"margin-top:14px\">\n          <div class=\"panel good\">\n            <h3>Advantages of Military Rule<\/h3>\n            <ol class=\"points\">\n              <li>Quick decision-making because power is concentrated.<\/li>\n              <li>Campaigns to promote discipline and punctuality.<\/li>\n              <li>Implementation of some roads, bridges, schools and other development projects.<\/li>\n              <li>Rapid response to certain emergencies.<\/li>\n            <\/ol>\n            <p class=\"note\" style=\"margin:0\">These advantages were not guaranteed under every military administration.<\/p>\n          <\/div>\n          <div class=\"panel hard\">\n            <h3>Disadvantages of Military Rule<\/h3>\n            <ol class=\"points\">\n              <li>Citizens often cannot choose leaders through regular competitive elections.<\/li>\n              <li>Freedom of speech and political participation may be restricted.<\/li>\n              <li>Concentrated power may lead to abuse of authority.<\/li>\n              <li>Citizens have fewer democratic ways to remove ineffective leaders.<\/li>\n              <li>Democratic institutions may be suspended.<\/li>\n              <li>Human rights may be violated.<\/li>\n              <li>Coups and changes of military leadership can cause political instability.<\/li>\n            <\/ol>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- RETURN TO CIVILIAN RULE -->\n    <article class=\"card gold\">\n      <div class=\"c-head\"><h2>Return to Civilian Rule in Nigeria<\/h2><\/div>\n      <div class=\"c-body\">\n        <ul class=\"timeline\" style=\"margin-top:18px\">\n          <li><span class=\"when\">1 October 1979<\/span>General Olusegun Obasanjo handed power to the elected civilian government of President Shehu Shagari.<\/li>\n          <li><span class=\"when\">December 1983<\/span>Military rule returned.<\/li>\n          <li><span class=\"when\">29 May 1999<\/span>General Abdulsalami Abubakar handed power to President Olusegun Obasanjo, beginning the current Fourth Republic.<\/li>\n        <\/ul>\n      <\/div>\n    <\/article>\n\n    <!-- QUESTIONS -->\n    <div class=\"exam\">\n      <section>\n        <h2>Objective Questions<\/h2>\n        <p class=\"instruction\">Choose the correct answer from options A–D.<\/p>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Nigeria returned to civilian democratic rule on 29 May <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1983<\/li><li><b>B.<\/b>1993<\/li><li><b>C.<\/b>1999<\/li><li><b>D.<\/b>2007<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>A law or order issued by a military government is called a <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>campaign<\/li><li><b>B.<\/b>decree<\/li><li><b>C.<\/b>manifesto<\/li><li><b>D.<\/b>ballot paper<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>Who became Nigeria's military Head of State after the January 1966 coup?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Johnson Aguiyi-Ironsi<\/li><li><b>B.<\/b>Ibrahim Babangida<\/li><li><b>C.<\/b>Sani Abacha<\/li><li><b>D.<\/b>Muhammadu Buhari<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>One disadvantage of military rule is the <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>guaranteed freedom to elect every leader<\/li><li><b>B.<\/b>complete absence of central government<\/li><li><b>C.<\/b>automatic protection of all rights<\/li><li><b>D.<\/b>restriction of political participation<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Nigeria gained independence on <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>15 January 1966<\/li><li><b>B.<\/b>1 October 1960<\/li><li><b>C.<\/b>1 October 1979<\/li><li><b>D.<\/b>29 May 1999<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Military rule is a system of government controlled by the <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>armed forces<\/li><li><b>B.<\/b>school authorities<\/li><li><b>C.<\/b>market traders<\/li><li><b>D.<\/b>traditional dancers<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Who handed power to President Shehu Shagari in 1979?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Sani Abacha<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><li><b>D.<\/b>Abdulsalami Abubakar<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>During military rule, state administrators were often <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>elected school prefects<\/li><li><b>B.<\/b>foreign tourists<\/li><li><b>C.<\/b>market traders<\/li><li><b>D.<\/b>appointed military officers<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>The first military coup in Nigeria took place on <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1 October 1960<\/li><li><b>B.<\/b>15 January 1966<\/li><li><b>C.<\/b>29 May 1979<\/li><li><b>D.<\/b>29 May 1999<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Which of these is a claimed advantage of military rule?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Unlimited political freedom<\/li><li><b>B.<\/b>Regular competitive elections in every case<\/li><li><b>C.<\/b>Quick decision-making<\/li><li><b>D.<\/b>Complete absence of abuse of power<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">11.<\/span><span>A coup d'état is the sudden and unlawful seizure of <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>political power<\/li><li><b>B.<\/b>school property<\/li><li><b>C.<\/b>market goods<\/li><li><b>D.<\/b>public holidays<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">12.<\/span><span>Which of these contributed to the first military coup in Nigeria?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Too many school examinations<\/li><li><b>B.<\/b>The opening of new markets<\/li><li><b>C.<\/b>Regular peaceful elections without disputes<\/li><li><b>D.<\/b>Political crises and election disputes<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">13.<\/span><span>The military leader who handed power to President Olusegun Obasanjo in 1999 was <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Abdulsalami Abubakar<\/li><li><b>C.<\/b>Murtala Muhammed<\/li><li><b>D.<\/b>Johnson Aguiyi-Ironsi<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">14.<\/span><span>During military rule, power is often concentrated in the hands of <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>all citizens equally<\/li><li><b>B.<\/b>schoolchildren<\/li><li><b>C.<\/b>military leaders<\/li><li><b>D.<\/b>private shop owners<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">15.<\/span><span>One difference between military rule and civilian rule is that civilian leaders are generally chosen through <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>coups<\/li><li><b>B.<\/b>military appointments<\/li><li><b>C.<\/b>inheritance<\/li><li><b>D.<\/b>elections<\/li><\/ul><\/div>\n      <\/section>\n\n      <section>\n        <h2>Answer Key<\/h2>\n        <div class=\"answers\">\n          <div class=\"ans\"><span>1<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>2<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>3<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>4<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>5<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>6<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>7<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>8<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>9<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>10<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>11<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>12<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>13<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>14<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>15<\/span><strong>D<\/strong><\/div>\n        <\/div>\n      <\/section>\n    <\/div>\n\n  <\/main>\n\n  <footer>History – Primary 6 · Military Rule in Nigeria (1)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|2|2":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/>\n<title>History – Primary 6: Military Rule in Nigeria (2)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Section cards */\n  .card{\n    margin-top:32px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:14px 22px 12px;\n    background:var(--accent);\n  }\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:#fff;\n    margin:0;\n  }\n  .c-body{padding:8px 22px 10px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:22px 0 10px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n  .lead-in{font-weight:700;color:var(--navy);margin:12px 0 8px}\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:14px 18px;\n    margin:14px 0;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n\n  .note{\n    background:var(--gold-tint);\n    border-left:5px solid var(--crimson);\n    padding:10px 16px;\n    margin:4px 0 14px;\n  }\n  .banner{\n    background:var(--navy);\n    color:#fff;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 20px;\n    margin:6px 0 14px;\n  }\n  .banner p{margin:0}\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n\n  /* Period tiles */\n  .periods{\n    list-style:none;\n    counter-reset:p;\n    margin:14px 0 14px;\n    padding:0;\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:14px;\n  }\n  .periods li{\n    counter-increment:p;\n    display:flex;\n    align-items:center;\n    gap:14px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-top:4px solid var(--gold);\n    border-radius:4px;\n    padding:14px 18px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:24px;\n    color:var(--navy);\n  }\n  .periods li::before{\n    content:counter(p);\n    flex:0 0 38px;\n    height:38px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    border:3px solid var(--gold);\n    text-align:center;\n    line-height:32px;\n    font-size:17px;\n  }\n  .periods li:nth-child(2)::before{background:var(--crimson)}\n\n  /* Leader cards */\n  .leaders{\n    list-style:none;\n    margin:0 0 14px;\n    padding:0;\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:14px;\n  }\n  .leaders li{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-top:4px solid var(--navy);\n    border-radius:4px;\n    padding:10px 16px 6px;\n    font-size:16px;\n    line-height:1.55;\n  }\n  .leaders li:nth-child(even){border-top-color:var(--crimson)}\n  .leaders .name{\n    display:block;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:17px;\n    color:var(--navy);\n    line-height:1.3;\n  }\n  .leaders .yrs{\n    display:inline-block;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:13px;\n    background:var(--navy);\n    color:#fff;\n    border-radius:20px;\n    padding:1px 12px;\n    margin:4px 0 8px;\n  }\n  .leaders li:nth-child(even) .yrs{background:var(--crimson)}\n  .leaders li:nth-child(even) .name{color:var(--crimson)}\n\n  /* Timeline */\n  ul.timeline{list-style:none;margin:6px 0 14px;padding:0}\n  ul.timeline li{\n    position:relative;\n    padding:0 0 16px 150px;\n    min-height:42px;\n  }\n  ul.timeline li .when{\n    position:absolute;\n    left:0;\n    top:0;\n    width:136px;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:5px 6px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:14px;\n    line-height:1.3;\n  }\n  ul.timeline li.alt .when{background:var(--crimson)}\n  ul.timeline li::after{\n    content:\"\";\n    position:absolute;\n    left:67px;\n    top:40px;\n    bottom:2px;\n    width:3px;\n    background:var(--line);\n  }\n  ul.timeline li:last-child{padding-bottom:4px}\n  ul.timeline li:last-child::after{display:none}\n\n  /* Date highlight */\n  .dateline{\n    display:flex;\n    align-items:center;\n    gap:16px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:6px 0 14px;\n  }\n  .dateline .day{\n    flex:0 0 auto;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:6px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    line-height:1.1;\n  }\n  .dateline .day b{display:block;font-size:22px;color:#e7cf8e}\n  .dateline .day span{font-size:13px;letter-spacing:.06em}\n  .dateline .text p{margin:0 0 8px}\n  .dateline .text p:last-child{margin-bottom:0}\n\n  /* Panels */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .trio{\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    gap:12px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 14px 8px;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15.5px;\n    line-height:1.3;\n    margin:12px 0 8px;\n    padding:5px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel p{margin:0 0 8px}\n  .panel.navy{border-top:4px solid var(--navy);--accent:var(--navy)}\n  .panel.navy h3{background:var(--navy)}\n  .panel.crimson{border-top:4px solid var(--crimson);--accent:var(--crimson)}\n  .panel.crimson h3{background:var(--crimson)}\n  .panel.gold{border-top:4px solid var(--gold);--accent:var(--gold)}\n  .panel.gold h3{background:var(--gold)}\n  .panel ol.points li{padding-left:40px;font-size:16px}\n  .panel ol.points li::before{width:26px;height:26px;line-height:26px;font-size:13px}\n\n  /* Candidates */\n  .versus{\n    display:flex;\n    align-items:center;\n    gap:12px;\n    margin:6px 0 14px;\n  }\n  .cand{\n    flex:1;\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-top:4px solid var(--navy);\n    border-radius:4px;\n    padding:10px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n  .cand.c2{border-top-color:var(--crimson);color:var(--crimson)}\n  .vs{\n    flex:0 0 auto;\n    width:38px;\n    height:38px;\n    border-radius:50%;\n    background:var(--gold);\n    color:#fff;\n    text-align:center;\n    line-height:38px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:14px;\n  }\n\n  /* Table */\n  .table-wrap{overflow-x:auto;margin:6px 0 14px}\n  table{\n    width:100%;\n    border-collapse:collapse;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    border:1px solid var(--navy);\n  }\n  th,td{padding:10px 14px;text-align:left;border:1px solid var(--line)}\n  thead th{background:var(--navy);color:#fff;border-color:var(--navy)}\n  td:last-child{white-space:nowrap;font-weight:700;color:var(--navy)}\n  tbody tr:nth-child(even){background:var(--tint)}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    color:var(--navy);\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin-bottom:12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 24px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:700px){\n    .trio{grid-template-columns:1fr}\n  }\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .two-col,.periods,.leaders{grid-template-columns:1fr}\n    .periods li{font-size:21px}\n    .dateline{flex-direction:column;align-items:flex-start;gap:8px}\n    ul.timeline li{padding-left:0;padding-top:34px}\n    ul.timeline li .when{width:auto;display:inline-block;padding:4px 14px}\n    ul.timeline li::after{display:none}\n    .versus{flex-direction:column}\n    th,td{padding:8px 8px;font-size:14px}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.define,.note,.banner,.periods li,\n    .periods li::before,.leaders li,.leaders .yrs,ul.timeline li .when,.dateline,\n    .dateline .day,.panel h3,.cand,.vs,thead th,tbody tr:nth-child(even),\n    .instruction,.ans,ol.points li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub{break-after:avoid;page-break-after:avoid}\n    .c-head{break-after:avoid;page-break-after:avoid}\n    .panel,.banner,.dateline,.define,.note,.leaders li,ul.timeline li,.cand,table{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n\n  /* Slim period chips (override of the heavy tiles) */\n  .periods{display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;gap:10px !important;margin:6px 0 2px !important;padding:0 !important;list-style:none;counter-reset:p}\n  article .periods li{counter-increment:p;display:inline-flex !important;align-items:center;gap:7px !important;flex:0 1 auto !important;background:#fff !important;border:1px solid var(--line) !important;border-top:1px solid var(--line) !important;border-radius:999px !important;padding:5px 14px !important;font-size:15px !important;font-weight:600;color:var(--navy) !important;box-shadow:none !important;white-space:nowrap}\n  article .periods li::before,article .periods li:nth-child(2)::before{content:\"(\" counter(p) \")\" !important;flex:none !important;width:auto !important;height:auto !important;background:none !important;border:0 !important;border-radius:0 !important;color:#6b7280 !important;font-size:14px !important;font-weight:600;line-height:1 !important;text-align:left}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Military Rule in Nigeria (2)<\/h1>\n<\/header>\n<main>\n<!-- PERIODS -->\n<article class=\"card gold\">\n<div class=\"c-head\"><h2>Periods of Military Rule in Nigeria<\/h2><\/div>\n<div class=\"c-body\">\n<ol class=\"periods\">\n<li>1966–1979<\/li>\n<li>1983–1999<\/li>\n<\/ol>\n<\/div>\n<\/article>\n<!-- 1966-1979 -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Military Rule in Nigeria, 1966–1979<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"define\">\n<p><span class=\"term\">Military rule<\/span> is a system of government in which the armed forces govern a country instead of elected civilian leaders.<\/p>\n<\/div>\n<h3 class=\"sub\">Military Leaders (1966–1979)<\/h3>\n<ol class=\"leaders\" style=\"list-style:none\">\n<li><span class=\"name\">Johnson Aguiyi-Ironsi<\/span><span class=\"yrs\">1966<\/span><br/>Became Nigeria's first military Head of State after the January 1966 coup. He was killed during a counter-coup in July 1966.<\/li>\n<li><span class=\"name\">Yakubu Gowon<\/span><span class=\"yrs\">1966–1975<\/span><br/>Led Nigeria during the Civil War.<\/li>\n<li><span class=\"name\">Murtala Muhammed<\/span><span class=\"yrs\">1975–1976<\/span><br/>Introduced plans for a return to civilian rule. He was assassinated on 13 February 1976.<\/li>\n<li><span class=\"name\">Olusegun Obasanjo<\/span><span class=\"yrs\">1976–1979<\/span><br/>Continued the transition programme and handed power to an elected civilian government in 1979.<\/li>\n<\/ol>\n<h3 class=\"sub\">Important Events<\/h3>\n<ul class=\"timeline\">\n<li><span class=\"when\">15 January 1966<\/span>First military coup in Nigeria.<\/li>\n<li class=\"alt\"><span class=\"when\">1967–1970<\/span>Nigerian Civil War.<\/li>\n<li><span class=\"when\">15 January 1970<\/span>Civil War ended.<\/li>\n<li class=\"alt\"><span class=\"when\">29 July 1975<\/span>Murtala Muhammed took over from Gowon.<\/li>\n<li><span class=\"when\">13 February 1976<\/span>Murtala Muhammed was assassinated; Obasanjo succeeded him.<\/li>\n<li class=\"alt\"><span class=\"when\">1 October 1979<\/span>Military rule ended, and President Shehu Shagari's civilian government took over.<\/li>\n<\/ul>\n<\/div>\n<\/article>\n<!-- CIVIL WAR -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>The Civil War and Military Government, 1966–1979<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">The Nigerian Civil War<\/h3>\n<div class=\"dateline\">\n<div class=\"day\"><b>1967–1970<\/b><span>CIVIL WAR<\/span><\/div>\n<div class=\"text\">\n<p>The Nigerian Civil War lasted from 1967 to 1970. It was fought between the Federal Government of Nigeria and Biafra, led by Lieutenant Colonel Chukwuemeka Odumegwu Ojukwu.<\/p>\n<\/div>\n<\/div>\n<p>Biafra declared independence in May 1967. The war caused deaths, hunger, destruction of property and displacement of people. It ended in January 1970 when Biafra surrendered.<\/p>\n<div class=\"trio\">\n<div class=\"panel navy\">\n<h3>Government Under Yakubu Gowon<\/h3>\n<ol class=\"points\">\n<li>Led Nigeria during the Civil War.<\/li>\n<li>Promoted reconciliation after the war through the policy “No victor, no vanquished.”<\/li>\n<li>Created additional states in 1967.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel crimson\">\n<h3>Government Under Murtala Muhammed<\/h3>\n<ol class=\"points\">\n<li>Began a campaign against corruption and indiscipline.<\/li>\n<li>Announced plans to return Nigeria to civilian rule.<\/li>\n<li>Introduced changes in the public service.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel gold\">\n<h3>Government Under Olusegun Obasanjo<\/h3>\n<ol class=\"points\">\n<li>Continued preparations for civilian government.<\/li>\n<li>Supervised preparations for elections.<\/li>\n<li>Handed power to President Shehu Shagari on 1 October 1979.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>\n<\/article>\n<!-- 1983-1993 -->\n<article class=\"card gold\">\n<div class=\"c-head\"><h2>Military Rule in Nigeria, 1983–1993<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">Return of Military Rule<\/h3>\n<div class=\"dateline\">\n<div class=\"day\"><b>31<\/b><span>DEC 1983<\/span><\/div>\n<div class=\"text\">\n<p>On 31 December 1983, the military overthrew President Shehu Shagari's government, ending the Second Republic.<\/p>\n<\/div>\n<\/div>\n<div class=\"two-col\">\n<div class=\"panel navy\">\n<h3>Major General Muhammadu Buhari (1983–1985)<\/h3>\n<p><strong>His government:<\/strong><\/p>\n<ol class=\"points\">\n<li>Introduced the War Against Indiscipline (WAI).<\/li>\n<li>Took action against corruption.<\/li>\n<li>Restricted some political and civil activities.<\/li>\n<li>Governed through military decrees.<\/li>\n<\/ol>\n<p class=\"note\" style=\"margin:0\">On 27 August 1985, another coup removed Buhari from power.<\/p>\n<\/div>\n<div class=\"panel crimson\">\n<h3>General Ibrahim Babangida (1985–1993)<\/h3>\n<p><strong>His government:<\/strong><\/p>\n<ol class=\"points\">\n<li>Introduced the Structural Adjustment Programme (SAP) in 1986.<\/li>\n<li>Announced plans to return Nigeria to civilian rule.<\/li>\n<li>Organised the presidential election held on 12 June 1993.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<h3 class=\"sub\">The 12 June 1993 Presidential Election<\/h3>\n<p>The main candidates were:<\/p>\n<div class=\"versus\">\n<div class=\"cand\">M.K.O. Abiola<\/div>\n<div class=\"vs\">VS<\/div>\n<div class=\"cand c2\">Bashir Tofa<\/div>\n<\/div>\n<p>The Babangida government annulled the election, causing protests and political tension.<\/p>\n<p class=\"note\">In August 1993, Babangida stepped aside and handed power to the Interim National Government led by Chief Ernest Shonekan.<\/p>\n<\/div>\n<\/article>\n<!-- 1993-1999 -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Military Rule in Nigeria, 1993–1999<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">The Interim National Government<\/h3>\n<p>Chief Ernest Shonekan led the Interim National Government from August to November 1993. It was expected to guide Nigeria towards civilian rule but faced serious political problems.<\/p>\n<div class=\"two-col\">\n<div class=\"panel crimson\">\n<h3>General Sani Abacha (1993–1998)<\/h3>\n<p>Abacha took power on 17 November 1993 and ended the Interim National Government.<\/p>\n<p><strong>His government:<\/strong><\/p>\n<ol class=\"points\">\n<li>Ruled through military authority and decrees.<\/li>\n<li>Restricted political activities.<\/li>\n<li>Faced opposition over human rights and the demand for democracy.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel navy\">\n<h3>General Abdulsalami Abubakar (1998–1999)<\/h3>\n<p>After Abacha's death, Abdulsalami became Head of State. His government:<\/p>\n<ol class=\"points\">\n<li>Released some political prisoners.<\/li>\n<li>Organised elections.<\/li>\n<li>Prepared a new programme for civilian government.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<p>M.K.O. Abiola, who claimed the mandate of the annulled 1993 election, was arrested and detained in 1994. Abacha died on 8 June 1998.<\/p>\n<div class=\"banner\">\n<p>On 29 May 1999, he handed power to President Olusegun Obasanjo. This marked the beginning of Nigeria's Fourth Republic.<\/p>\n<\/div>\n<\/div>\n<\/article>\n<!-- SUMMARY -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Summary and Effects of Military Rule<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">Military Leaders and Their Periods<\/h3>\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr><th scope=\"col\">Military leader or head of government<\/th><th scope=\"col\">Period<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Johnson Aguiyi-Ironsi<\/td><td>1966<\/td><\/tr>\n<tr><td>Yakubu Gowon<\/td><td>1966–1975<\/td><\/tr>\n<tr><td>Murtala Muhammed<\/td><td>1975–1976<\/td><\/tr>\n<tr><td>Olusegun Obasanjo<\/td><td>1976–1979<\/td><\/tr>\n<tr><td>Muhammadu Buhari<\/td><td>1983–1985<\/td><\/tr>\n<tr><td>Ibrahim Babangida<\/td><td>1985–1993<\/td><\/tr>\n<tr><td>Ernest Shonekan (Interim National Government)<\/td><td>1993<\/td><\/tr>\n<tr><td>Sani Abacha<\/td><td>1993–1998<\/td><\/tr>\n<tr><td>Abdulsalami Abubakar<\/td><td>1998–1999<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<h3 class=\"sub\">Effects of Military Rule<\/h3>\n<div class=\"two-col\">\n<div class=\"panel navy\">\n<h3>Some developments included<\/h3>\n<ol class=\"points\">\n<li>Efforts to restore national unity after the Civil War.<\/li>\n<li>Campaigns against corruption and indiscipline under some administrations.<\/li>\n<li>Changes to Nigeria's state structure.<\/li>\n<li>Programmes to return Nigeria to civilian rule.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel crimson\">\n<h3>Problems included<\/h3>\n<ol class=\"points\">\n<li>Elected governments were removed through coups.<\/li>\n<li>Citizens had limited opportunities to elect national leaders.<\/li>\n<li>Political activities and freedom of expression were restricted under some governments.<\/li>\n<li>The annulment of the 12 June 1993 election caused political tension.<\/li>\n<li>Human rights abuses occurred under some military administrations.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<h3 class=\"sub\">Return to Civilian Rule<\/h3>\n<ul class=\"timeline\">\n<li><span class=\"when\">1 October 1979<\/span>General Olusegun Obasanjo handed power to President Shehu Shagari.<\/li>\n<li class=\"alt\"><span class=\"when\">29 May 1999<\/span>General Abdulsalami Abubakar handed power to President Olusegun Obasanjo, beginning the Fourth Republic.<\/li>\n<\/ul>\n<\/div>\n<\/article>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer from options A–D.<\/p>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Who became Head of State after Sani Abacha's death?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Ibrahim Babangida<\/li><li><b>B.<\/b>Muhammadu Buhari<\/li><li><b>C.<\/b>Abdulsalami Abubakar<\/li><li><b>D.<\/b>Ernest Shonekan<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>The Nigerian Civil War lasted from <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1960–1963<\/li><li><b>B.<\/b>1966–1968<\/li><li><b>C.<\/b>1967–1970<\/li><li><b>D.<\/b>1975–1979<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>Who headed the Interim National Government in 1993?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>M.K.O. Abiola<\/li><li><b>B.<\/b>Ernest Shonekan<\/li><li><b>C.<\/b>Shehu Shagari<\/li><li><b>D.<\/b>Murtala Muhammed<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Nigeria returned to civilian rule in 1979 under President <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Goodluck Jonathan<\/li><li><b>B.<\/b>Umaru Musa Yar'Adua<\/li><li><b>C.<\/b>Shehu Shagari<\/li><li><b>D.<\/b>M.K.O. Abiola<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>The War Against Indiscipline was introduced under <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Muhammadu Buhari<\/li><li><b>B.<\/b>Murtala Muhammed<\/li><li><b>C.<\/b>Sani Abacha<\/li><li><b>D.<\/b>Yakubu Gowon<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Who was Nigeria's first military Head of State?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Johnson Aguiyi-Ironsi<\/li><li><b>C.<\/b>Murtala Muhammed<\/li><li><b>D.<\/b>Ibrahim Babangida<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Sani Abacha took power in <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1983<\/li><li><b>B.<\/b>1985<\/li><li><b>C.<\/b>1993<\/li><li><b>D.<\/b>1998<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>The policy “No victor, no vanquished” is associated with <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Sani Abacha<\/li><li><b>C.<\/b>Muhammadu Buhari<\/li><li><b>D.<\/b>Ernest Shonekan<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>Nigeria returned to civilian rule on 29 May <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1979<\/li><li><b>B.<\/b>1983<\/li><li><b>C.<\/b>1993<\/li><li><b>D.<\/b>1999<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Who took over from Muhammadu Buhari in August 1985?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Abdulsalami Abubakar<\/li><li><b>B.<\/b>Ibrahim Babangida<\/li><li><b>C.<\/b>Ernest Shonekan<\/li><li><b>D.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">11.<\/span><span>Biafra was led during the Civil War by <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>M.K.O. Abiola<\/li><li><b>B.<\/b>Chukwuemeka Odumegwu Ojukwu<\/li><li><b>C.<\/b>Yakubu Gowon<\/li><li><b>D.<\/b>Shehu Shagari<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">12.<\/span><span>Who succeeded Murtala Muhammed in 1976?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Olusegun Obasanjo<\/li><li><b>C.<\/b>Muhammadu Buhari<\/li><li><b>D.<\/b>Abdulsalami Abubakar<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">13.<\/span><span>The presidential election held on 12 June 1993 was annulled under <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Sani Abacha<\/li><li><b>B.<\/b>Ibrahim Babangida<\/li><li><b>C.<\/b>Yakubu Gowon<\/li><li><b>D.<\/b>Abdulsalami Abubakar<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">14.<\/span><span>Military rule returned to Nigeria in December <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1979<\/li><li><b>B.<\/b>1983<\/li><li><b>C.<\/b>1985<\/li><li><b>D.<\/b>1993<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">15.<\/span><span>The civilian president who received power from Abdulsalami Abubakar in 1999 was <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>M.K.O. Abiola<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><li><b>D.<\/b>Goodluck Jonathan<\/li><\/ul><\/div>\n<\/section>\n<section>\n<h2>Answer Key<\/h2>\n<div class=\"answers\">\n<div class=\"ans\"><span>1<\/span><strong>C<\/strong><\/div>\n<div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div>\n<div class=\"ans\"><span>3<\/span><strong>B<\/strong><\/div>\n<div class=\"ans\"><span>4<\/span><strong>C<\/strong><\/div>\n<div class=\"ans\"><span>5<\/span><strong>A<\/strong><\/div>\n<div class=\"ans\"><span>6<\/span><strong>B<\/strong><\/div>\n<div class=\"ans\"><span>7<\/span><strong>C<\/strong><\/div>\n<div class=\"ans\"><span>8<\/span><strong>A<\/strong><\/div>\n<div class=\"ans\"><span>9<\/span><strong>D<\/strong><\/div>\n<div class=\"ans\"><span>10<\/span><strong>B<\/strong><\/div>\n<div class=\"ans\"><span>11<\/span><strong>B<\/strong><\/div>\n<div class=\"ans\"><span>12<\/span><strong>B<\/strong><\/div>\n<div class=\"ans\"><span>13<\/span><strong>B<\/strong><\/div>\n<div class=\"ans\"><span>14<\/span><strong>B<\/strong><\/div>\n<div class=\"ans\"><span>15<\/span><strong>C<\/strong><\/div>\n<\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Military Rule in Nigeria (2)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
