ay 1999, Abdulsalami handed power to the elected President, Olusegun Obasanjo. This marked the beginning of Nigeria's Fourth Republic.<\/p>\n        <\/div>\n      <\/div>\n    <\/article>\n\n    <!-- QUESTIONS -->\n    <div class=\"exam\">\n      <section>\n        <h2>Objective Questions<\/h2>\n        <p class=\"instruction\">Choose the correct answer from options A–D.<\/p>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Which programme did Muhammadu Buhari introduce in 1984?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Structural Adjustment Programme<\/li><li><b>B.<\/b>War Against Indiscipline<\/li><li><b>C.<\/b>National Youth Service Corps<\/li><li><b>D.<\/b>Transition Programme<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Who headed the Interim National Government in 1993?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Sani Abacha<\/li><li><b>C.<\/b>Ernest Shonekan<\/li><li><b>D.<\/b>Abdulsalami Abubakar<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>On what date did Obasanjo hand power to Shehu Shagari?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1 October 1979<\/li><li><b>B.<\/b>29 May 1999<\/li><li><b>C.<\/b>31 December 1983<\/li><li><b>D.<\/b>12 June 1993<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Who became Head of State after the death of General Sani Abacha?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Ibrahim Babangida<\/li><li><b>B.<\/b>Muhammadu Buhari<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><li><b>D.<\/b>Abdulsalami Abubakar<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>SAP means <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>State Administration Programme<\/li><li><b>B.<\/b>Structural Adjustment Programme<\/li><li><b>C.<\/b>Social Affairs Programme<\/li><li><b>D.<\/b>State Adjustment Policy<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Muhammadu Buhari was removed from power by <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Yakubu Gowon<\/li><li><b>B.<\/b>Olusegun Obasanjo<\/li><li><b>C.<\/b>Ibrahim Babangida<\/li><li><b>D.<\/b>Ernest Shonekan<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Who received power from Abdulsalami Abubakar in 1999?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>M.K.O. Abiola<\/li><li><b>C.<\/b>Ibrahim Babangida<\/li><li><b>D.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>The 12 June 1993 presidential election was annulled under <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Muhammadu Buhari<\/li><li><b>B.<\/b>Ibrahim Babangida<\/li><li><b>C.<\/b>Abdulsalami Abubakar<\/li><li><b>D.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>General Olusegun Obasanjo was born in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Abeokuta<\/li><li><b>B.<\/b>Daura<\/li><li><b>C.<\/b>Minna<\/li><li><b>D.<\/b>Kano<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Buhari became Head of State after the military coup of <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1979<\/li><li><b>B.<\/b>1985<\/li><li><b>C.<\/b>1983<\/li><li><b>D.<\/b>1993<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">11.<\/span><span>Which constitution was adopted in preparation for Nigeria's return to civilian rule in 1999?<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1960 Constitution<\/li><li><b>B.<\/b>1979 Constitution<\/li><li><b>C.<\/b>1989 Constitution<\/li><li><b>D.<\/b>1999 Constitution<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">12.<\/span><span>One of the main candidates in the 12 June 1993 presidential election was <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>M.K.O. Abiola<\/li><li><b>C.<\/b>Sani Abacha<\/li><li><b>D.<\/b>Yakubu Gowon<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">13.<\/span><span>General Abdulsalami Abubakar handed over power on <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1 October 1979<\/li><li><b>B.<\/b>27 August 1985<\/li><li><b>C.<\/b>29 May 1999<\/li><li><b>D.<\/b>8 June 1998<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">14.<\/span><span>General Ibrahim Babangida took over from Buhari in <span class=\"blank\">&nbsp;<\/span>.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>1983<\/li><li><b>B.<\/b>1985<\/li><li><b>C.<\/b>1993<\/li><li><b>D.<\/b>1998<\/li><\/ul><\/div>\n\n        <div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">15.<\/span><span>General Olusegun Obasanjo succeeded <span class=\"blank\">&nbsp;<\/span> as Head of State in 1976.<\/span><\/div>\n          <ul class=\"opts\"><li><b>A.<\/b>Murtala Muhammed<\/li><li><b>B.<\/b>Yakubu Gowon<\/li><li><b>C.<\/b>Muhammadu Buhari<\/li><li><b>D.<\/b>Sani Abacha<\/li><\/ul><\/div>\n      <\/section>\n\n      <section>\n        <h2>Answer Key<\/h2>\n        <div class=\"answers\">\n          <div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>3<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>4<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>5<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>6<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>7<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>8<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>9<\/span><strong>A<\/strong><\/div>\n          <div class=\"ans\"><span>10<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>11<\/span><strong>D<\/strong><\/div>\n          <div class=\"ans\"><span>12<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>13<\/span><strong>C<\/strong><\/div>\n          <div class=\"ans\"><span>14<\/span><strong>B<\/strong><\/div>\n          <div class=\"ans\"><span>15<\/span><strong>A<\/strong><\/div>\n        <\/div>\n      <\/section>\n    <\/div>\n\n  <\/main>\n\n  <footer>History – Primary 6 · Military Rule in Nigeria (4)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|2|5":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n:root{--ink:#243447;--muted:#5b6b7a;--teal:#0f766e;--soft:#e7f5f2;--gold:#d99a24;--paper:#fffdf8;--line:#dfe7e5;--shadow:0 18px 45px rgba(33,55,72,.11)}\n*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(15,118,110,.08),transparent 28rem),linear-gradient(135deg,#eef7f5,#f8f4ea);font-family:\"Segoe UI\",Arial,sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 32px));margin:32px auto;padding:clamp(24px,5vw,62px);background:var(--paper);border:1px solid rgba(15,118,110,.14);border-radius:24px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 32px;padding-bottom:18px;border-bottom:3px solid var(--gold);color:var(--teal);font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;letter-spacing:.08em}section{margin:0 0 40px}h2{margin:0 0 19px;padding:12px 16px;border-left:6px solid var(--teal);border-radius:0 10px 10px 0;background:var(--soft);color:#155e59;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.35;letter-spacing:.045em}h3{margin:24px 0 8px;color:#315263;font-size:1.08rem}p{margin:9px 0}ul,ol{margin:10px 0 16px;padding-left:28px}li{margin:5px 0;padding-left:4px}.questions{display:grid;gap:16px;margin-top:12px}.question{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.question p{margin:0 0 7px;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;color:var(--muted)}.answer-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #c9e3de;border-radius:11px;background:#f1faf8;font-weight:700}.answer strong{color:var(--teal)}\n@media(max-width:560px){main{width:min(100% - 18px,920px);margin:9px auto;padding:22px 17px;border-radius:17px}.options{grid-template-columns:1fr}.answer-key{grid-template-columns:repeat(3,minmax(0,1fr))}}\n<\/style>\n<\/head>\n<body>\n<main>\n<p class=\"eyebrow\">MILITARY RULE IN NIGERIA (5)<\/p>\n\n<section>\n<h2>HOW MILITARY LEADERS CAME TO POWER<\/h2>\n<h2>MEANING OF MILITARY TAKEOVER<\/h2>\n<p>Military takeover is when members of the armed forces take control of a country's government, usually by force.<\/p>\n<p>A coup d'état is the sudden and often illegal overthrow of a government, usually by military officers.<\/p>\n<h3>How a Military Takeover Happens<\/h3>\n<ol><li>Some military officers become dissatisfied with the government.<\/li><li>They plan to remove the government.<\/li><li>They take control of important government institutions.<\/li><li>They announce the removal of the existing government.<\/li><li>The leader of the successful coup becomes the new Head of State.<\/li><\/ol>\n<p>Military leaders usually come to power through coups rather than general elections.<\/p>\n<h3>Examples in Nigeria<\/h3>\n<ul><li>In January 1966, Johnson Aguiyi-Ironsi became Nigeria's first military Head of State after a coup.<\/li><li>In December 1983, Muhammadu Buhari took power after the military overthrew President Shehu Shagari.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>HOW THE FIRST MILITARY LEADERS CAME TO POWER, 1966–1975<\/h2>\n<h3>1. Johnson Aguiyi-Ironsi<\/h3>\n<p>On 15 January 1966, military officers staged Nigeria's first military coup. Aguiyi-Ironsi became Nigeria's first military Head of State on 16 January 1966. He was killed during a counter-coup in July 1966.<\/p>\n<h3>2. Yakubu Gowon<\/h3>\n<p>In July 1966, a counter-coup removed Aguiyi-Ironsi. Yakubu Gowon became the new Head of State.<\/p>\n<h3>3. Murtala Ramat Muhammed<\/h3>\n<p>On 29 July 1975, military officers overthrew Gowon's government while he was abroad. Murtala Muhammed became Head of State.<\/p>\n<h3>Factors Associated with Military Takeovers<\/h3>\n<ol><li>Political disagreements and instability.<\/li><li>Disputes surrounding elections.<\/li><li>Allegations of corruption.<\/li><li>Ethnic tensions and dissatisfaction among some military officers.<\/li><\/ol>\n<\/section>\n\n<section>\n<h2>HOW MILITARY LEADERS CAME TO POWER, 1976–1985<\/h2>\n<h3>1. Olusegun Obasanjo<\/h3>\n<p>On 13 February 1976, Murtala Muhammed was assassinated during an attempted coup. His deputy, Olusegun Obasanjo, succeeded him as Head of State.<\/p>\n<p>On 1 October 1979, Obasanjo handed power to the elected civilian President, Shehu Shagari, marking the beginning of the Second Republic.<\/p>\n<h3>2. Muhammadu Buhari<\/h3>\n<p>On 31 December 1983, the military overthrew Shehu Shagari's government. Muhammadu Buhari became Head of State.<\/p>\n<h3>3. Ibrahim Babangida<\/h3>\n<p>On 27 August 1985, Ibrahim Babangida took power in a military coup and removed Buhari from office.<\/p>\n<\/section>\n\n<section>\n<h2>HOW MILITARY LEADERS CAME TO POWER, 1993–1999<\/h2>\n<h3>1. Sani Abacha<\/h3>\n<p>In August 1993, Ibrahim Babangida stepped aside after the annulment of the 12 June 1993 presidential election. Power was transferred to an Interim National Government headed by Ernest Shonekan.<\/p>\n<p>On 17 November 1993, Sani Abacha took power and ended the Interim National Government. He ruled until his death on 8 June 1998.<\/p>\n<h3>2. Abdulsalami Abubakar<\/h3>\n<p>After Abacha's death on 8 June 1998, Abdulsalami Abubakar became Head of State. He succeeded Abacha because of his death, not through a coup.<\/p>\n<p>Abdulsalami's government organised a transition to civilian rule. On 29 May 1999, he handed power to the elected President, Olusegun Obasanjo. This marked the beginning of Nigeria's Fourth Republic.<\/p>\n<h3>Important Terms<\/h3>\n<ul><li>Military rule: Government controlled by the armed forces.<\/li><li>Counter-coup: A coup carried out in response to an earlier coup.<\/li><li>Civilian rule: Government led by civilian leaders rather than the armed forces.<\/li><li>Interim National Government: A temporary government established during a transition.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. Who succeeded Murtala Muhammed after his assassination in 1976?<\/p><div class=\"options\"><span>A. Yakubu Gowon<\/span><span>B. Olusegun Obasanjo<\/span><span>C. Muhammadu Buhari<\/span><span>D. Sani Abacha<\/span><\/div><\/article>\n<article class=\"question\"><p>2. A coup carried out in response to an earlier coup is called a ______.<\/p><div class=\"options\"><span>A. general election<\/span><span>B. campaign<\/span><span>C. counter-coup<\/span><span>D. census<\/span><\/div><\/article>\n<article class=\"question\"><p>3. Who took power after removing Muhammadu Buhari in August 1985?<\/p><div class=\"options\"><span>A. Ibrahim Babangida<\/span><span>B. Sani Abacha<\/span><span>C. Abdulsalami Abubakar<\/span><span>D. Yakubu Gowon<\/span><\/div><\/article>\n<article class=\"question\"><p>4. Nigeria's first military coup took place in ______.<\/p><div class=\"options\"><span>A. 1960<\/span><span>B. 1963<\/span><span>C. 1979<\/span><span>D. 1966<\/span><\/div><\/article>\n<article class=\"question\"><p>5. Who headed the Interim National Government in 1993?<\/p><div class=\"options\"><span>A. Sani Abacha<\/span><span>B. Ernest Shonekan<\/span><span>C. Shehu Shagari<\/span><span>D. Abdulsalami Abubakar<\/span><\/div><\/article>\n<article class=\"question\"><p>6. Muhammadu Buhari became Head of State after the military overthrew ______.<\/p><div class=\"options\"><span>A. Olusegun Obasanjo<\/span><span>B. M.K.O. Abiola<\/span><span>C. Shehu Shagari<\/span><span>D. Ernest Shonekan<\/span><\/div><\/article>\n<article class=\"question\"><p>7. Who became Nigeria's first military Head of State?<\/p><div class=\"options\"><span>A. Johnson Aguiyi-Ironsi<\/span><span>B. Murtala Muhammed<\/span><span>C. Yakubu Gowon<\/span><span>D. Olusegun Obasanjo<\/span><\/div><\/article>\n<article class=\"question\"><p>8. Sani Abacha took power in ______.<\/p><div class=\"options\"><span>A. 1983<\/span><span>B. 1985<\/span><span>C. 1998<\/span><span>D. 1993<\/span><\/div><\/article>\n<article class=\"question\"><p>9. On what date did Olusegun Obasanjo hand power to Shehu Shagari?<\/p><div class=\"options\"><span>A. 29 May 1999<\/span><span>B. 1 October 1979<\/span><span>C. 31 December 1983<\/span><span>D. 12 June 1993<\/span><\/div><\/article>\n<article class=\"question\"><p>10. Which of the following is a factor associated with military takeovers?<\/p><div class=\"options\"><span>A. Regular peaceful elections<\/span><span>B. Increased school enrolment<\/span><span>C. Political instability<\/span><span>D. Agricultural development<\/span><\/div><\/article>\n<article class=\"question\"><p>11. Who became Head of State after Sani Abacha died?<\/p><div class=\"options\"><span>A. Abdulsalami Abubakar<\/span><span>B. Ibrahim Babangida<\/span><span>C. Muhammadu Buhari<\/span><span>D. Ernest Shonekan<\/span><\/div><\/article>\n<article class=\"question\"><p>12. Murtala Muhammed took power after the government of ______ was overthrown in 1975.<\/p><div class=\"options\"><span>A. Shehu Shagari<\/span><span>B. Sani Abacha<\/span><span>C. Johnson Aguiyi-Ironsi<\/span><span>D. Yakubu Gowon<\/span><\/div><\/article>\n<article class=\"question\"><p>13. What is a coup d'état?<\/p><div class=\"options\"><span>A. A peaceful transfer of power after an election<\/span><span>B. The sudden overthrow of a government, usually by military officers<\/span><span>C. A meeting of political parties<\/span><span>D. The creation of a new state<\/span><\/div><\/article>\n<article class=\"question\"><p>14. Nigeria's Fourth Republic began on ______.<\/p><div class=\"options\"><span>A. 1 October 1979<\/span><span>B. 31 December 1983<\/span><span>C. 29 May 1999<\/span><span>D. 12 June 1993<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Which leader succeeded a military Head of State after his death?<\/p><div class=\"options\"><span>A. Ibrahim Babangida, after Buhari<\/span><span>B. Yakubu Gowon, after Obasanjo<\/span><span>C. Muhammadu Buhari, after Gowon<\/span><span>D. Olusegun Obasanjo, after Murtala Muhammed<\/span><\/div><\/article>\n<\/div>\n<\/section>\n\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\">\n<div class=\"answer\"><span>1.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>2.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>3.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>4.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>5.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>6.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>7.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>8.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>9.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>10.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>11.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>12.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>13.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>14.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>15.<\/span><strong>D<\/strong><\/div>\n<\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"},
"hist|2|6":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n:root{--ink:#243447;--muted:#5b6b7a;--teal:#0f766e;--soft:#e7f5f2;--gold:#d99a24;--paper:#fffdf8;--line:#dfe7e5;--shadow:0 18px 45px rgba(33,55,72,.11)}\n*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(15,118,110,.08),transparent 28rem),linear-gradient(135deg,#eef7f5,#f8f4ea);font-family:\"Segoe UI\",Arial,sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 32px));margin:32px auto;padding:clamp(24px,5vw,62px);background:var(--paper);border:1px solid rgba(15,118,110,.14);border-radius:24px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 32px;padding-bottom:18px;border-bottom:3px solid var(--gold);color:var(--teal);font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;letter-spacing:.08em}section{margin:0 0 40px}h2{margin:0 0 19px;padding:12px 16px;border-left:6px solid var(--teal);border-radius:0 10px 10px 0;background:var(--soft);color:#155e59;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.35;letter-spacing:.045em}h3{margin:24px 0 8px;color:#315263;font-size:1.08rem}p{margin:9px 0}ul,ol{margin:10px 0 16px;padding-left:28px}li{margin:5px 0;padding-left:4px}.questions{display:grid;gap:16px;margin-top:12px}.question{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.question p{margin:0 0 7px;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;color:var(--muted)}.answer-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #c9e3de;border-radius:11px;background:#f1faf8;font-weight:700}.answer strong{color:var(--teal)}\n@media(max-width:560px){main{width:min(100% - 18px,920px);margin:9px auto;padding:22px 17px;border-radius:17px}.options{grid-template-columns:1fr}.answer-key{grid-template-columns:repeat(3,minmax(0,1fr))}}\n<\/style>\n<\/head>\n<body>\n<main>\n<p class=\"eyebrow\">OIL ECONOMY (1)<\/p>\n\n<section>\n<h2>EXPLANATION OF CRUDE OIL<\/h2>\n<h2>MEANING AND FORMATION OF CRUDE OIL<\/h2>\n<h3>Meaning of Crude Oil<\/h3>\n<p>Crude oil, also called petroleum, is a natural, dark-coloured liquid found beneath the earth's surface. It contains hydrocarbons made mainly of hydrogen and carbon.<\/p>\n<p>It is called crude because it has not been refined into useful products.<\/p>\n<h3>Formation of Crude Oil<\/h3>\n<p>Crude oil was formed millions of years ago from the remains of tiny plants and animals that lived in ancient seas.<\/p>\n<ol><li>The plants and animals died and settled at the bottom of seas.<\/li><li>Their remains were buried under sand and mud.<\/li><li>Heat and pressure acted on the remains over millions of years.<\/li><li>The remains gradually changed into crude oil and natural gas.<\/li><li>The oil became trapped in underground rocks.<\/li><\/ol>\n<p>Crude oil is a non-renewable resource because it takes millions of years to form.<\/p>\n<\/section>\n\n<section>\n<h2>CHARACTERISTICS AND LOCATION OF CRUDE OIL<\/h2>\n<h3>Characteristics of Crude Oil<\/h3>\n<ol><li>It is usually dark brown or black.<\/li><li>It has a distinctive smell.<\/li><li>It is liquid at ordinary temperatures.<\/li><li>It does not mix easily with water.<\/li><li>It can burn and release energy.<\/li><li>It is found in underground rock formations.<\/li><\/ol>\n<h3>Location of Crude Oil in Nigeria<\/h3>\n<p>Crude oil is found beneath the land and seabed. In Nigeria, it is mainly found in the Niger Delta region and nearby offshore areas.<\/p>\n<p>Examples of oil-producing states include Delta, Bayelsa, Rivers, Akwa Ibom and Edo.<\/p>\n<\/section>\n\n<section>\n<h2>DISCOVERY OF CRUDE OIL IN NIGERIA<\/h2>\n<ul><li>In 1956, crude oil was discovered in commercial quantities at Oloibiri, in present-day Bayelsa State.<\/li><li>The discovery was made by Shell-BP.<\/li><li>Nigeria began exporting crude oil in 1958.<\/li><li>During the 1960s and 1970s, crude oil became increasingly important to Nigeria's economy.<\/li><li>Oloibiri is important because it was the site of Nigeria's first commercial crude oil discovery.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>USES AND PRODUCTS OF CRUDE OIL<\/h2>\n<p>Crude oil is refined to separate and process its useful substances.<\/p>\n<h3>Products and Their Uses<\/h3>\n<ol><li>Petrol: Powers cars and motorcycles.<\/li><li>Diesel: Powers trucks, buses, generators and tractors.<\/li><li>Kerosene: Used in some stoves and lamps.<\/li><li>Cooking gas (LPG): Used for cooking.<\/li><li>Lubricating oil: Reduces friction in engines and machines.<\/li><li>Bitumen: Used in road construction.<\/li><li>Plastics: Used to make containers, pipes and household items.<\/li><\/ol>\n<h3>Why Crude Oil Is Refined<\/h3>\n<p>Crude oil is refined to separate and process it into useful fuels and other products.<\/p>\n<\/section>\n\n<section>\n<h2>IMPORTANCE AND PROBLEMS OF CRUDE OIL<\/h2>\n<h3>Economic Importance of Crude Oil<\/h3>\n<ol><li>Government revenue: Provides income through taxes, royalties and other payments.<\/li><li>Foreign exchange: Earns foreign currency through exports.<\/li><li>Employment: Provides jobs for engineers, technicians, drivers and other workers.<\/li><li>Industrial development: Supplies raw materials and energy for industries.<\/li><li>Infrastructure: Oil revenue can help fund roads, schools and hospitals.<\/li><li>International trade: Crude oil is one of Nigeria's major export products.<\/li><\/ol>\n<h3>Problems Associated with Crude Oil<\/h3>\n<ol><li>Oil spills: Damage farmland, rivers and wildlife.<\/li><li>Water pollution: Contaminates water.<\/li><li>Air pollution: Gas flaring releases harmful substances into the air.<\/li><li>Damage to livelihoods: Pollution affects farming and fishing.<\/li><li>Dependence on oil: Falling world oil prices can reduce government revenue.<\/li><\/ol>\n<h3>Conservation of Crude Oil<\/h3>\n<p>Crude oil can be managed responsibly by preventing oil spills, reducing gas flaring, protecting the environment, avoiding waste and developing other sectors such as agriculture and manufacturing.<\/p>\n<\/section>\n\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. Which of the following is an oil-producing state in Nigeria?<\/p><div class=\"options\"><span>A. Katsina<\/span><span>B. Bayelsa<\/span><span>C. Jigawa<\/span><span>D. Kebbi<\/span><\/div><\/article>\n<article class=\"question\"><p>2. Crude oil is called non-renewable because it ______.<\/p><div class=\"options\"><span>A. forms within a few days<\/span><span>B. is found only on the surface<\/span><span>C. takes millions of years to form<\/span><span>D. can be produced at home<\/span><\/div><\/article>\n<article class=\"question\"><p>3. Which product from crude oil is used in road construction?<\/p><div class=\"options\"><span>A. Bitumen<\/span><span>B. Petrol<\/span><span>C. Kerosene<\/span><span>D. Cooking gas<\/span><\/div><\/article>\n<article class=\"question\"><p>4. Nigeria began exporting crude oil in ______.<\/p><div class=\"options\"><span>A. 1956<\/span><span>B. 1966<\/span><span>C. 1979<\/span><span>D. 1958<\/span><\/div><\/article>\n<article class=\"question\"><p>5. Another name for crude oil is ______.<\/p><div class=\"options\"><span>A. charcoal<\/span><span>B. petroleum<\/span><span>C. firewood<\/span><span>D. coal<\/span><\/div><\/article>\n<article class=\"question\"><p>6. Which of these is a problem associated with crude oil production?<\/p><div class=\"options\"><span>A. Water pollution<\/span><span>B. Improved soil everywhere<\/span><span>C. Increased rainfall<\/span><span>D. Cleaner rivers<\/span><\/div><\/article>\n<article class=\"question\"><p>7. Crude oil was discovered in commercial quantities in Nigeria in ______.<\/p><div class=\"options\"><span>A. 1914<\/span><span>B. 1966<\/span><span>C. 1956<\/span><span>D. 1999<\/span><\/div><\/article>\n<article class=\"question\"><p>8. Which product is used to reduce friction in engines?<\/p><div class=\"options\"><span>A. Bitumen<\/span><span>B. Petrol<\/span><span>C. Diesel<\/span><span>D. Lubricating oil<\/span><\/div><\/article>\n<article class=\"question\"><p>9. Crude oil was formed from the remains of ancient ______.<\/p><div class=\"options\"><span>A. buildings and plastics<\/span><span>B. plants and tiny animals<\/span><span>C. metals only<\/span><span>D. modern machines<\/span><\/div><\/article>\n<article class=\"question\"><p>10. One economic benefit of crude oil is that it provides ______.<\/p><div class=\"options\"><span>A. rainfall<\/span><span>B. sunlight<\/span><span>C. foreign exchange<\/span><span>D. fertile soil everywhere<\/span><\/div><\/article>\n<article class=\"question\"><p>11. The first commercial discovery of crude oil in Nigeria was made at ______.<\/p><div class=\"options\"><span>A. Oloibiri<\/span><span>B. Lagos<\/span><span>C. Kano<\/span><span>D. Abuja<\/span><\/div><\/article>\n<article class=\"question\"><p>12. Which product is commonly used for cooking in many Nigerian homes?<\/p><div class=\"options\"><span>A. Bitumen<\/span><span>B. Lubricating oil<\/span><span>C. Petrol<\/span><span>D. Liquefied petroleum gas<\/span><\/div><\/article>\n<article class=\"question\"><p>13. Crude oil is mainly found ______.<\/p><div class=\"options\"><span>A. on tree branches<\/span><span>B. beneath the earth's surface<\/span><span>C. inside clouds<\/span><span>D. in the atmosphere<\/span><\/div><\/article>\n<article class=\"question\"><p>14. Which company discovered crude oil in commercial quantities at Oloibiri?<\/p><div class=\"options\"><span>A. Shell-BP<\/span><span>B. Nigerian Railway Corporation<\/span><span>C. Nigerian Ports Authority<\/span><span>D. NNPC<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Crude oil is refined to ______.<\/p><div class=\"options\"><span>A. turn it into soil<\/span><span>B. change it into water<\/span><span>C. separate and process useful products<\/span><span>D. make it disappear<\/span><\/div><\/article>\n<\/div>\n<\/section>\n\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\">\n<div class=\"answer\"><span>1.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>2.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>3.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>4.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>5.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>6.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>7.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>8.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>9.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>10.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>11.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>12.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>13.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>14.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>15.<\/span><strong>C<\/strong><\/div>\n<\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"},
"hist|2|7":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <style>\n    :root {\n      --ink: #243447;\n      --muted: #5b6b7a;\n      --accent: #0f766e;\n      --accent-soft: #e6f4f1;\n      --gold: #d99a24;\n      --paper: #fffdf8;\n      --line: #dfe7e5;\n      --shadow: 0 18px 45px rgba(33, 55, 72, 0.11);\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 8% 0%, rgba(15, 118, 110, 0.08), transparent 28rem),\n        linear-gradient(135deg, #eef7f5 0%, #f8f4ea 100%);\n      font-family: \"Segoe UI\", Arial, sans-serif;\n      line-height: 1.65;\n    }\n\n    main {\n      width: min(920px, calc(100% - 32px));\n      margin: 32px auto;\n      padding: clamp(24px, 5vw, 62px);\n      background: var(--paper);\n      border: 1px solid rgba(15, 118, 110, 0.14);\n      border-radius: 24px;\n      box-shadow: var(--shadow);\n    }\n\n    .eyebrow {\n      margin: 0 0 32px;\n      padding-bottom: 18px;\n      border-bottom: 3px solid var(--gold);\n      color: var(--accent);\n      font-size: clamp(1.15rem, 2vw, 1.55rem);\n      font-weight: 800;\n      letter-spacing: 0.08em;\n    }\n\n    section {\n      margin: 0 0 40px;\n    }\n\n    h2 {\n      margin: 0 0 19px;\n      padding: 12px 16px;\n      border-left: 6px solid var(--accent);\n      border-radius: 0 10px 10px 0;\n      background: var(--accent-soft);\n      color: #155e59;\n      font-size: clamp(1.05rem, 2vw, 1.35rem);\n      line-height: 1.35;\n      letter-spacing: 0.045em;\n    }\n\n    h3 {\n      margin: 24px 0 8px;\n      color: #315263;\n      font-size: 1.08rem;\n    }\n\n    p {\n      margin: 9px 0;\n    }\n\n    ul, ol {\n      margin: 10px 0 16px;\n      padding-left: 28px;\n    }\n\n    li {\n      margin: 5px 0;\n      padding-left: 4px;\n    }\n\n    .note {\n      margin: 18px 0;\n      padding: 14px 18px;\n      border: 1px solid #ead7a7;\n      border-radius: 12px;\n      background: #fff8e7;\n    }\n\n    .questions {\n      margin-top: 12px;\n      display: grid;\n      gap: 16px;\n    }\n\n    .question {\n      padding: 16px 18px;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      background: #ffffff;\n    }\n\n    .question p {\n      margin: 0 0 7px;\n      font-weight: 700;\n    }\n\n    .options {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 4px 22px;\n      color: var(--muted);\n    }\n\n    .answer-key {\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));\n      gap: 10px;\n      margin-top: 16px;\n    }\n\n    .answer {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 10px;\n      padding: 12px 14px;\n      border: 1px solid #c9e3de;\n      border-radius: 11px;\n      background: #f1faf8;\n      font-weight: 700;\n    }\n\n    .answer strong {\n      color: var(--accent);\n    }\n\n    @media (max-width: 560px) {\n      main { width: min(100% - 18px, 920px); margin: 9px auto; padding: 22px 17px; border-radius: 17px; }\n      .options { grid-template-columns: 1fr; }\n      .answer-key { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n    }\n  <\/style>\n<\/head>\n<body>\n  <main>\n    <p class=\"eyebrow\">OIL ECONOMY (2)<\/p>\n\n    <section>\n      <h2>YEAR AND PLACE OF CRUDE OIL DISCOVERY IN NIGERIA<\/h2>\n\n      <h2>EARLY SEARCH FOR CRUDE OIL IN NIGERIA<\/h2>\n      <h3>Meaning of Crude Oil Exploration<\/h3>\n      <p>Crude oil exploration is the process of searching for crude oil beneath the earth's surface or seabed.<\/p>\n\n      <h3>Early Search in Nigeria<\/h3>\n      <ul>\n        <li>The search for crude oil in Nigeria began during the colonial period.<\/li>\n        <li>In 1937, Shell began petroleum exploration in Nigeria.<\/li>\n        <li>The search involved studying rocks, surveying land and drilling wells.<\/li>\n        <li>The early search was difficult because oil companies had to locate oil underground before producing it.<\/li>\n      <\/ul>\n\n      <h3>Reasons for Searching for Crude Oil<\/h3>\n      <ol>\n        <li>To obtain petrol, diesel, kerosene and other useful products.<\/li>\n        <li>To earn revenue through local sales and exports.<\/li>\n        <li>To create jobs and business opportunities.<\/li>\n      <\/ol>\n    <\/section>\n\n    <section>\n      <h2>DISCOVERY OF CRUDE OIL AT OLOIBIRI IN 1956<\/h2>\n      <h3>Year and Place of Discovery<\/h3>\n      <p>Crude oil was discovered in commercial quantities in Nigeria in 1956 at Oloibiri, in present-day Bayelsa State, in the Niger Delta region.<\/p>\n\n      <h3>Company Responsible<\/h3>\n      <p>The discovery was made by Shell-BP after exploration and drilling activities.<\/p>\n\n      <h3>Importance of the Discovery<\/h3>\n      <ol>\n        <li>It marked the beginning of commercial crude oil production in Nigeria.<\/li>\n        <li>It encouraged further oil exploration.<\/li>\n        <li>It increased the importance of petroleum in Nigeria's economy.<\/li>\n      <\/ol>\n\n      <p class=\"note\">Bayelsa State was created in 1996, long after the discovery at Oloibiri.<\/p>\n    <\/section>\n\n    <section>\n      <h2>OLOIBIRI AND THE NIGER DELTA<\/h2>\n      <h3>Meaning of the Niger Delta<\/h3>\n      <p>The Niger Delta is a region in southern Nigeria with many rivers, creeks, wetlands and coastal communities. It contains major crude oil and natural gas resources.<\/p>\n\n      <h3>Location of Oloibiri<\/h3>\n      <p>Oloibiri is in present-day Bayelsa State, within the Niger Delta. It is historically important because Nigeria's first commercial crude oil discovery was made there.<\/p>\n\n      <h3>Examples of Oil-Producing States<\/h3>\n      <ul>\n        <li>Bayelsa<\/li>\n        <li>Delta<\/li>\n        <li>Rivers<\/li>\n        <li>Akwa Ibom<\/li>\n        <li>Edo<\/li>\n        <li>Ondo<\/li>\n      <\/ul>\n\n      <h3>Importance of the Niger Delta<\/h3>\n      <ol>\n        <li>It provides crude oil and natural gas.<\/li>\n        <li>Oil production generates government revenue and foreign exchange.<\/li>\n        <li>The petroleum industry creates jobs and business opportunities.<\/li>\n      <\/ol>\n\n      <p class=\"note\">Problem: Oil spills can pollute rivers, damage farmland and affect fishing.<\/p>\n    <\/section>\n\n    <section>\n      <h2>BEGINNING OF COMMERCIAL OIL PRODUCTION<\/h2>\n      <h3>From Discovery to Export<\/h3>\n      <p>After the 1956 discovery at Oloibiri, facilities were developed to produce and transport crude oil. Nigeria began exporting crude oil in 1958.<\/p>\n      <p>As more oil fields were discovered, production increased, and crude oil became a major source of government revenue and foreign exchange.<\/p>\n\n      <h3>Products of Crude Oil<\/h3>\n      <ol>\n        <li>Petrol: Used in cars and motorcycles.<\/li>\n        <li>Diesel: Used in trucks, buses and some generators.<\/li>\n        <li>Kerosene: Used in some stoves and lamps.<\/li>\n        <li>Liquefied petroleum gas (LPG): Used for cooking.<\/li>\n        <li>Lubricants: Reduce friction in engines and machines.<\/li>\n        <li>Bitumen: Used in road construction.<\/li>\n        <li>Plastics: Used to make containers and pipes.<\/li>\n      <\/ol>\n\n      <p>Crude oil is refined to separate and process it into useful products.<\/p>\n\n      <h3>Economic Importance<\/h3>\n      <p>Crude oil provides government revenue, foreign exchange, employment and raw materials for industries.<\/p>\n\n      <h3>Problem of Dependence on Oil<\/h3>\n      <p>Heavy dependence on crude oil can harm Nigeria's economy when international oil prices fall.<\/p>\n    <\/section>\n\n    <section>\n      <h2>IMPORTANCE OF OLOIBIRI AND ENVIRONMENTAL PROTECTION<\/h2>\n      <h3>Historical Importance of Oloibiri<\/h3>\n      <p>The discovery of crude oil at Oloibiri in 1956 marked the beginning of commercial oil production in Nigeria. It encouraged further exploration in the Niger Delta and increased the importance of petroleum in Nigeria's economy.<\/p>\n\n      <h3>Problems Associated with Oil Production<\/h3>\n      <ol>\n        <li>Oil spills: Damage farmland and vegetation.<\/li>\n        <li>Water pollution: Contaminates rivers and other water sources.<\/li>\n        <li>Damage to fishing: Pollution affects fish and fishermen's income.<\/li>\n        <li>Air pollution: Gas flaring releases harmful substances into the air.<\/li>\n        <li>Economic dependence: Falling oil prices can reduce government revenue.<\/li>\n      <\/ol>\n\n      <h3>Ways to Protect Oil-Producing Communities<\/h3>\n      <ol>\n        <li>Prevent and clean up oil spills.<\/li>\n        <li>Repair damaged oil pipelines.<\/li>\n        <li>Protect rivers, farmland and fishing areas.<\/li>\n        <li>Reduce harmful gas flaring.<\/li>\n        <li>Encourage other economic activities, such as agriculture and manufacturing.<\/li>\n      <\/ol>\n    <\/section>\n\n    <section>\n      <h2>OBJECTIVE QUESTIONS<\/h2>\n      <p>Choose the correct answer from options A–D.<\/p>\n      <div class=\"questions\">\n        <article class=\"question\"><p>1. Which company discovered crude oil in commercial quantities at Oloibiri?<\/p><div class=\"options\"><span>A. Nigerian Railway Corporation<\/span><span>B. Shell-BP<\/span><span>C. Nigerian Ports Authority<\/span><span>D. Nigerian Television Authority<\/span><\/div><\/article>\n        <article class=\"question\"><p>2. One product obtained from crude oil is ______.<\/p><div class=\"options\"><span>A. fresh vegetables<\/span><span>B. building sand<\/span><span>C. petrol<\/span><span>D. drinking water<\/span><\/div><\/article>\n        <article class=\"question\"><p>3. Nigeria began exporting crude oil in ______.<\/p><div class=\"options\"><span>A. 1937<\/span><span>B. 1945<\/span><span>C. 1956<\/span><span>D. 1958<\/span><\/div><\/article>\n        <article class=\"question\"><p>4. Which of these is an oil-producing state in Nigeria?<\/p><div class=\"options\"><span>A. Bayelsa<\/span><span>B. Katsina<\/span><span>C. Jigawa<\/span><span>D. Kebbi<\/span><\/div><\/article>\n        <article class=\"question\"><p>5. Crude oil exploration means ______.<\/p><div class=\"options\"><span>A. planting crops<\/span><span>B. searching for crude oil underground<\/span><span>C. building houses<\/span><span>D. fishing in rivers<\/span><\/div><\/article>\n        <article class=\"question\"><p>6. Oil spills can cause ______.<\/p><div class=\"options\"><span>A. cleaner rivers<\/span><span>B. increased rainfall<\/span><span>C. water pollution<\/span><span>D. automatic growth of forests<\/span><\/div><\/article>\n        <article class=\"question\"><p>7. Crude oil was discovered in commercial quantities in Nigeria in ______.<\/p><div class=\"options\"><span>A. 1937<\/span><span>B. 1960<\/span><span>C. 1979<\/span><span>D. 1956<\/span><\/div><\/article>\n        <article class=\"question\"><p>8. Which product is used in road construction?<\/p><div class=\"options\"><span>A. Bitumen<\/span><span>B. Kerosene<\/span><span>C. Petrol<\/span><span>D. Cooking gas<\/span><\/div><\/article>\n        <article class=\"question\"><p>9. Oloibiri is located in present-day ______ State.<\/p><div class=\"options\"><span>A. Ogun<\/span><span>B. Bayelsa<\/span><span>C. Kaduna<\/span><span>D. Kano<\/span><\/div><\/article>\n        <article class=\"question\"><p>10. One reason oil companies searched for crude oil was to ______.<\/p><div class=\"options\"><span>A. stop all trading<\/span><span>B. produce rainfall<\/span><span>C. obtain useful petroleum products<\/span><span>D. prevent people from farming<\/span><\/div><\/article>\n        <article class=\"question\"><p>11. The Niger Delta is located in ______ Nigeria.<\/p><div class=\"options\"><span>A. northern<\/span><span>B. north-eastern<\/span><span>C. central<\/span><span>D. southern<\/span><\/div><\/article>\n        <article class=\"question\"><p>12. Which of the following can reduce the income of fishermen in oil-producing areas?<\/p><div class=\"options\"><span>A. Oil pollution<\/span><span>B. Clean rivers<\/span><span>C. Protected fishing areas<\/span><span>D. Proper pipeline maintenance<\/span><\/div><\/article>\n        <article class=\"question\"><p>13. Shell began petroleum exploration in Nigeria in ______.<\/p><div class=\"options\"><span>A. 1956<\/span><span>B. 1937<\/span><span>C. 1958<\/span><span>D. 1996<\/span><\/div><\/article>\n        <article class=\"question\"><p>14. Bayelsa State was created in ______.<\/p><div class=\"options\"><span>A. 1956<\/span><span>B. 1958<\/span><span>C. 1996<\/span><span>D. 1937<\/span><\/div><\/article>\n        <article class=\"question\"><p>15. One way to protect oil-producing communities is to ______.<\/p><div class=\"options\"><span>A. dump waste into rivers<\/span><span>B. allow pipelines to leak<\/span><span>C. destroy fishing areas<\/span><span>D. prevent and clean up oil spills<\/span><\/div><\/article>\n      <\/div>\n    <\/section>\n\n    <section>\n      <h2>ANSWER KEY<\/h2>\n      <div class=\"answer-key\">\n        <div class=\"answer\"><span>1.<\/span><strong>B<\/strong><\/div>\n        <div class=\"answer\"><span>2.<\/span><strong>C<\/strong><\/div>\n        <div class=\"answer\"><span>3.<\/span><strong>D<\/strong><\/div>\n        <div class=\"answer\"><span>4.<\/span><strong>A<\/strong><\/div>\n        <div class=\"answer\"><span>5.<\/span><strong>B<\/strong><\/div>\n        <div class=\"answer\"><span>6.<\/span><strong>C<\/strong><\/div>\n        <div class=\"answer\"><span>7.<\/span><strong>D<\/strong><\/div>\n        <div class=\"answer\"><span>8.<\/span><strong>A<\/strong><\/div>\n        <div class=\"answer\"><span>9.<\/span><strong>B<\/strong><\/div>\n        <div class=\"answer\"><span>10.<\/span><strong>C<\/strong><\/div>\n        <div class=\"answer\"><span>11.<\/span><strong>D<\/strong><\/div>\n        <div class=\"answer\"><span>12.<\/span><strong>A<\/strong><\/div>\n        <div class=\"answer\"><span>13.<\/span><strong>B<\/strong><\/div>\n        <div class=\"answer\"><span>14.<\/span><strong>C<\/strong><\/div>\n        <div class=\"answer\"><span>15.<\/span><strong>D<\/strong><\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n<\/body>\n<\/html>\n"},
"hist|2|8":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n:root{--ink:#243447;--muted:#5b6b7a;--teal:#0f766e;--soft:#e7f5f2;--gold:#d99a24;--paper:#fffdf8;--line:#dfe7e5;--shadow:0 18px 45px rgba(33,55,72,.11)}\n*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(15,118,110,.08),transparent 28rem),linear-gradient(135deg,#eef7f5,#f8f4ea);font-family:\"Segoe UI\",Arial,sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 32px));margin:32px auto;padding:clamp(24px,5vw,62px);background:var(--paper);border:1px solid rgba(15,118,110,.14);border-radius:24px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 32px;padding-bottom:18px;border-bottom:3px solid var(--gold);color:var(--teal);font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;letter-spacing:.08em}section{margin:0 0 40px}h2{margin:0 0 19px;padding:12px 16px;border-left:6px solid var(--teal);border-radius:0 10px 10px 0;background:var(--soft);color:#155e59;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.35;letter-spacing:.045em}h3{margin:24px 0 8px;color:#315263;font-size:1.08rem}p{margin:9px 0}ul,ol{margin:10px 0 16px;padding-left:28px}li{margin:5px 0;padding-left:4px}.questions{display:grid;gap:16px;margin-top:12px}.question{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.question p{margin:0 0 7px;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;color:var(--muted)}.answer-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #c9e3de;border-radius:11px;background:#f1faf8;font-weight:700}.answer strong{color:var(--teal)}\n@media(max-width:560px){main{width:min(100% - 18px,920px);margin:9px auto;padding:22px 17px;border-radius:17px}.options{grid-template-columns:1fr}.answer-key{grid-template-columns:repeat(3,minmax(0,1fr))}}\n<\/style>\n<\/head>\n<body>\n<main>\n<p class=\"eyebrow\">OIL ECONOMY (3)<\/p>\n\n<section>\n<h2>BENEFITS OF CRUDE OIL TO THE NIGERIAN ECONOMY<\/h2>\n<h2>MEANING OF OIL ECONOMY<\/h2>\n<h3>Meaning of Oil Economy<\/h3>\n<p>An oil economy is an economy in which crude oil plays a major role in a country's income and economic activities.<\/p>\n<p>In Nigeria, crude oil was discovered in commercial quantities in 1956 at Oloibiri, in present-day Bayelsa State. Nigeria began exporting crude oil in 1958.<\/p>\n<h3>Products Obtained from Crude Oil<\/h3>\n<ol><li>Petrol: Powers cars and other vehicles.<\/li><li>Diesel: Used in trucks, buses and generators.<\/li><li>Kerosene: Used in some stoves and lamps.<\/li><li>Lubricating oil: Reduces friction in machines.<\/li><li>Bitumen: Used in road construction.<\/li><li>Petrochemicals: Used to manufacture plastics and other products.<\/li><\/ol>\n<p>Crude oil is processed in refineries to obtain useful products.<\/p>\n<\/section>\n\n<section>\n<h2>CRUDE OIL AS A SOURCE OF GOVERNMENT REVENUE<\/h2>\n<h3>Meaning of Government Revenue<\/h3>\n<p>Government revenue is money received by the government to carry out its duties and provide public services.<\/p>\n<p>The Nigerian government earns revenue from crude oil through taxes, royalties and other payments by oil companies.<\/p>\n<h3>Benefits of Oil Revenue<\/h3>\n<ol><li>Provides roads, schools and hospitals.<\/li><li>Pays salaries of teachers, doctors and other public workers.<\/li><li>Funds security agencies.<\/li><li>Supports development projects and public services.<\/li><li>Helps improve electricity and water supply.<\/li><\/ol>\n<h3>Meaning of Foreign Exchange<\/h3>\n<p>Foreign exchange is money earned or received in the currency of another country.<\/p>\n<p>Nigeria earns foreign exchange by exporting crude oil. It can use this money to pay for imported goods such as machinery and medicines.<\/p>\n<\/section>\n\n<section>\n<h2>CRUDE OIL AND EMPLOYMENT OPPORTUNITIES<\/h2>\n<h3>Meaning of Employment<\/h3>\n<p>Employment is work done by a person to earn money or make a living.<\/p>\n<h3>Jobs Created by the Oil Industry<\/h3>\n<ol><li>Engineers: Design and maintain oil facilities.<\/li><li>Geologists: Study rocks to locate possible oil deposits.<\/li><li>Technicians: Operate and repair equipment.<\/li><li>Drivers: Transport workers and materials.<\/li><li>Security workers: Protect oil facilities.<\/li><li>Construction workers: Build roads, pipelines and other facilities.<\/li><\/ol>\n<h3>How Crude Oil Supports Other Businesses<\/h3>\n<p>The oil industry creates business opportunities for transport companies, caterers, construction firms and equipment suppliers.<\/p>\n<p>These jobs and businesses provide income for individuals and their families.<\/p>\n<\/section>\n\n<section>\n<h2>CRUDE OIL, INDUSTRIES AND INFRASTRUCTURE<\/h2>\n<h3>Meaning of Industry<\/h3>\n<p>An industry is an economic activity involving the production of goods or provision of services.<\/p>\n<h3>Benefits of Crude Oil to Industries<\/h3>\n<ol><li>Provides fuel for machines and vehicles.<\/li><li>Supplies raw materials for plastics, paints and synthetic fibres.<\/li><li>Supports refineries and manufacturing businesses.<\/li><li>Encourages transport, engineering and construction businesses.<\/li><\/ol>\n<h3>Meaning of Infrastructure<\/h3>\n<p>Infrastructure refers to basic facilities needed for a country to function and develop.<\/p>\n<p>Examples include roads, bridges, schools, hospitals, electricity and water supply systems.<\/p>\n<p>Oil revenue can help the government build and maintain these facilities.<\/p>\n<\/section>\n\n<section>\n<h2>OTHER BENEFITS AND CHALLENGES OF CRUDE OIL<\/h2>\n<h3>Other Economic Benefits<\/h3>\n<ol><li>Foreign exchange: Earned through crude oil exports.<\/li><li>International trade: Crude oil is sold to other countries.<\/li><li>Skills development: Workers gain technical knowledge and experience.<\/li><li>Business growth: Oil activities support banking, transportation and construction.<\/li><li>Economic development: Properly managed oil revenue can support national development.<\/li><\/ol>\n<h3>Challenges Associated with Crude Oil<\/h3>\n<ol><li>Oil pollution: Spills contaminate rivers, soil and farmland.<\/li><li>Damage to aquatic life: Oil pollution harms fish and other water organisms.<\/li><li>Loss of income: Pollution affects farmers and fishermen.<\/li><li>Dependence on oil: Falling world oil prices can reduce government revenue.<\/li><li>Illegal oil activities: Oil theft and illegal refining damage the environment and reduce government income.<\/li><\/ol>\n<h3>Ways to Improve the Benefits of Crude Oil<\/h3>\n<ol><li>Manage oil revenue honestly and responsibly.<\/li><li>Invest in education, healthcare and agriculture.<\/li><li>Provide employment and training opportunities.<\/li><li>Prevent and clean up oil spills.<\/li><li>Develop other economic sectors to reduce dependence on crude oil.<\/li><\/ol>\n<\/section>\n\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. Which of these is a petroleum product?<\/p><div class=\"options\"><span>A. Cassava<\/span><span>B. Fresh milk<\/span><span>C. Petrol<\/span><span>D. Palm fruit<\/span><\/div><\/article>\n<article class=\"question\"><p>2. A person who studies rocks to locate possible oil deposits is a ______.<\/p><div class=\"options\"><span>A. geologist<\/span><span>B. tailor<\/span><span>C. baker<\/span><span>D. hairdresser<\/span><\/div><\/article>\n<article class=\"question\"><p>3. One way Nigeria can reduce its dependence on crude oil is by developing ______.<\/p><div class=\"options\"><span>A. illegal refining<\/span><span>B. only the oil industry<\/span><span>C. oil pollution<\/span><span>D. agriculture and other sectors<\/span><\/div><\/article>\n<article class=\"question\"><p>4. Money received by the government to carry out its duties is called ______.<\/p><div class=\"options\"><span>A. family allowance<\/span><span>B. government revenue<\/span><span>C. private property<\/span><span>D. school attendance<\/span><\/div><\/article>\n<article class=\"question\"><p>5. Crude oil was discovered in commercial quantities in Nigeria in ______.<\/p><div class=\"options\"><span>A. 1960<\/span><span>B. 1970<\/span><span>C. 1956<\/span><span>D. 1999<\/span><\/div><\/article>\n<article class=\"question\"><p>6. Which of the following is an example of infrastructure?<\/p><div class=\"options\"><span>A. A public road<\/span><span>B. A school bag<\/span><span>C. A cooking pot<\/span><span>D. A pair of shoes<\/span><\/div><\/article>\n<article class=\"question\"><p>7. Nigeria earns foreign exchange from crude oil mainly by ______.<\/p><div class=\"options\"><span>A. burying it underground<\/span><span>B. using it to wash clothes<\/span><span>C. burning it in homes<\/span><span>D. exporting it to other countries<\/span><\/div><\/article>\n<article class=\"question\"><p>8. Which of these workers helps to design and maintain oil facilities?<\/p><div class=\"options\"><span>A. Hairdresser<\/span><span>B. Engineer<\/span><span>C. Baker<\/span><span>D. Tailor<\/span><\/div><\/article>\n<article class=\"question\"><p>9. One environmental problem caused by crude oil activities is ______.<\/p><div class=\"options\"><span>A. cleaner rivers<\/span><span>B. increased clean water<\/span><span>C. water and soil pollution<\/span><span>D. the prevention of all diseases<\/span><\/div><\/article>\n<article class=\"question\"><p>10. An economy in which crude oil plays a major role is called a/an ______ economy.<\/p><div class=\"options\"><span>A. oil<\/span><span>B. fishing<\/span><span>C. hunting<\/span><span>D. weaving<\/span><\/div><\/article>\n<article class=\"question\"><p>11. Which of these businesses may benefit from the oil industry?<\/p><div class=\"options\"><span>A. Only fishing businesses<\/span><span>B. No business at all<\/span><span>C. Only tailoring businesses<\/span><span>D. Transport companies<\/span><\/div><\/article>\n<article class=\"question\"><p>12. Materials obtained from crude oil are used to manufacture ______.<\/p><div class=\"options\"><span>A. fresh vegetables<\/span><span>B. plastics<\/span><span>C. drinking water<\/span><span>D. firewood<\/span><\/div><\/article>\n<article class=\"question\"><p>13. Crude oil can help the government provide ______.<\/p><div class=\"options\"><span>A. polluted rivers<\/span><span>B. abandoned projects only<\/span><span>C. hospitals and schools<\/span><span>D. illegal activities<\/span><\/div><\/article>\n<article class=\"question\"><p>14. Depending too heavily on crude oil makes Nigeria vulnerable to ______.<\/p><div class=\"options\"><span>A. changes in world oil prices<\/span><span>B. changes in school uniforms<\/span><span>C. the colour of buildings<\/span><span>D. the number of classroom chairs<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Which of these is used to reduce friction in machines?<\/p><div class=\"options\"><span>A. Bitumen<\/span><span>B. Kerosene<\/span><span>C. Petrol<\/span><span>D. Lubricating oil<\/span><\/div><\/article>\n<\/div>\n<\/section>\n\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\">\n<div class=\"answer\"><span>1.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>2.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>3.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>4.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>5.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>6.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>7.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>8.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>9.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>10.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>11.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>12.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>13.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>14.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>15.<\/span><strong>D<\/strong><\/div>\n<\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"},
"hist|2|9":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n:root{--ink:#243447;--muted:#5b6b7a;--teal:#0f766e;--soft:#e7f5f2;--gold:#d99a24;--paper:#fffdf8;--line:#dfe7e5;--shadow:0 18px 45px rgba(33,55,72,.11)}\n*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(15,118,110,.08),transparent 28rem),linear-gradient(135deg,#eef7f5,#f8f4ea);font-family:\"Segoe UI\",Arial,sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 32px));margin:32px auto;padding:clamp(24px,5vw,62px);background:var(--paper);border:1px solid rgba(15,118,110,.14);border-radius:24px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 32px;padding-bottom:18px;border-bottom:3px solid var(--gold);color:var(--teal);font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;letter-spacing:.08em}section{margin:0 0 40px}h2{margin:0 0 19px;padding:12px 16px;border-left:6px solid var(--teal);border-radius:0 10px 10px 0;background:var(--soft);color:#155e59;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.35;letter-spacing:.045em}h3{margin:24px 0 8px;color:#315263;font-size:1.08rem}p{margin:9px 0}ul,ol{margin:10px 0 16px;padding-left:28px}li{margin:5px 0;padding-left:4px}.safety{padding:14px 18px;border:1px solid #ead7a7;border-radius:12px;background:#fff8e7}.questions{display:grid;gap:16px;margin-top:12px}.question{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.question p{margin:0 0 7px;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;color:var(--muted)}.answer-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #c9e3de;border-radius:11px;background:#f1faf8;font-weight:700}.answer strong{color:var(--teal)}\n@media(max-width:560px){main{width:min(100% - 18px,920px);margin:9px auto;padding:22px 17px;border-radius:17px}.options{grid-template-columns:1fr}.answer-key{grid-template-columns:repeat(3,minmax(0,1fr))}}\n<\/style>\n<\/head>\n<body>\n<main>\n<p class=\"eyebrow\">OIL ECONOMY (4)<\/p>\n\n<section>\n<h2>BY-PRODUCTS OF CRUDE OIL<\/h2>\n<h2>MEANING OF CRUDE OIL AND ITS BY-PRODUCTS<\/h2>\n<h3>Meaning of Crude Oil<\/h3>\n<p>Crude oil is a natural, dark-coloured liquid found beneath the earth's surface. It was formed millions of years ago from the remains of tiny plants and animals buried under sand and rocks.<\/p>\n<h3>Meaning of By-products of Crude Oil<\/h3>\n<p>By-products of crude oil are useful materials obtained when crude oil is refined or processed into other chemicals.<\/p>\n<h3>Examples of Crude Oil Products<\/h3>\n<ol><li>Petrol<\/li><li>Diesel<\/li><li>Kerosene<\/li><li>Liquefied petroleum gas (LPG)<\/li><li>Lubricating oil<\/li><li>Paraffin wax<\/li><li>Bitumen<\/li><li>Petroleum coke<\/li><li>Petrochemicals used to make plastics and synthetic fibres<\/li><li>Aviation fuel<\/li><\/ol>\n<h3>Importance of Crude Oil Products<\/h3>\n<ul><li>They provide fuel for vehicles, machines and aircraft.<\/li><li>They provide cooking gas for homes and businesses.<\/li><li>They supply materials for road construction and manufacturing.<\/li><li>They are used to make candles, lubricants and plastics.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>PETROL, DIESEL AND KEROSENE<\/h2>\n<h3>1. Petrol<\/h3>\n<p>Petrol, also called Premium Motor Spirit (PMS), is a fuel obtained from refining crude oil.<\/p>\n<h3>Uses:<\/h3>\n<ul><li>Powers many cars and motorcycles.<\/li><li>Runs some generators and small machines.<\/li><\/ul>\n<h3>2. Diesel<\/h3>\n<p>Diesel, also called Automotive Gas Oil (AGO), is a petroleum fuel.<\/p>\n<h3>Uses:<\/h3>\n<ul><li>Powers many trucks and buses.<\/li><li>Runs generators, tractors and heavy-duty machines.<\/li><\/ul>\n<h3>3. Kerosene<\/h3>\n<p>Kerosene is a petroleum product mainly used as fuel.<\/p>\n<h3>Uses:<\/h3>\n<ul><li>Used in suitable stoves for cooking.<\/li><li>Used in kerosene lamps.<\/li><\/ul>\n<h3>Differences Between the Three Fuels<\/h3>\n<ul><li>Petrol: Commonly used in cars and motorcycles.<\/li><li>Diesel: Commonly used in trucks, buses and heavy machines.<\/li><li>Kerosene: Used in suitable cooking stoves and lamps.<\/li><\/ul>\n<p class=\"safety\"><strong>Safety Precaution:<\/strong> These fuels can catch fire easily. Keep them in suitable containers and away from flames.<\/p>\n<\/section>\n\n<section>\n<h2>LPG, LUBRICATING OIL AND PARAFFIN WAX<\/h2>\n<h3>1. Liquefied Petroleum Gas (LPG)<\/h3>\n<p>LPG, commonly called cooking gas, is a fuel obtained during petroleum refining and natural gas processing.<\/p>\n<h3>Uses:<\/h3>\n<ul><li>Cooking in homes and restaurants.<\/li><li>Heating in some industries.<\/li><\/ul>\n<p class=\"safety\"><strong>Safety:<\/strong> Keep gas cylinders upright in well-ventilated places. Never check for gas leaks with a naked flame.<\/p>\n<h3>2. Lubricating Oil<\/h3>\n<p>Lubricating oil is a petroleum product used to reduce friction between moving parts of engines and machines.<\/p>\n<h3>Uses:<\/h3>\n<ul><li>Helps engines work smoothly.<\/li><li>Reduces wear and tear.<\/li><li>Reduces heat caused by friction.<\/li><li>Lubricates industrial machines.<\/li><\/ul>\n<h3>3. Paraffin Wax<\/h3>\n<p>Paraffin wax is a waxy material obtained from petroleum refining.<\/p>\n<h3>Uses:<\/h3>\n<ul><li>Making candles.<\/li><li>Making some polishes.<\/li><li>Manufacturing some packaging materials and cosmetics.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>BITUMEN, PETROCHEMICALS AND OTHER PRODUCTS<\/h2>\n<h3>1. Bitumen<\/h3>\n<p>Bitumen is a thick, dark material obtained from petroleum refining.<\/p>\n<h3>Uses:<\/h3>\n<ul><li>Surfacing roads.<\/li><li>Binding materials in asphalt.<\/li><li>Making some roofing and waterproofing materials.<\/li><\/ul>\n<h3>2. Petrochemicals<\/h3>\n<p>Petrochemicals are chemicals made from petroleum or natural gas and used as raw materials in manufacturing.<\/p>\n<h3>Examples of Products Made from Petrochemicals<\/h3>\n<ul><li>Plastics and containers.<\/li><li>Synthetic fibres used in clothing.<\/li><li>Some paints and detergents.<\/li><li>Some rubber products.<\/li><li>Packaging materials.<\/li><\/ul>\n<h3>3. Petroleum Coke<\/h3>\n<p>Petroleum coke is a carbon-rich solid produced during certain petroleum-refining processes.<\/p>\n<p><strong>Uses:<\/strong> Some types are used as industrial fuel and in making electrodes.<\/p>\n<h3>4. Aviation Fuel<\/h3>\n<p>Aviation fuel is a refined petroleum product used to power aircraft engines.<\/p>\n<\/section>\n\n<section>\n<h2>ECONOMIC IMPORTANCE AND PROBLEMS OF CRUDE OIL PRODUCTS<\/h2>\n<h3>Economic Importance to Nigeria<\/h3>\n<ol><li>Transportation: Petrol, diesel and aviation fuel power vehicles, machines and aircraft.<\/li><li>Cooking: LPG and kerosene provide fuel for cooking.<\/li><li>Road construction: Bitumen is used to construct and maintain roads.<\/li><li>Industrial production: Petrochemicals provide materials for making plastics, paints and synthetic fibres.<\/li><li>Employment: Refineries, transport companies and factories provide jobs.<\/li><li>Government revenue: The petroleum industry contributes money through taxes, royalties and other payments.<\/li><li>Foreign exchange: Nigeria earns foreign exchange by exporting crude oil and certain petroleum products.<\/li><li>Agriculture: Diesel powers some tractors, irrigation pumps and other farm machines.<\/li><li>Household needs: Petroleum-derived materials are used to make candles, plastics, polishes and some cosmetics.<\/li><\/ol>\n<h3>Problems Associated with Crude Oil Products<\/h3>\n<ol><li>Fire outbreaks: Fuels can cause fires when handled carelessly.<\/li><li>Air pollution: Burning petroleum fuels releases pollutants.<\/li><li>Oil spills: Fuel leaks can pollute soil and water.<\/li><li>Health problems: Fuel fumes and some petroleum chemicals can harm people.<\/li><li>Environmental damage: Pollution can harm plants, animals and aquatic life.<\/li><li>High cost of living: Rising petroleum prices can increase transport and production costs.<\/li><\/ol>\n<h3>Safety Precautions<\/h3>\n<ul><li>Keep fuels away from flames and other sources of ignition.<\/li><li>Store petroleum products in suitable, approved containers.<\/li><li>Keep gas cylinders upright in well-ventilated places.<\/li><li>Avoid spilling fuel into rivers or onto the ground.<\/li><li>Report fuel and gas leaks to responsible adults or trained personnel.<\/li><li>Dispose of used engine oil properly.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>OBJECTIVE QUESTIONS<\/h2>\n<p>Choose the correct answer from options A–D.<\/p>\n<div class=\"questions\">\n<article class=\"question\"><p>1. Which petroleum product is used to make candles?<\/p><div class=\"options\"><span>A. Diesel<\/span><span>B. Bitumen<\/span><span>C. Paraffin wax<\/span><span>D. Petrol<\/span><\/div><\/article>\n<article class=\"question\"><p>2. Nigeria earns foreign exchange by ______.<\/p><div class=\"options\"><span>A. exporting crude oil and certain petroleum products<\/span><span>B. pouring used oil into rivers<\/span><span>C. wasting petroleum products<\/span><span>D. burning all its crude oil<\/span><\/div><\/article>\n<article class=\"question\"><p>3. Which product is commonly used to power many trucks and heavy machines?<\/p><div class=\"options\"><span>A. Kerosene<\/span><span>B. Paraffin wax<\/span><span>C. Bitumen<\/span><span>D. Diesel<\/span><\/div><\/article>\n<article class=\"question\"><p>4. Petrochemicals are chemicals made from petroleum or ______.<\/p><div class=\"options\"><span>A. firewood<\/span><span>B. natural gas<\/span><span>C. fresh milk<\/span><span>D. river water<\/span><\/div><\/article>\n<article class=\"question\"><p>5. Crude oil is processed into useful products in a ______.<\/p><div class=\"options\"><span>A. farm<\/span><span>B. classroom<\/span><span>C. refinery<\/span><span>D. bakery<\/span><\/div><\/article>\n<article class=\"question\"><p>6. Which petroleum product is commonly used for cooking in gas cookers?<\/p><div class=\"options\"><span>A. LPG<\/span><span>B. Bitumen<\/span><span>C. Petroleum coke<\/span><span>D. Lubricating oil<\/span><\/div><\/article>\n<article class=\"question\"><p>7. Pouring used engine oil into a river can cause ______.<\/p><div class=\"options\"><span>A. cleaner drinking water<\/span><span>B. better water quality<\/span><span>C. improved fish health<\/span><span>D. water pollution<\/span><\/div><\/article>\n<article class=\"question\"><p>8. The main function of lubricating oil is to ______.<\/p><div class=\"options\"><span>A. construct roads<\/span><span>B. reduce friction between moving parts<\/span><span>C. make candles<\/span><span>D. manufacture plastics<\/span><\/div><\/article>\n<article class=\"question\"><p>9. Aviation fuel is mainly used to power ______.<\/p><div class=\"options\"><span>A. bicycles<\/span><span>B. wheelbarrows<\/span><span>C. aircraft<\/span><span>D. hand fans<\/span><\/div><\/article>\n<article class=\"question\"><p>10. Which petroleum product is widely used in road construction?<\/p><div class=\"options\"><span>A. Bitumen<\/span><span>B. Petrol<\/span><span>C. Kerosene<\/span><span>D. LPG<\/span><\/div><\/article>\n<article class=\"question\"><p>11. One economic benefit of crude oil products is that they ______.<\/p><div class=\"options\"><span>A. stop all transportation<\/span><span>B. destroy every industry<\/span><span>C. prevent employment<\/span><span>D. support industrial production<\/span><\/div><\/article>\n<article class=\"question\"><p>12. Which product is commonly used as fuel for many motorcycles?<\/p><div class=\"options\"><span>A. Paraffin wax<\/span><span>B. Petrol<\/span><span>C. Bitumen<\/span><span>D. Lubricating oil<\/span><\/div><\/article>\n<article class=\"question\"><p>13. LPG is commonly known as ______.<\/p><div class=\"options\"><span>A. engine oil<\/span><span>B. road tar<\/span><span>C. cooking gas<\/span><span>D. petroleum coke<\/span><\/div><\/article>\n<article class=\"question\"><p>14. Which of the following is a safety precaution when handling petrol?<\/p><div class=\"options\"><span>A. Keep it away from sources of ignition.<\/span><span>B. Store it beside an open flame.<\/span><span>C. Pour it into a river.<\/span><span>D. Allow children to handle it carelessly.<\/span><\/div><\/article>\n<article class=\"question\"><p>15. Which product is used to make some plastics and synthetic fibres?<\/p><div class=\"options\"><span>A. Fresh fish<\/span><span>B. Raw cassava<\/span><span>C. Drinking water<\/span><span>D. Petrochemicals<\/span><\/div><\/article>\n<\/div>\n<\/section>\n\n<section>\n<h2>ANSWER KEY<\/h2>\n<div class=\"answer-key\">\n<div class=\"answer\"><span>1.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>2.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>3.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>4.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>5.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>6.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>7.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>8.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>9.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>10.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>11.<\/span><strong>D<\/strong><\/div><div class=\"answer\"><span>12.<\/span><strong>B<\/strong><\/div><div class=\"answer\"><span>13.<\/span><strong>C<\/strong><\/div><div class=\"answer\"><span>14.<\/span><strong>A<\/strong><\/div><div class=\"answer\"><span>15.<\/span><strong>D<\/strong><\/div>\n<\/div>\n<\/section>\n<\/main>\n<\/body>\n<\/html>\n"},
"hist|3|1":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n:root{--ink:#243447;--muted:#5b6b7a;--teal:#0f766e;--soft:#e7f5f2;--gold:#d99a24;--paper:#fffdf8;--line:#dfe7e5;--shadow:0 18px 45px rgba(33,55,72,.11)}\n*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(15,118,110,.08),transparent 28rem),linear-gradient(135deg,#eef7f5,#f8f4ea);font-family:\"Segoe UI\",Arial,sans-serif;line-height:1.65}main{width:min(920px,calc(100% - 32px));margin:32px auto;padding:clamp(24px,5vw,62px);background:var(--paper);border:1px solid rgba(15,118,110,.14);border-radius:24px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 32px;padding-bottom:18px;border-bottom:3px solid var(--gold);color:var(--teal);font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;letter-spacing:.08em}section{margin:0 0 40px}h2{margin:0 0 19px;padding:12px 16px;border-left:6px solid var(--teal);border-radius:0 10px 10px 0;background:var(--soft);color:#155e59;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.35;letter-spacing:.045em}h3{margin:24px 0 8px;color:#315263;font-size:1.08rem}p{margin:9px 0}ul,ol{margin:10px 0 16px;padding-left:28px}li{margin:5px 0;padding-left:4px}.questions{display:grid;gap:16px;margin-top:12px}.question{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.question p{margin:0 0 7px;font-weight:700}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;color:var(--muted)}.answer-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid #c9e3de;border-radius:11px;background:#f1faf8;font-weight:700}.answer strong{color:var(--teal)}\n@media(max-width:560px){main{width:min(100% - 18px,920px);margin:9px auto;padding:22px 17px;border-radius:17px}.options{grid-template-columns:1fr}.answer-key{grid-template-columns:repeat(3,minmax(0,1fr))}}\n<\/style>\n<\/head>\n<body>\n<main>\n<p class=\"eyebrow\">THE GROWTH OF INDUSTRIES IN NIGERIA (1)<\/p>\n\n<section>\n<h2>MEANING AND TYPES OF INDUSTRIES<\/h2>\n<h3>Meaning of Industry<\/h3>\n<p>An industry is an economic activity that involves producing goods, processing raw materials or providing services.<\/p>\n<p>Industrialisation is the process through which a country develops industries to produce goods and provide services.<\/p>\n<h3>Types of Industries<\/h3>\n<ol><li>Primary Industries: Obtain raw materials directly from nature. Examples: farming, fishing and mining.<\/li><li>Secondary Industries: Process raw materials into finished or semi-finished products. Examples: textile manufacturing, food processing and cement production.<\/li><li>Tertiary Industries: Provide services rather than mainly producing physical goods. Examples: banking, transportation and healthcare.<\/li><\/ol>\n<h3>Importance of Industries in Nigeria<\/h3>\n<ol><li>Provide employment and income.<\/li><li>Produce goods needed by people.<\/li><li>Generate government revenue through taxes and other payments.<\/li><li>Encourage the development of roads and electricity.<\/li><li>Support local and international trade.<\/li><li>Develop technical skills and reduce dependence on imported goods.<\/li><\/ol>\n<\/section>\n\n<section>\n<h2>AGRICULTURAL, FOOD AND TOBACCO INDUSTRIES<\/h2>\n<h3>1. Agricultural Industries<\/h3>\n<p>Agricultural industries involve farming, livestock production, fishing, forestry and processing agricultural products.<\/p>\n<p>Examples of agricultural products include cassava, rice, cocoa, rubber, cotton and palm oil.<\/p>\n<p>Examples of agricultural industries are rice mills, cassava-processing factories, palm oil plants and cocoa-processing factories.<\/p>\n<h3>Benefits:<\/h3>\n<ul><li>Provide food and raw materials for factories.<\/li><li>Create jobs and generate income.<\/li><li>Support exports and rural development.<\/li><li>Provide markets for farmers' produce.<\/li><\/ul>\n<h3>2. Food Industries<\/h3>\n<p>Food industries process, preserve, package or manufacture food and drinks.<\/p>\n<p>Examples: bakeries, flour mills, rice mills, fruit juice factories and vegetable oil plants.<\/p>\n<h3>Benefits:<\/h3>\n<ul><li>Provide processed and packaged food.<\/li><li>Reduce food spoilage through preservation.<\/li><li>Create jobs and provide markets for farmers.<\/li><\/ul>\n<h3>3. Tobacco Industries<\/h3>\n<p>Tobacco industries process tobacco leaves into products such as cigarettes. Tobacco use can cause serious diseases, so it should not be encouraged. Tobacco production and sales are regulated in Nigeria.<\/p>\n<\/section>\n\n<section>\n<h2>ICT, HEALTHCARE, SERVICE AND UTILITIES INDUSTRIES<\/h2>\n<h3>1. Information and Communication Technology (ICT)<\/h3>\n<p>ICT means Information and Communication Technology. It involves using computers, mobile phones, networks and other digital tools to process and share information.<\/p>\n<p>Examples: mobile telephone services, internet services, software development and computer repairs.<\/p>\n<h3>Benefits:<\/h3>\n<ul><li>Makes communication faster.<\/li><li>Supports teaching, learning and business.<\/li><li>Provides access to information.<\/li><li>Creates jobs and supports electronic payments.<\/li><\/ul>\n<h3>2. Healthcare Industry<\/h3>\n<p>The healthcare industry provides medical care, medicines, medical equipment and other health-related services.<\/p>\n<p>Examples: hospitals, clinics, medical laboratories and pharmaceutical companies.<\/p>\n<h3>Benefits:<\/h3>\n<ul><li>Prevents and treats diseases.<\/li><li>Provides jobs for health workers.<\/li><li>Supplies medicines and medical equipment.<\/li><li>Improves people's health and productivity.<\/li><\/ul>\n<h3>3. Service Industries<\/h3>\n<p>Service industries provide services to individuals, businesses and government.<\/p>\n<p>Examples: banking, transportation, education, tourism, insurance and telecommunications.<\/p>\n<p>They create jobs, support trade and help people carry out daily activities.<\/p>\n<h3>4. Utilities Industries<\/h3>\n<p>Utilities provide essential services needed by homes, businesses and communities.<\/p>\n<p>Examples: electricity supply, water supply, gas supply, waste management and sanitation.<\/p>\n<h3>Importance of Utilities<\/h3>\n<ul><li>Electricity powers homes and factories.<\/li><li>Water supports drinking, cooking and cleaning.<\/li><li>Waste management and sanitation protect public health.<\/li><li>Reliable utilities support industrial development.<\/li><\/ul>\n<\/section>\n\n<section>\n<h2>NATURAL RESOURCES, OIL AND GAS, PETROLEUM AND CHEMICAL INDUSTRIES<\/h2>\n<h3>1. Natural Resources Industry<\/h3>\n<p>Natural resources are materials found in nature that people use to meet their needs and produce goods.<\/p>\n<p>Examples in Nigeria include crude oil, natural gas, limestone, coal, tin, gold, iron ore and timber.<\/p>\n<h3>Importance:<\/h3>\n<ul><li>Supply raw materials to factories.<\/li><li>Create jobs and generate government revenue.<\/li><li>Support trade and exports.<\/li><\/ul>\n<p>Careless extraction of natural resources can cause pollution, deforestation and damage to farmland.<\/p>\n<h3>2. Oil and Gas Industry<\/h3>\n<p>The oil and gas industry involves exploring for, extracting, processing, transporting and selling crude oil and natural gas.<\/p>\n<p>Nigeria's oil and gas resources are concentrated mainly in the Niger Delta.<\/p>\n<h3>3. Petroleum Industry<\/h3>\n<p>The petroleum industry deals with crude oil and its products.<\/p>\n<p>Crude oil was discovered in commercial quantities in Nigeria in 1956 at Oloibiri, in present-day Bayelsa State. Nigeria began exporting crude oil in 1958.<\/p>\n<h3>Products of Crude Oil<\/h3>\n<ul><li>Petrol.<\/li><li>Diesel.<\/li><li>Kerosene.<\/li><li>Lubricating oil.<\/li><li>Bitumen.<\/li><li>Paraffin wa
