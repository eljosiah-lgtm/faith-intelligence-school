pan> is a group of people with similar political ideas who work together to contest elections and gain political power.<\/p>\n<\/div>\n<p class=\"lead-in\">Examples of political parties in Nigeria include:<\/p>\n<ul class=\"parties\">\n<li><span class=\"abbr\">APC<\/span><span>All Progressives Congress<\/span><\/li>\n<li><span class=\"abbr\">PDP<\/span><span>Peoples Democratic Party<\/span><\/li>\n<li><span class=\"abbr\">LP<\/span><span>Labour Party<\/span><\/li>\n<li><span class=\"abbr\">NNPP<\/span><span>New Nigeria Peoples Party<\/span><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<!-- REASONS -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Reasons for Forming Political Parties<\/h2><\/div>\n<div class=\"c-body\">\n<p class=\"lead-in\">Political parties are formed to:<\/p>\n<ol class=\"points\">\n<li>Contest elections and gain political power.<\/li>\n<li>Promote their ideas and policies.<\/li>\n<li>Represent citizens' interests.<\/li>\n<li>Present candidates for elections.<\/li>\n<li>Help citizens choose leaders.<\/li>\n<li>Monitor government activities and encourage accountability.<\/li>\n<\/ol>\n<\/div>\n<\/article>\n<!-- STEPS -->\n<article class=\"card gold\">\n<div class=\"c-head\"><h2>Steps in Forming a Political Party<\/h2><\/div>\n<div class=\"c-body\">\n<p class=\"lead-in\">The steps include:<\/p>\n<ol class=\"steps\">\n<li>Gathering interested members.<\/li>\n<li>Choosing a name, symbol and colours.<\/li>\n<li>Writing a constitution, which contains the party's rules.<\/li>\n<li>Preparing a manifesto, which explains the party's plans and programmes.<\/li>\n<li>Choosing party leaders.<\/li>\n<li>Registering with the Independent National Electoral Commission (INEC) according to legal requirements, with the required documents.<\/li>\n<\/ol>\n<\/div>\n<\/article>\n<!-- REGISTRATION & ACTIVITIES -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Registration and Activities of Political Parties<\/h2><\/div>\n<div class=\"c-body\">\n\n<p class=\"lead-in\">Activities of political parties include:<\/p>\n<ul class=\"bullets\">\n<li>Registering members and holding meetings.<\/li>\n<li>Conducting primary elections to select candidates.<\/li>\n<li>Campaigning and explaining their manifestos to voters.<\/li>\n<li>Contesting elections.<\/li>\n<li>Acting as opposition when they are not in government.<\/li>\n<\/ul>\n<\/div>\n<\/article>\n<!-- IMPORTANCE, PROBLEMS, CONDUCT -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Importance, Problems and Good Conduct<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"two-col\">\n<div class=\"panel good\">\n<h3>Importance of political parties<\/h3>\n<ol class=\"points\">\n<li>They promote democracy and civil rule.<\/li>\n<li>They educate voters and present candidates.<\/li>\n\n<li>They encourage political participation and peaceful competition.<\/li>\n<li>They help hold the government accountable.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel hard\">\n<h3>Problems of political parties<\/h3>\n<ul class=\"bullets\">\n<li>Corruption and election malpractice.<\/li>\n<li>Violence during campaigns.<\/li>\n<li>Disagreements over leadership.<\/li>\n<li>Lack of internal democracy.<\/li>\n<li>Ethnic and religious divisions.<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div class=\"conduct\">\n<p><strong>Good conduct:<\/strong> Political parties should obey the law, avoid violence, respect other parties, campaign peacefully and resolve disputes lawfully.<\/p>\n<\/div>\n<\/div>\n<\/article>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer from options A–C.<\/p>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Which document explains a political party's plans and programmes?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Constitution<\/li><li><b>B.<\/b>Manifesto<\/li><li><b>C.<\/b>Voter register<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Which of the following is an example of a political party in Nigeria?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>UNICEF<\/li><li><b>B.<\/b>NAFDAC<\/li><li><b>C.<\/b>Labour Party<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>What should political parties do when disagreements arise?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Resolve disputes peacefully and lawfully<\/li><li><b>B.<\/b>Encourage violence<\/li><li><b>C.<\/b>Destroy public property<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>What is the main purpose of a political party?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>To organise school activities<\/li><li><b>B.<\/b>To contest elections and gain political power<\/li><li><b>C.<\/b>To control all businesses<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Which organisation registers political parties in Nigeria?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>NNPC<\/li><li><b>B.<\/b>NAFDAC<\/li><li><b>C.<\/b>INEC<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Which of these is a problem faced by political parties?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Voter education<\/li><li><b>B.<\/b>Violence during campaigns<\/li><li><b>C.<\/b>Peaceful competition<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>What is the function of a political party constitution?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>To state the party's rules<\/li><li><b>B.<\/b>To explain market prices<\/li><li><b>C.<\/b>To list school subjects<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>Why do political parties organise campaigns?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>To stop elections<\/li><li><b>B.<\/b>To prevent citizens from voting<\/li><li><b>C.<\/b>To explain their programmes and gain voters' support<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>Which activity helps a party select its candidates for an election?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Party primary election<\/li><li><b>B.<\/b>School assembly<\/li><li><b>C.<\/b>Community festival<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Which of the following is an importance of political parties?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Encouraging election violence<\/li><li><b>B.<\/b>Helping citizens choose their leaders<\/li><li><b>C.<\/b>Preventing political participation<\/li><\/ul><\/div>\n\n\n<\/section>\n<section>\n<h2>Answer Key<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>B<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (6)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|1|7":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/>\n<title>History – Primary 6: Civic Rules in Nigeria (7)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n  .topic-line{\n    margin:10px 0 0;\n    font-size:19px;\n    font-style:italic;\n    color:#dfe6f4;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Section cards */\n  .card{\n    margin-top:30px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:12px 22px 10px;\n    background:var(--tint);\n    border-bottom:1px solid var(--line);\n  }\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:var(--navy);\n    margin:0;\n  }\n  .c-body{padding:16px 22px 8px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:20px 0 8px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n  .lead-in{font-weight:700;color:var(--navy);margin:14px 0 8px}\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:14px 18px;\n    margin:0 0 14px;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n\n  .inec{\n    display:flex;\n    align-items:center;\n    gap:14px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-radius:4px;\n    padding:10px 16px;\n    margin:0 0 14px;\n  }\n  .inec .abbr{\n    flex:0 0 auto;\n    background:var(--navy);\n    color:#fff;\n    border-radius:3px;\n    padding:4px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    letter-spacing:.04em;\n  }\n  .inec p{margin:0}\n\n  .note{\n    background:var(--gold-tint);\n    border-left:5px solid var(--crimson);\n    padding:10px 16px;\n    margin:4px 0 14px;\n  }\n  .note strong{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--crimson);\n  }\n  .banner{\n    background:var(--navy);\n    color:#fff;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:14px 22px;\n    margin:6px 0 18px;\n  }\n  .banner p{margin:0}\n  .banner strong{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:#e7cf8e;\n  }\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n  ol.points li strong{color:var(--navy)}\n\n  /* Step flow */\n  ol.steps{list-style:none;counter-reset:s;margin:4px 0 14px;padding:0}\n  ol.steps li{\n    counter-increment:s;\n    position:relative;\n    padding:4px 0 18px 54px;\n  }\n  ol.steps li::before{\n    content:counter(s);\n    position:absolute;\n    left:0;\n    top:0;\n    width:38px;\n    height:38px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    border:3px solid var(--gold);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:16px;\n    line-height:32px;\n    text-align:center;\n    z-index:1;\n  }\n  ol.steps li::after{\n    content:\"\";\n    position:absolute;\n    left:18px;\n    top:38px;\n    bottom:0;\n    width:3px;\n    background:var(--line);\n  }\n  ol.steps li:last-child{padding-bottom:4px}\n  ol.steps li:last-child::after{display:none}\n\n  /* Term list */\n  dl.terms{margin:0 0 14px}\n  dl.terms .row{\n    display:grid;\n    grid-template-columns:190px 1fr;\n    gap:0 16px;\n    padding:10px 0;\n    border-bottom:1px dotted var(--line);\n  }\n  dl.terms .row:last-child{border-bottom:none}\n  dl.terms dt{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:#fff;\n    background:var(--accent);\n    border-radius:3px;\n    padding:4px 12px;\n    align-self:start;\n  }\n  dl.terms dd{margin:0}\n\n  /* Free / Fair / Credible */\n  .trio{\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    gap:12px;\n    margin:4px 0 14px;\n  }\n  .tile{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-top:4px solid var(--navy);\n    border-radius:4px;\n    padding:10px 14px;\n    font-size:15.5px;\n    line-height:1.5;\n  }\n  .tile.t2{border-top-color:var(--gold)}\n  .tile.t3{border-top-color:var(--crimson)}\n  .tile strong{\n    display:block;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--navy);\n    font-size:17px;\n    margin-bottom:2px;\n  }\n\n  /* Malpractice panels */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 16px 14px;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    margin:12px 0 10px;\n    padding:4px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel.hard{border-top:4px solid var(--crimson)}\n  .panel.hard h3{background:var(--crimson)}\n  .panel.good{border-top:4px solid var(--navy)}\n  .panel.good h3{background:var(--navy)}\n  .panel p{margin:0}\n  .chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}\n  .chips li{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:14px;\n    background:var(--crimson-tint);\n    border:1px solid #e6c9ce;\n    color:var(--crimson);\n    border-radius:20px;\n    padding:2px 12px;\n  }\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin-bottom:12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 26px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .two-col,.trio{grid-template-columns:1fr}\n    dl.terms .row{grid-template-columns:1fr;gap:6px}\n    dl.terms dt{justify-self:start}\n    .inec{flex-direction:column;align-items:flex-start;gap:6px}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.define,.inec,.inec .abbr,.note,.banner,.tile,\n    .panel h3,.chips li,dl.terms dt,.instruction,.ans,ol.points li::before,\n    ol.steps li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub{break-after:avoid;page-break-after:avoid}\n    .panel,.banner,.tile{break-inside:avoid;page-break-inside:avoid}\n    ol.steps li,dl.terms .row{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (7)<\/h1>\n<p class=\"topic-line\">The Conduct of Election<\/p>\n<\/header>\n<main>\n<!-- MEANING AND TYPES -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Meaning and Types of Election<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"define\">\n<p>An <span class=\"term\">election<\/span> is a process through which eligible citizens vote to choose their leaders and representatives.<\/p>\n<\/div>\n<div class=\"inec\">\n<span class=\"abbr\">INEC<\/span>\n<p>In Nigeria, the Independent National Electoral Commission (INEC) conducts federal and state elections.<\/p>\n<\/div>\n<p class=\"lead-in\">Types of elections:<\/p>\n<ol class=\"points\">\n<li><strong>Presidential election<\/strong> – chooses the President.<\/li>\n<li><strong>Governorship election<\/strong> – chooses a state Governor.<\/li>\n<li><strong>National Assembly election<\/strong> – chooses Senators and members of the House of Representatives.<\/li>\n<li><strong>State House of Assembly election<\/strong> – chooses state lawmakers.<\/li>\n<li><strong>Local government election<\/strong> – chooses local government leaders and councillors.<\/li>\n<\/ol>\n\n<\/div>\n<\/article>\n<!-- PREPARATION -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Preparation for Election<\/h2><\/div>\n<div class=\"c-body\">\n<p>Election preparation involves activities carried out before voting.<\/p>\n<p class=\"lead-in\">Major activities include:<\/p>\n<ol class=\"points\">\n<li>Announcement of election dates.<\/li>\n<li>Registration of voters and issuance of Permanent Voter Cards (PVCs).<\/li>\n<li>Registration of political parties.<\/li>\n<li>Selection of candidates by political parties.<\/li>\n<li>Campaigns to explain candidates' plans.<\/li>\n<li>Preparation of election materials and training of officials.<\/li>\n<li>Voter education on voting procedures.<\/li>\n<\/ol>\n<p class=\"note\">Proper preparation reduces confusion and promotes orderly elections.<\/p>\n<\/div>\n<\/article>\n<!-- PROCEDURES -->\n<article class=\"card gold\">\n<div class=\"c-head\"><h2>Procedures for Conducting an Election<\/h2><\/div>\n<div class=\"c-body\">\n<p class=\"lead-in\">The main steps are:<\/p>\n<ol class=\"steps\">\n<li>Election officials set up the polling unit.<\/li>\n<li>Voters undergo accreditation, during which their identity and eligibility are checked.<\/li>\n<li>Eligible voters receive ballot papers or use approved voting equipment.<\/li>\n<li>Voters privately select their preferred candidates.<\/li>\n\n<li>Voting closes according to the rules.<\/li>\n<li>Officials count the votes, record the results and announce them according to electoral procedures.<\/li>\n<\/ol>\n<div class=\"banner\">\n<p><strong>Duties of voters:<\/strong> Vote privately, follow officials' instructions, avoid multiple voting and refuse to buy or sell votes.<\/p>\n<\/div>\n<\/div>\n<\/article>\n<!-- COUNTING -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Counting and Announcement of Results<\/h2><\/div>\n<div class=\"c-body\">\n<dl class=\"terms\">\n<div class=\"row\"><dt>Counting<\/dt><dd>Determining the number of votes received by each candidate.<\/dd><\/div>\n<div class=\"row\"><dt>Recording<\/dt><dd>Writing the results accurately on official forms.<\/dd><\/div>\n<div class=\"row\"><dt>Collation<\/dt><dd>Bringing together results from different polling units or electoral areas.<\/dd><\/div>\n<div class=\"row\"><dt>Declaration of winner<\/dt><dd>Announcing the candidate who meets the legal requirements for winning.<\/dd><\/div>\n<div class=\"row\"><dt>Election petition<\/dt><dd>A legal challenge to an election through the appropriate court or tribunal.<\/dd><\/div>\n<\/dl>\n<p class=\"note\">Accurate counting and collation reduce errors and election disputes.<\/p>\n<\/div>\n<\/article>\n<!-- FREE, FAIR, CREDIBLE -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Free, Fair and Credible Elections<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"trio\">\n<div class=\"tile\"><strong>Free<\/strong>A free election allows voters to choose without threats or intimidation.<\/div>\n<div class=\"tile t2\"><strong>Fair<\/strong>A fair election gives candidates and parties a lawful opportunity to participate under the same rules.<\/div>\n<div class=\"tile t3\"><strong>Credible<\/strong>A credible election is conducted transparently, with votes properly handled and results reflecting the lawful process.<\/div>\n<\/div>\n<p class=\"lead-in\">Characteristics of credible elections:<\/p>\n<ol class=\"points\">\n<li>Freedom of choice and secret ballot.<\/li>\n<li>Fair treatment of candidates.<\/li>\n<li>Accurate counting of votes.<\/li>\n<li>Impartial election officials.<\/li>\n<li>Security and transparency.<\/li>\n<li>Obedience to electoral laws.<\/li>\n<\/ol>\n<h3 class=\"sub\">Electoral Malpractice<\/h3>\n<div class=\"define\">\n<p><span class=\"term\">Electoral malpractice<\/span> is an unlawful or dishonest act intended to interfere with an election.<\/p>\n<\/div>\n<div class=\"two-col\">\n<div class=\"panel hard\">\n<h3>Examples<\/h3>\n<ul class=\"chips\">\n<li>Vote buying<\/li>\n<li>Multiple voting<\/li>\n<li>Voter intimidation<\/li>\n<li>Ballot box snatching<\/li>\n<li>Impersonation<\/li>\n<li>Violence<\/li>\n<li>Falsification of results<\/li>\n<\/ul>\n<\/div>\n<div class=\"panel good\">\n<h3>Prevention<\/h3>\n<p>Enforce electoral laws, educate voters, ensure officials act honestly, report electoral offences and reject vote buying and violence.<\/p>\n<\/div>\n<\/div>\n<div class=\"banner\">\n<p><strong>Importance of peaceful elections:<\/strong> They protect lives and property, promote national unity and strengthen democracy.<\/p>\n<\/div>\n<\/div>\n<\/article>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer from options A–C.<\/p>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>What is the process of bringing together results from different polling units called?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Accreditation<\/li><li><b>B.<\/b>Collation<\/li><li><b>C.<\/b>Campaigning<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Which of these is an example of electoral malpractice?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Voter education<\/li><li><b>B.<\/b>Peaceful campaigning<\/li><li><b>C.<\/b>Vote buying<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>Which election chooses members of the Nigerian Senate and House of Representatives?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>National Assembly election<\/li><li><b>B.<\/b>Governorship election<\/li><li><b>C.<\/b>Local government election<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>What is the purpose of voter accreditation?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>To announce election results<\/li><li><b>B.<\/b>To check voters' identity and eligibility<\/li><li><b>C.<\/b>To select political candidates<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Which organisation conducts presidential elections in Nigeria?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>NAFDAC<\/li><li><b>B.<\/b>FRSC<\/li><li><b>C.<\/b>INEC<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>What is an election petition?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>A legal challenge to an election<\/li><li><b>B.<\/b>A campaign promise<\/li><li><b>C.<\/b>A voter registration exercise<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Which principle keeps a voter's choice private?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Vote buying<\/li><li><b>B.<\/b>Secret ballot<\/li><li><b>C.<\/b>Multiple voting<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>Which activity takes place before election day?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Declaration of the winner<\/li><li><b>B.<\/b>Counting votes<\/li><li><b>C.<\/b>Voter registration<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>A credible election requires <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Accurate counting of votes<\/li><li><b>B.<\/b>Intimidation of voters<\/li><li><b>C.<\/b>Falsification of results<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Which of these is an important benefit of peaceful elections?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Increased electoral malpractice<\/li><li><b>B.<\/b>Strengthening democracy<\/li><li><b>C.<\/b>Encouraging violence<\/li><\/ul><\/div>\n<\/section>\n<section>\n<h2>Answer Key<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>B<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (7)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|1|8":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/>\n<title>History – Primary 6: Civic Rules in Nigeria (8)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n  .topic-line{\n    margin:10px 0 0;\n    font-size:19px;\n    font-style:italic;\n    color:#dfe6f4;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Section cards */\n  .card{\n    margin-top:30px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:12px 22px 10px;\n    background:var(--tint);\n    border-bottom:1px solid var(--line);\n  }\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:var(--navy);\n    margin:0;\n  }\n  .c-body{padding:16px 22px 8px}\n  .lead-in{font-weight:700;color:var(--navy);margin:14px 0 8px}\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:14px 18px;\n    margin:0 0 14px;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n\n  .note{\n    background:var(--gold-tint);\n    border-left:5px solid var(--crimson);\n    padding:10px 16px;\n    margin:4px 0 14px;\n  }\n  .note strong{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--crimson);\n  }\n  .banner{\n    background:var(--navy);\n    color:#fff;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:14px 22px;\n    margin:6px 0 18px;\n  }\n  .banner p{margin:0}\n  .banner strong{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:#e7cf8e;\n  }\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n\n  /* Bullet lists */\n  ul.bullets{list-style:none;margin:0 0 14px;padding:0}\n  ul.bullets li{\n    position:relative;\n    padding:6px 0 6px 28px;\n    border-bottom:1px dotted var(--line);\n  }\n  ul.bullets li:last-child{border-bottom:none}\n  ul.bullets li::before{\n    content:\"\";\n    position:absolute;\n    left:4px;\n    top:15px;\n    width:10px;\n    height:10px;\n    background:var(--accent);\n    transform:rotate(45deg);\n  }\n\n  /* Step flow */\n  ol.steps{list-style:none;counter-reset:s;margin:4px 0 14px;padding:0}\n  ol.steps li{\n    counter-increment:s;\n    position:relative;\n    padding:4px 0 18px 54px;\n  }\n  ol.steps li::before{\n    content:counter(s);\n    position:absolute;\n    left:0;\n    top:0;\n    width:38px;\n    height:38px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    border:3px solid var(--gold);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:16px;\n    line-height:32px;\n    text-align:center;\n    z-index:1;\n  }\n  ol.steps li::after{\n    content:\"\";\n    position:absolute;\n    left:18px;\n    top:38px;\n    bottom:0;\n    width:3px;\n    background:var(--line);\n  }\n  ol.steps li:last-child{padding-bottom:4px}\n  ol.steps li:last-child::after{display:none}\n\n  /* Oath tiles */\n  .duo{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:14px;\n    margin:4px 0 14px;\n  }\n  .tile{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-top:4px solid var(--navy);\n    border-radius:4px;\n    padding:10px 16px 6px;\n  }\n  .tile.t2{border-top-color:var(--crimson)}\n  .tile strong{\n    display:block;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--navy);\n    font-size:17px;\n    margin-bottom:2px;\n  }\n  .tile.t2 strong{color:var(--crimson)}\n\n  /* Date highlight */\n  .dateline{\n    display:flex;\n    align-items:center;\n    gap:16px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:6px 0 14px;\n  }\n  .dateline .day{\n    flex:0 0 auto;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:6px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    line-height:1.1;\n  }\n  .dateline .day b{display:block;font-size:26px;color:#e7cf8e}\n  .dateline .day span{font-size:13px;letter-spacing:.06em}\n  .dateline p{margin:0}\n\n  /* Duties panels */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 16px 8px;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    margin:12px 0 6px;\n    padding:4px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel.good{border-top:4px solid var(--navy);--accent:var(--navy)}\n  .panel.good h3{background:var(--navy)}\n  .panel.hard{border-top:4px solid var(--crimson);--accent:var(--crimson)}\n  .panel.hard h3{background:var(--crimson)}\n  .panel ol.points li{padding-left:40px}\n  .panel ol.points li::before{width:26px;height:26px;line-height:26px;font-size:13px}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin-bottom:12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 26px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .two-col,.duo{grid-template-columns:1fr}\n    .dateline{flex-direction:column;align-items:flex-start;gap:8px}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.define,.note,.banner,.tile,.dateline,\n    .dateline .day,.panel h3,.instruction,.ans,ol.points li::before,\n    ol.steps li::before,ul.bullets li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2{break-after:avoid;page-break-after:avoid}\n    .panel,.banner,.tile,.dateline{break-inside:avoid;page-break-inside:avoid}\n    ol.steps li{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (8)<\/h1>\n<p class=\"topic-line\">Inauguration of Elected Leaders<\/p>\n<\/header>\n<main>\n<!-- MEANING AND IMPORTANCE -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Meaning and Importance of Inauguration<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"define\">\n<p><span class=\"term\">Inauguration<\/span> is a formal ceremony in which an elected leader officially begins a term of office.<\/p>\n<\/div>\n<p class=\"lead-in\">Examples of leaders inaugurated:<\/p>\n<ol class=\"points\">\n<li>President of Nigeria.<\/li>\n<li>State Governors.<\/li>\n<li>Members of the National and State Houses of Assembly.<\/li>\n<li>Local government chairmen, according to applicable laws.<\/li>\n<\/ol>\n<p class=\"lead-in\">Importance of inauguration:<\/p>\n<ul class=\"bullets\">\n<li>Marks the official beginning of a leader's term.<\/li>\n<li>Promotes constitutional rule.<\/li>\n<li>Encourages peaceful transfer of power.<\/li>\n<li>Allows leaders to make their official promises.<\/li>\n<li>Builds public confidence.<\/li><li>Encourages accountability.<\/li><li>Promotes national unity.<\/li><\/ul>\n<\/div>\n<\/article>\n<!-- PREPARATION -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Preparation for Inauguration<\/h2><\/div>\n<div class=\"c-body\">\n<p>Preparations are made to ensure that the ceremony is safe and orderly.<\/p>\n<p class=\"lead-in\">Major preparations include:<\/p>\n<ol class=\"points\">\n<li>Fixing the date and choosing the venue.<\/li>\n<li>Inviting guests and government officials.<\/li>\n<li>Arranging security.<\/li>\n<li>Preparing oath documents.<\/li>\n<li>Organising the ceremony.<\/li>\n<li>Preparing the leader's speech.<\/li>\n<\/ol>\n<div class=\"define\">\n<p>An <span class=\"term\">inaugural address<\/span> is a speech in which a newly inaugurated leader explains plans and priorities for the administration.<\/p>\n<\/div>\n<\/div>\n<\/article>\n<!-- OATHS -->\n<article class=\"card gold\">\n<div class=\"c-head\"><h2>Oath of Office and Oath of Allegiance<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"define\">\n<p>An <span class=\"term\">oath<\/span> is a solemn promise or declaration.<\/p>\n<\/div>\n<div class=\"duo\">\n<div class=\"tile\">\n<strong>Oath of office<\/strong>\n<p>A promise to perform official duties faithfully and uphold the Constitution.<\/p>\n<\/div>\n<div class=\"tile t2\">\n<strong>Oath of allegiance<\/strong>\n<p>A declaration of loyalty to Nigeria and its Constitution.<\/p>\n<\/div>\n<\/div>\n<p>The President's oath is administered by the Chief Justice of Nigeria or another legally authorised judicial officer. A Governor's oath is administered by the state's Chief Judge or another legally authorised judicial officer.<\/p>\n<div class=\"banner\">\n<p><strong>Importance of the oaths:<\/strong> They remind leaders of their responsibilities, loyalty to Nigeria and duty to obey the Constitution.<\/p>\n<\/div>\n<\/div>\n<\/article>\n<!-- CEREMONY -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Inauguration Ceremony<\/h2><\/div>\n<div class=\"c-body\">\n<p class=\"lead-in\">The main activities may include:<\/p>\n<ol class=\"steps\">\n<li>Arrival of guests and the elected leader.<\/li>\n<li>Opening activities and official announcements.<\/li>\n<li>Administration of the required oath or oaths.<\/li>\n<li>Signing of official documents, where required.<\/li>\n<li>Delivery of the inaugural address.<\/li>\n<li>Conclusion of the ceremony.<\/li>\n<\/ol>\n<div class=\"dateline\">\n<div class=\"day\"><b>29<\/b><span>MAY<\/span><\/div>\n<p>Under Nigeria's Fourth Republic, presidential inaugurations have traditionally taken place on 29 May, including the inauguration of President Bola Tinubu in 2023.<\/p>\n<\/div>\n<\/div>\n<\/article>\n<!-- DUTIES -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Duties After Inauguration<\/h2><\/div>\n<div class=\"c-body\">\n\n\n<div class=\"two-col\">\n<div class=\"panel good\">\n<h3>Duties of elected leaders<\/h3>\n<ol class=\"points\">\n<li>Uphold the Constitution and obey the law.<\/li>\n<li>Protect lives and property.<\/li>\n<li>Respect citizens' rights.<\/li>\n<li>Use public funds responsibly.<\/li>\n<li>Promote peace and national development.<\/li>\n<li>Provide public services within their responsibilities.<\/li><li>Be accountable to the people.<\/li><\/ol>\n<\/div>\n<div class=\"panel hard\">\n<h3>Duties of citizens<\/h3>\n<ol class=\"points\">\n<li>Obey the law and pay lawful taxes.<\/li>\n<li>Support lawful government programmes.<\/li>\n<li>Report wrongdoing to the appropriate authorities.<\/li>\n<li>Hold leaders accountable peacefully.<\/li>\n<li>Participate peacefully in civic activities.<\/li><\/ol>\n<\/div>\n<\/div>\n<\/div>\n<\/article>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer from options A–C.<\/p>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Which oath declares loyalty to Nigeria and its Constitution?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Oath of allegiance<\/li><li><b>B.<\/b>Oath of office<\/li><li><b>C.<\/b>Election oath<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>What is the main purpose of security arrangements before inauguration?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>To delay the ceremony<\/li><li><b>B.<\/b>To protect the leader and participants<\/li><li><b>C.<\/b>To prevent invited guests from attending<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>What is inauguration?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>A political campaign<\/li><li><b>B.<\/b>A voter registration exercise<\/li><li><b>C.<\/b>A formal ceremony marking the beginning of a leader's term<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Which of these is a duty of an elected leader after inauguration?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Use public funds responsibly<\/li><li><b>B.<\/b>Serve only relatives<\/li><li><b>C.<\/b>Ignore the Constitution<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Who normally administers the oath to a Governor in Nigeria?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>The Speaker of the House<\/li><li><b>B.<\/b>The state's Chief Judge or another legally authorised judicial officer<\/li><li><b>C.<\/b>The party chairman<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>What is an inaugural address?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>A list of election results<\/li><li><b>B.<\/b>A campaign poster<\/li><li><b>C.<\/b>A speech explaining the new administration's plans<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Which activity takes place during an inauguration ceremony?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Administration of the required oath<\/li><li><b>B.<\/b>Registration of voters<\/li><li><b>C.<\/b>Conduct of party primaries<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>Which of these is an important benefit of inauguration?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Encouraging political violence<\/li><li><b>B.<\/b>Promoting peaceful transfer of power<\/li><li><b>C.<\/b>Preventing citizens from holding leaders accountable<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>What does the oath of office require a leader to do?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Obey only party leaders<\/li><li><b>B.<\/b>Serve only wealthy citizens<\/li><li><b>C.<\/b>Perform official duties faithfully and uphold the Constitution<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Which of these is a civic duty of citizens?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Holding leaders accountable peacefully<\/li><li><b>B.<\/b>Destroying public property<\/li><li><b>C.<\/b>Disobeying lawful instructions<\/li><\/ul><\/div>\n<\/section>\n<section>\n<h2>Answer Key<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>A<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (8)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|1|9":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/>\n<title>History – Primary 6: Civic Rules in Nigeria (9)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n  .topic-line{\n    margin:10px 0 0;\n    font-size:19px;\n    font-style:italic;\n    color:#dfe6f4;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Major part cards */\n  .card{\n    margin-top:32px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:14px 22px 12px;\n    background:var(--accent);\n    color:#fff;\n  }\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:#fff;\n    margin:0;\n  }\n  .c-body{padding:8px 22px 10px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:22px 0 10px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:14px 18px;\n    margin:0 0 14px;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n\n  .note{\n    background:var(--gold-tint);\n    border-left:5px solid var(--crimson);\n    padding:10px 16px;\n    margin:4px 0 14px;\n  }\n  .banner{\n    background:var(--navy);\n    color:#fff;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 20px;\n    margin:6px 0 14px;\n  }\n  .banner p{margin:0}\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n\n  /* Step flow */\n  ol.steps{list-style:none;counter-reset:s;margin:4px 0 14px;padding:0}\n  ol.steps li{\n    counter-increment:s;\n    position:relative;\n    padding:4px 0 16px 54px;\n  }\n  ol.steps li::before{\n    content:counter(s);\n    position:absolute;\n    left:0;\n    top:0;\n    width:38px;\n    height:38px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    border:3px solid var(--gold);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:16px;\n    line-height:32px;\n    text-align:center;\n    z-index:1;\n  }\n  ol.steps li::after{\n    content:\"\";\n    position:absolute;\n    left:18px;\n    top:38px;\n    bottom:0;\n    width:3px;\n    background:var(--line);\n  }\n  ol.steps li:last-child{padding-bottom:4px}\n  ol.steps li:last-child::after{display:none}\n\n  /* Date timeline */\n  .dates{\n    list-style:none;\n    margin:0 0 14px;\n    padding:0;\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    gap:12px;\n  }\n  .dates li{\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-top:4px solid var(--gold);\n    border-radius:4px;\n    padding:10px 14px;\n    line-height:1.4;\n  }\n  .dates .when{\n    display:block;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:16px;\n    color:var(--navy);\n  }\n  .dates .who{font-size:16px}\n\n  /* Tiles */\n  .duo{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:14px;\n    margin:4px 0 14px;\n  }\n  .trio{\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    gap:12px;\n    margin:4px 0 14px;\n  }\n  .tile{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-top:4px solid var(--navy);\n    border-radius:4px;\n    padding:10px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:16px;\n    color:var(--navy);\n  }\n  .tile.t2{border-top-color:var(--crimson);color:var(--crimson)}\n  .tile.t3{border-top-color:var(--gold)}\n  .tile.big{\n    display:flex;\n    align-items:center;\n    gap:12px;\n    font-size:18px;\n  }\n  .tile.big .n{\n    flex:0 0 34px;\n    height:34px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    text-align:center;\n    line-height:34px;\n    font-size:16px;\n  }\n  .tile.big.t2 .n{background:var(--crimson)}\n\n  /* Panels */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 16px 8px;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    margin:12px 0 6px;\n    padding:4px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel.good{border-top:4px solid var(--navy);--accent:var(--navy)}\n  .panel.good h3{background:var(--navy)}\n  .panel.hard{border-top:4px solid var(--crimson);--accent:var(--crimson)}\n  .panel.hard h3{background:var(--crimson)}\n  .panel.gold{border-top:4px solid var(--gold);--accent:var(--gold)}\n  .panel.gold h3{background:var(--gold)}\n  .panel ol.points li{padding-left:40px}\n  .panel ol.points li::before{width:26px;height:26px;line-height:26px;font-size:13px}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    color:var(--navy);\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin-bottom:12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 24px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .two-col,.duo,.trio,.dates{grid-template-columns:1fr}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.define,.note,.banner,.tile,.dates li,\n    .panel h3,.instruction,.ans,ol.points li::before,ol.steps li::before,\n    .tile.big .n{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub{break-after:avoid;page-break-after:avoid}\n    .c-head{break-after:avoid;page-break-after:avoid}\n    .panel,.banner,.tile,.dates li,.define,.note{break-inside:avoid;page-break-inside:avoid}\n    ol.steps li{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (9)<\/h1>\n<p class=\"topic-line\">Inauguration of Elected Leaders<\/p>\n<\/header>\n<main>\n<!-- PRESIDENT -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Inauguration of the President of Nigeria<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">Meaning of Presidential Inauguration<\/h3>\n<div class=\"define\">\n<p><span class=\"term\">Presidential inauguration<\/span> is the formal ceremony in which the elected President takes the required oath or oaths and officially begins a term of office.<\/p>\n<\/div>\n<p class=\"note\">The President is the head of the executive arm of the Federal Government.<\/p>\n<h3 class=\"sub\">Date of Presidential Inauguration<\/h3>\n<p>During Nigeria's Fourth Republic, presidential inaugurations have traditionally taken place on 29 May.<\/p>\n<p><strong>Examples:<\/strong><\/p>\n<ul class=\"dates\">\n<li><span class=\"when\">29 May 1999<\/span><span class=\"who\">Olusegun Obasanjo.<\/span><\/li>\n<li><span class=\"when\">29 May 2015<\/span><span class=\"who\">Muhammadu Buhari.<\/span><\/li>\n<li><span class=\"when\">29 May 2023<\/span><span class=\"who\">Bola Ahmed Tinubu.<\/span><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<!-- GOVERNORS -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Inauguration of State Governors<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">Meaning of Governorship Inauguration<\/h3>\n<div class=\"define\">\n<p><span class=\"term\">Governorship inauguration<\/span> is the formal ceremony in which a newly elected Governor takes the required oath or oaths and begins a term of office.<\/p>\n<\/div>\n<p class=\"note\">A Governor is the chief executive of a state.<\/p>\n<h3 class=\"sub\">Duties of a Governor After Inauguration<\/h3>\n<ol class=\"points\">\n<li>Protect lives and property.<\/li>\n<li>Promote education, healthcare and other public services.<\/li>\n<li>Maintain peace and support security within the law.<\/li>\n<li>Use state resources responsibly.<\/li>\n<li>Obey the Constitution and respect citizens' rights.<\/li>\n<li>Work with the State House of Assembly.<\/li>\n<\/ol>\n<\/div>\n<\/article>\n<!-- ASSEMBLIES -->\n<article class=\"card gold\">\n<div class=\"c-head\"><h2>Inauguration of Members of the National and State Assemblies<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">Meaning of Legislative Inauguration<\/h3>\n<div class=\"define\">\n<p><span class=\"term\">Legislative inauguration<\/span> is the formal beginning of the work of an elected legislative body or its members according to the Constitution and relevant laws.<\/p>\n<\/div>\n<h3 class=\"sub\">The National Assembly<\/h3>\n<p>Nigeria's National Assembly has two chambers:<\/p>\n<div class=\"duo\">\n<div class=\"tile big\"><span class=\"n\">1<\/span>Senate<\/div>\n<div class=\"tile big t2\"><span class=\"n\">2<\/span>House of Representatives<\/div>\n<\/div>\n<p>Members are elected by the people. They make laws, represent their constituents and monitor government activities.<\/p>\n<p class=\"note\">Each state also has a State House of Assembly, whose elected members make laws on matters within the state's legislative powers.<\/p>\n<h3 class=\"sub\">Activities at the Beginning of a Legislative Term<\/h3>\n<ol class=\"steps\">\n<li>Verification of members' credentials.<\/li>\n<li>Taking the required oaths.<\/li>\n<li>Election of presiding officers, where required.<\/li>\n<li>Beginning of legislative duties.<\/li>\n<\/ol>\n<h3 class=\"sub\">Duties of Legislators<\/h3>\n<ol class=\"points\">\n<li>Make laws.<\/li>\n<li>Represent the interests of their constituents.<\/li>\n<li>Debate public issues.<\/li>\n<li>Approve budgets where constitutionally required.<\/li>\n<li>Monitor government activities.<\/li>\n<\/ol>\n<\/div>\n<\/article>\n<!-- LOCAL GOVERNMENT -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Inauguration of Local Government Leaders<\/h2><\/div>\n<div class=\"c-body\">\n<h3 class=\"sub\">Meaning of Local Government Inauguration<\/h3>\n<div class=\"define\">\n<p><span class=\"term\">Local government inauguration<\/span> is the formal process through which newly elected local government leaders begin their official duties according to applicable laws.<\/p>\n<\/div>\n<p class=\"note\">Local government brings government closer to people at the grassroots.<\/p>\n<h3 class=\"sub\">Elected Local Government Leaders<\/h3>\n<div class=\"trio\">\n<div class=\"tile big\"><span class=\"n\">1<\/span>Local Government Chairman.<\/div>\n<div class=\"tile big t2\"><span class=\"n\">2<\/span>Vice-Chairman.<\/div>\n<div class=\"tile big\"><span class=\"n\">3<\/span>Councillors representing wards.<\/div>\n<\/div>\n<h3 class=\"sub\">Ceremony<\/h3>\n<p>Verification of relevant documents is part of the ceremony.<\/p>\n<h3 class=\"sub\">Duties of Local Government Leaders<\/h3>\n<ol class=\"points\">\n<li>Improve local roads where responsible.<\/li>\n<li>Promote sanitation and environmental cleanliness.<\/li>\n<li>Support community development and local markets.<\/li>\n<li>Support primary healthcare and other services assigned by law.<\/li>\n<li>Use public funds responsibly.<\/li>\n<li>Respect the law and citizens' rights.<\/li>\n<\/ol>\n<\/div>\n<\/article>\n<!-- RESPONSIBILITIES -->\n<article class=\"card crimson\">\n<div class=\"c-head\"><h2>Problems and Responsible Leadership After Inauguration<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"banner\" style=\"margin-top:14px\">\n<p>After inauguration, elected leaders are expected to perform their duties according to the Constitution and the law.<\/p>\n<\/div>\n<div class=\"two-col\">\n<div class=\"panel hard\">\n<h3>Problems That May Arise After Inauguration<\/h3>\n<ol class=\"points\">\n<li>Failure to fulfil campaign promises.<\/li>\n<li>Misuse of public funds.<\/li>\n<li>Poor delivery of public services.<\/li>\n<li>Insecurity and social unrest.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel gold\">\n<h3>Ways to Encourage Responsible Leadership<\/h3>\n<ol class=\"points\">\n<li>Leaders should obey the Constitution.<\/li>\n<li>Public funds should be properly monitored and audited.<\/li>\n<li>Citizens should report corruption through lawful channels.<\/li>\n<li>Leaders should communicate clearly with citizens.<\/li>\n<li>Disputes should be settled peacefully and lawfully.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>\n<\/article>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer from options A–D.<\/p>\n\n\n\n\n\n\n\n\n\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>The chief executive of a state is the <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Senator<\/li><li><b>B.<\/b>Chief Judge<\/li><li><b>C.<\/b>Governor<\/li><li><b>D.<\/b>Councillor<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Presidential inaugurations in Nigeria's Fourth Republic have traditionally taken place on <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1 January<\/li><li><b>B.<\/b>1 October<\/li><li><b>C.<\/b>29 May<\/li><li><b>D.<\/b>25 December<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>One duty of a legislator is to <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>conduct school examinations<\/li><li><b>B.<\/b>make laws<\/li><li><b>C.<\/b>control every private business<\/li><li><b>D.<\/b>manage every local market<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>The formal ceremony in which an elected President begins a term of office is called <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>campaigning<\/li><li><b>B.<\/b>nomination<\/li><li><b>C.<\/b>registration<\/li><li><b>D.<\/b>presidential inauguration<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Local government brings government closer to the <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>grassroots<\/li><li><b>B.<\/b>foreign embassies<\/li><li><b>C.<\/b>international community<\/li><li><b>D.<\/b>United Nations<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>One duty of a local government leader is to promote <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>election malpractice<\/li><li><b>B.<\/b>political violence<\/li><li><b>C.<\/b>community development<\/li><li><b>D.<\/b>unlawful activities<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Members of the National Assembly are chosen through <span class=\"blank\"> <\/span>.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>inheritance<\/li><li><b>B.<\/b>elections<\/li><li><b>C.<\/b>military appointment<\/li><li><b>D.<\/b>traditional selection only<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>Which of these is a duty of a Governor after inauguration?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Ignoring the Constitution<\/li><li><b>B.<\/b>Protecting only political supporters<\/li><li><b>C.<\/b>Protecting lives and property<\/li><li><b>D.<\/b>Refusing to work with lawful institutions<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>Which two chambers make up Nigeria's National Assembly?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Senate and Supreme Court<\/li><li><b>B.<\/b>House of Representatives and State House of Assembly<\/li><li><b>C.<\/b>Senate and House of Representatives<\/li><li><b>D.<\/b>Senate and Federal Executive Council<\/li><\/ul><\/div><div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Which of these is a way to encourage responsible leadership?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Spreading unverified information<\/li><li><b>B.<\/b>Monitoring and auditing public funds<\/li><li><b>C.<\/b>Destroying public property<\/li><li><b>D.<\/b>Settling disputes through violence<\/li><\/ul><\/div><\/section>\n<section>\n<h2>Answer Key<\/h2>\n<div class=\"answers\">\n<div class=\"ans\"><span>1<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>D<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>B<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (9)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|2|1":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>History – Primary 6: Military Rule in Nigeria (1)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Section cards */\n  .card{\n    margin-top:32px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:14px 22px 12px;\n    background:var(--accent);\n  }\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:#fff;\n    margin:0;\n  }\n  .c-body{padding:8px 22px 10px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:22px 0 10px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n  .lead-in{font-weight:700;color:var(--navy);margin:14px 0 8px}\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:14px 18px;\n    margin:14px 0;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n  .define.alt{border-left-color:var(--crimson)}\n  .define.alt .term{color:var(--crimson)}\n\n  .note{\n    background:var(--gold-tint);\n    border-left:5px solid var(--crimson);\n    padding:10px 16px;\n    margin:4px 0 14px;\n  }\n  .banner{\n    background:var(--navy);\n    color:#fff;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 20px;\n    margin:6px 0 14px;\n  }\n  .banner p{margin:0}\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n  ol.points li strong{color:var(--navy)}\n\n  /* Leaders grid */\n  ol.leaders{\n    list-style:none;\n    counter-reset:l;\n    margin:0 0 14px;\n    padding:0;\n    display:grid;\n    grid-template-columns:repeat(2,1fr);\n    gap:10px 14px;\n  }\n  ol.leaders li{\n    counter-increment:l;\n    display:flex;\n    align-items:center;\n    gap:12px;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:8px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    font-weight:700;\n    color:var(--navy);\n  }\n  ol.leaders li::before{\n    content:counter(l);\n    flex:0 0 28px;\n    height:28px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    text-align:center;\n    line-height:28px;\n    font-size:14px;\n  }\n  ol.leaders li:nth-child(even){border-left-color:var(--crimson)}\n  ol.leaders li:nth-child(even)::before{background:var(--crimson)}\n\n  /* Panels */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 16px 10px;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    margin:12px 0 8px;\n    padding:4px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel p{margin:0}\n  .panel.good{border-top:4px solid var(--navy);--accent:var(--navy)}\n  .panel.good h3{background:var(--navy)}\n  .panel.hard{border-top:4px solid var(--crimson);--accent:var(--crimson)}\n  .panel.hard h3{background:var(--crimson)}\n  .panel ol.points li{padding-left:40px}\n  .panel ol.points li::before{width:26px;height:26px;line-height:26px;font-size:13px}\n\n  /* Date highlight */\n  .dateline{\n    display:flex;\n    align-items:center;\n    gap:16px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:6px 0 14px;\n  }\n  .dateline .day{\n    flex:0 0 auto;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:6px 14px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    line-height:1.1;\n  }\n  .dateline .day b{display:block;font-size:26px;color:#e7cf8e}\n  .dateline .day span{font-size:13px;letter-spacing:.06em}\n  .dateline .text p{margin:0 0 8px}\n  .dateline .text p:last-child{margin-bottom:0}\n\n  /* Return to civilian rule timeline */\n  ul.timeline{list-style:none;margin:6px 0 14px;padding:0}\n  ul.timeline li{\n    position:relative;\n    padding:0 0 18px 150px;\n    min-height:44px;\n  }\n  ul.timeline li .when{\n    position:absolute;\n    left:0;\n    top:0;\n    width:136px;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:4px;\n    padding:5px 6px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:14px;\n    line-height:1.3;\n  }\n  ul.timeline li:nth-child(2) .when{background:var(--crimson)}\n  ul.timeline li::after{\n    content:\"\";\n    position:absolute;\n    left:67px;\n    top:46px;\n    bottom:2px;\n    width:3px;\n    background:var(--line);\n  }\n  ul.timeline li:last-child{padding-bottom:4px}\n  ul.timeline li:last-child::after{display:none}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    color:var(--navy);\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin-bottom:12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 24px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .two-col,ol.leaders{grid-template-columns:1fr}\n    .dateline{flex-direction:column;align-items:flex-start;gap:8px}\n    ul.timeline li{padding-left:0;padding-top:34px}\n    ul.timeline li .when{width:auto;display:inline-block;padding:4px 14px}\n    ul.timeline li::after{display:none}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,
