<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faith Intelligence School – Classroom</title>
<meta name="description" content="Faith Intelligence School, Oghara, Delta State, Nigeria.">
<meta name="theme-color" content="#0d5a3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIS Classroom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --green:#0d5a3b;
  --green-deep:#083d28;
  --chalk:#f7f5ee;
  --paper:#fffef9;
  --ink:#1c2745;
  --gold:#e8b230;
  --margin:#c8453f;
  --rule:#cfdcec;
  --muted:#5b6478;
  --display:Georgia,"Times New Roman",serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--chalk);color:var(--ink);min-height:100vh;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
.top{background:var(--green);color:#fff;border-bottom:6px solid var(--gold)}
.top-in{max-width:1080px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:14px}
.crest{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--green-deep);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;flex:none}
.school{font-family:var(--display);font-size:clamp(17px,3.2vw,24px);font-weight:700;letter-spacing:.2px;line-height:1.15}
.school .brand{display:block;font-family:var(--body);font-size:13px;font-weight:600;opacity:.9;letter-spacing:.2px;margin-bottom:2px}
.school small{display:block;font-family:var(--body);font-weight:400;font-size:13px;opacity:.85;margin-top:2px}

main{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;margin-bottom:22px;color:var(--muted)}
.crumbs button{color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.crumbs span.cur{color:var(--ink);font-weight:600}
.crumbs i{font-style:normal;opacity:.5}

h1{font-family:var(--display);font-size:clamp(26px,5vw,40px);line-height:1.1;margin-bottom:6px}
.lead{color:var(--muted);max-width:60ch;margin-bottom:26px}

/* ---------- grids ---------- */
.grid{display:grid;gap:16px}
.g-class{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g-term{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g-subj{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

.card{position:relative;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:18px 16px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.card:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.card:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pair{display:inline-flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap}
.pair .tld{font-size:.8em;line-height:1}
.card .big{white-space:nowrap;font-family:var(--display);font-size:46px;font-weight:700;line-height:1;color:var(--green)}
.card .name{font-weight:700;font-size:17px;margin-top:12px}
.card .sub{font-size:13px;color:var(--muted)}
.card:disabled{border-color:#b9bcc6;box-shadow:none;background:#efede6;cursor:not-allowed;color:#8a8f9d}
.card:disabled .big{color:#a4a9b6}
.card.on{background:var(--green);border-color:var(--green-deep);box-shadow:4px 4px 0 var(--gold);color:#fff}
.card.on:hover{box-shadow:6px 6px 0 var(--gold)}
.card.on .big{color:var(--gold)}
.card.on .sub{color:#d6e9df}

.term-card{min-height:190px}
.term-card .big{font-size:64px}
.subj .tile{width:52px;height:52px;border-radius:14px;background:#E3EFE7;color:#1B5E3F;display:flex;align-items:center;justify-content:center}
.subj{min-height:120px}
.subj .name{font-size:16px;margin-top:10px}

/* ---------- topics ---------- */
.topics{list-style:none;display:grid;gap:10px;max-width:760px}
.topics button{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:14px 16px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.topics button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.wk{flex:none;min-width:68px;text-align:center;background:var(--gold);color:var(--green-deep);font-weight:700;font-size:13px;border-radius:4px;padding:5px 8px}
.t-title{font-weight:600;font-size:16.5px}
.rev-row{display:flex;gap:14px;align-items:center;padding:12px 16px;border:2px dashed #9aa3b5;border-radius:6px;color:var(--muted);background:transparent;cursor:default}
.rev-row .wk{background:#e4e1d6;color:var(--muted)}
.rev-row .t-title{font-weight:600;font-size:16.5px;font-style:italic}
.exam-item{margin-top:14px}
.topics button.exam-row{background:var(--green);color:#fff;border-color:var(--green-deep);box-shadow:3px 3px 0 var(--gold);display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px 18px}
.topics button.exam-row:hover{box-shadow:5px 5px 0 var(--gold)}
.exam-t{font-family:var(--display);font-size:22px;font-weight:700}
.exam-s{font-size:13.5px;color:#d6e9df}
.t-ready{margin-left:auto;font-size:12.5px;color:var(--green);font-weight:600;white-space:nowrap}

/* ---------- note ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.btn{background:var(--green);color:#fff;font-weight:600;padding:10px 18px;border-radius:6px;border:2px solid var(--green-deep)}
.btn.alt{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.btn:hover{filter:brightness(1.08)}
.backbtn{margin:-6px 0 20px}
.bar.acts{justify-content:space-between}
.bar.acts .btn{min-width:120px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:5px;margin-bottom:14px;max-width:560px}
.seg[hidden]{display:none}
.seg button{padding:10px 8px;border-radius:5px;font-weight:700;font-size:15px;color:var(--muted);text-align:center;min-width:0}
.seg button small{display:block;font-weight:400;font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--green);color:#fff}
.seg button.on small{color:#d6e9df}

/* ---------- examination paper ---------- */
.ex-ctl{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.ex-ctl .seg{margin:0;flex:1 1 280px;max-width:420px}
.ex-ctl .seg.three{grid-template-columns:repeat(3,1fr)}
.paper{background:#fff;color:#111;border:2px solid var(--ink);border-radius:4px;padding:34px 40px 40px;font-family:Georgia,"Times New Roman",serif;box-shadow:6px 6px 0 rgba(28,39,69,.25)}
.p-head{text-align:center;border-bottom:3px double #111;padding-bottom:12px;margin-bottom:14px}
.p-school{font-size:clamp(20px,4.4vw,30px);font-weight:700;letter-spacing:.5px}
.p-addr{font-size:15px;margin-top:2px}
.p-title{font-size:17px;font-weight:700;margin-top:10px;letter-spacing:.4px}
.p-sub{font-size:14.5px;margin-top:2px}
.p-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;font-size:15px;margin-bottom:18px}
.p-meta .full{grid-column:1/-1}
.blank{display:inline-block;border-bottom:1.5px solid #111;min-width:210px;height:1em;vertical-align:baseline}
.p-sec{margin-top:16px}
.p-sec h2{font-size:17px;margin:0 0 4px;padding:5px 10px;background:#111;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;letter-spacing:.3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inst{font-size:14px;font-style:italic;margin:6px 0 12px}
.mcq{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.mcq li{break-inside:avoid;page-break-inside:avoid}
.q-t{display:flex;gap:8px;align-items:baseline;font-size:15.5px;line-height:1.4}
.q-t .n{font-weight:700;min-width:26px}
.q-t .qs{flex:1}
.q-t .m{font-size:12.5px;white-space:nowrap}
.abox{display:inline-block;width:30px;height:24px;border:1.5px solid #111;align-self:center;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:2px 22px;margin:3px 0 0 34px;font-size:15px}
.tq{margin-top:16px;break-inside:avoid;page-break-inside:avoid}
.tq-h{display:flex;gap:8px;align-items:baseline;font-size:15.5px;font-weight:700;border-bottom:1px solid #111;padding-bottom:3px;margin-bottom:8px}
.tq-h .m{margin-left:auto;font-size:13px;white-space:nowrap}
.tq-h .n{min-width:26px}
.fill{list-style:none;padding:0;margin:0;display:grid;gap:11px;counter-reset:f}
.fill li{counter-increment:f;font-size:15.5px;line-height:1.7;display:flex;gap:8px}
.fill li::before{content:"(" counter(f,lower-alpha) ")";font-weight:700;min-width:30px}
.fill .m{font-size:12px;white-space:nowrap;margin-left:6px}
.dash{display:inline-block;border-bottom:1.5px solid #111;min-width:120px;height:1em;vertical-align:baseline}
.part{margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
.part .pt{display:flex;gap:8px;font-size:15.5px;line-height:1.4}
.part .pl{font-weight:700;min-width:30px}
.part .m{margin-left:auto;font-size:12.5px;white-space:nowrap;padding-left:8px}
.fill4{list-style:lower-roman;margin:0;padding-left:30px;display:grid;gap:9px;flex:1}
.fill4 li{font-size:15.5px;line-height:1.6}
.m2{font-size:12px;white-space:nowrap;margin-left:6px}
.defl li{margin-bottom:4px}
.lines{margin:4px 0 0 38px;height:calc(var(--n)*27px);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 26px,#777 26px,#777 27px)}
.key{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 12px;font-size:15px;margin:6px 0 14px}
.key span{border:1px solid #111;padding:4px 8px}
.key b{margin-right:6px}
.ms-q{font-size:15px;line-height:1.5;margin:6px 0 10px;break-inside:avoid}
.ms-q .ma{margin-left:34px;font-size:14.5px}
.ms-q em{font-size:12.5px}
@media (max-width:640px){
  .paper{padding:20px 16px 26px}
  .p-meta{grid-template-columns:1fr}
  .blank{min-width:150px}
  .opts{margin-left:0}
  .key{grid-template-columns:repeat(3,1fr)}
}
@media print{
  @page{margin:12mm}
  .paper{border:0;box-shadow:none;padding:0}
  .sec-b{break-before:page;page-break-before:always}
  .ms-break{break-before:page;page-break-before:always}
}
/* ---------- home / search / edit kit ---------- */
.home{display:grid;gap:14px}
.hcard{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:14px;box-shadow:3px 3px 0 var(--ink)}
.hcard h2{font-family:var(--display);font-size:17px;line-height:1.25;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hcard.mu{opacity:.72}
.tag{font-family:var(--body);font-size:11.5px;font-weight:600;background:#e4e1d6;color:var(--muted);border-radius:999px;padding:2px 9px}
.sbar{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:8px;padding:9px 10px;background:#fff}
.sbar svg{color:var(--green);flex:none}
.sbar input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;background:transparent;color:var(--ink)}
.res{margin-top:8px;display:grid;gap:6px}
.res button{text-align:left;border:1.5px solid var(--ink);border-radius:7px;padding:8px 10px;background:#fff;display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.3}
.res button small{margin-left:auto;color:var(--green);font-weight:600;white-space:nowrap;font-size:12px}
.res .more{font-size:13px;color:var(--muted);padding:2px 2px 0}
.lb{font-size:13px;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--ink);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;background:#fff}
.chips button:hover,.chips button:focus-visible{background:var(--green);color:#fff}
.linkbtn{justify-self:center;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px}
.btn svg.ico{vertical-align:-3px;margin-right:6px}
.btn.y{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.edrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.edmsg{font-size:13px;background:#fff4d6;border:1px solid var(--gold);border-radius:6px;padding:6px 10px;margin-bottom:10px}
.notice{border:2px solid var(--gold);background:#fff4d6;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:grid;gap:6px;font-size:14px}
.notice[hidden],.edmsg[hidden]{display:none}
.notice span{color:var(--muted)}
.nbtns{display:flex;gap:8px;flex-wrap:wrap}
.vseg{margin-bottom:12px}
.sheet.editing{outline:3px dashed var(--green);outline-offset:4px}
.empty{border:2px dashed #9aa3b5;border-radius:8px;padding:18px;color:var(--muted);background:transparent}
.grid.g-pick{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card.plain{min-height:96px}
.card.plain .name{margin-top:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.figs{display:grid;gap:14px}
.fig{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:10px}
.fig img,.fig svg{max-width:100%;height:auto}
.fig b{display:block;margin-bottom:6px}
.editlist{display:grid;gap:8px;margin:10px 0 16px}
.editlist li{list-style:none}
.editlist button{width:100%;text-align:left;border:1.5px solid var(--ink);border-radius:7px;padding:9px 11px;background:#fff;font-size:14px}
.acts2{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* ---------- selection box ---------- */
body.pk-open{overflow:hidden}
.pk-dim{position:fixed;inset:0;background:rgba(28,39,69,.55);z-index:60}
.pk{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:90vh;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 14px 14px;z-index:61;display:flex;flex-direction:column;outline:0;animation:pkup .18s ease-out}
@keyframes pkup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.pk-grab{width:40px;height:4px;border-radius:4px;background:#9aa3b5;margin:0 auto 8px;flex:none}
.pk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex:none}
.pk-top b{font-family:var(--display);font-size:19px}
.pk-x{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;font-size:22px;line-height:1;background:#fff}
.pk-sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;flex:none}
.pk-sum button{background:#e3efe7;color:var(--green);border:1.5px solid var(--green);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.pk-steps{display:flex;gap:5px;margin-bottom:10px;flex:none}
.pk-steps button{flex:1;min-width:0;border:1.5px solid #cfd5e2;border-radius:7px;padding:6px 2px;text-align:center;font-size:12px;color:#7a8195;line-height:1.2;background:#fff}
.pk-steps .ok{border-color:var(--green);color:var(--green)}
.pk-steps .cur{border-color:var(--green);background:#e3efe7;color:var(--green);font-weight:700}
.pk-steps button:disabled{opacity:.55;cursor:default}
.pk-body{flex:1;overflow-y:auto;min-height:120px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px}
.pk-q{font-size:14px;font-weight:600;margin-bottom:8px}
.pk-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk-opts.three{grid-template-columns:repeat(3,1fr)}
.pk-opts button{border:2px solid var(--ink);border-radius:9px;padding:13px 8px;text-align:center;font-weight:700;font-size:15px;background:#fff;display:flex;flex-direction:column;gap:2px;align-items:center}
.pk-opts button small{font-weight:400;font-size:12px;color:var(--muted)}
.pk-opts .sel,.pk-list .sel,.pk-open2 .sel{background:var(--green);color:#fff;border-color:var(--green-deep)}
.pk-opts .sel small,.pk-list .sel small{color:#d6e9df}
.pk-list{display:grid;gap:6px}
.pk-list button,.pk-rv{display:flex;gap:8px;align-items:center;border:1.5px solid var(--ink);border-radius:8px;padding:9px 10px;font-size:14px;background:#fff;text-align:left;line-height:1.3}
.pk-list button small{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--green);white-space:nowrap}
.pk-rv{border-style:dashed;border-color:#9aa3b5;color:var(--muted);background:transparent;font-style:italic}
.pk-wk{background:var(--gold);color:var(--green-deep);border-radius:4px;padding:2px 7px;font-size:12px;font-weight:700;flex:none;font-style:normal}
.pk-rv .pk-wk{background:#e4e1d6;color:var(--muted)}
.pk-list .sel .pk-wk{background:var(--gold)}
.pk-open2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pk-open2 button{border:2px solid var(--ink);border-radius:9px;padding:10px;font-weight:700;font-size:14px;background:#fff}
.pk-empty{border:2px dashed #9aa3b5;border-radius:8px;padding:16px;color:var(--muted)}
.pk-done{flex:none;margin-top:10px;border:2px solid var(--green-deep);border-radius:9px;padding:13px;text-align:center;font-weight:700;font-size:16px;color:#fff;background:var(--green);box-shadow:3px 3px 0 var(--gold)}
.pk-done:disabled{border-color:#cfd5e2;color:#9aa3b5;background:#f1efe8;box-shadow:none}
@media print{.pk,.pk-dim{display:none!important}}
@media (prefers-reduced-motion:reduce){.pk{animation:none}}
.hint{font-size:13.5px;color:var(--muted);margin-bottom:14px}

.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 rgba(28,39,69,.25);padding:34px 38px 40px 74px;position:relative;
  background-image:linear-gradient(to bottom,transparent 31px,var(--rule) 32px);background-size:100% 32px;background-position:0 12px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:54px;width:2px;background:var(--margin);opacity:.75}
.sheet-head{text-align:center;margin-bottom:18px;background:var(--paper);padding:6px 0 10px;margin-left:-8px;margin-right:-8px}
.sheet-head .sn{font-family:var(--display);font-size:clamp(18px,3.4vw,26px);font-weight:700;color:var(--green)}
.sheet-head .st{font-size:13px;color:var(--muted)}
.sheet-head .ln{display:inline-block;margin-top:8px;font-family:var(--display);font-size:20px;font-weight:700;border-bottom:3px double var(--ink);padding:0 14px}
.meta{width:100%;border-collapse:collapse;background:var(--paper);margin-bottom:22px}
.meta td{border:1.5px solid var(--ink);padding:7px 10px;font-size:14.5px;vertical-align:top}
.meta td.k{width:24%;font-weight:700;background:#eef4ef}
.sec{margin-top:22px}
.sec h3{font-family:var(--display);font-size:19px;color:var(--green);display:inline-block;background:var(--paper);padding:0 8px 0 0;margin-bottom:4px}
.sec p,.sec li{font-size:16px;line-height:32px}
.sec ul,.sec ol{padding-left:22px}
.sec .ex{background:rgba(13,90,59,.07);border-left:4px solid var(--green);padding:2px 12px;margin:6px 0;line-height:1.6}
.sec .ex p,.sec .ex li{line-height:1.6;font-size:15.5px}
.sec table.t{border-collapse:collapse;background:var(--paper);margin:8px 0}
.sec table.t th,.sec table.t td{border:1.5px solid var(--ink);padding:6px 12px;font-size:15px;text-align:left}
.sec table.t th{background:#eef4ef}
.sign{display:flex;justify-content:space-between;gap:20px;margin-top:34px;font-size:14px;background:var(--paper);padding-top:8px}

 h2{break-after:avoid;page-break-after:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n\n  table.levels{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:16.5px}\n  table.levels th,table.levels td{border:1px solid var(--line);padding:10px 14px;text-align:left;vertical-align:top}\n  table.levels th{background:var(--navy);color:#fff;font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif}\n  table.levels td:first-child{font-weight:700;color:var(--navy);width:34%;background:var(--tint)}\n  @media print{table.levels th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (1)<\/h1>\n<\/header>\n<main>\n<section>\n<h2>The Meaning of Civil Rule<\/h2>\n<div class=\"define\">\n<p><span class=\"term\">Civil rule<\/span> is a system of government in which civilian leaders chosen by the people through elections govern a country. It is also called <strong>civilian rule<\/strong>.<\/p>\n<\/div>\n<p>Under civil rule, government operates according to the constitution and laws. Citizens participate in choosing their leaders through elections.<\/p>\n<\/section>\n<section>\n<h2>Levels of Government and Some Elected Leaders<\/h2>\n<table class=\"levels\">\n<thead><tr><th>Level<\/th><th>Examples of Leaders<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Federal<\/td><td>President, Senators, Members of House of Representatives<\/td><\/tr>\n<tr><td>State<\/td><td>Governor, Members of State House of Assembly<\/td><\/tr>\n<tr><td>Local Government<\/td><td>Chairman and Councillors<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>The President is the head of the federal government. The Governor is the head of a state government. The Chairman is the head of a local government.<\/p>\n<\/section>\n<section>\n<h2>Civil Rule and Elections<\/h2>\n<div class=\"define\">\n<p>An <span class=\"term\">election<\/span> is a process in which citizens choose people to represent or govern them through <span class=\"term\">voting<\/span>. Eligible citizens vote for candidates of their choice.<\/p>\n<\/div>\n<p>Citizens should vote peacefully, obey electoral laws and avoid selling their votes or using violence.<\/p>\n<\/section>\n<section>\n<h2>Importance of Elections<\/h2>\n<ol class=\"points\">\n<li>Allow citizens to choose leaders.<\/li>\n<li>Encourage participation in government.<\/li>\n<li>Allow unpopular leaders to be replaced peacefully.<\/li>\n<li>Make leaders accountable to the people.<\/li>\n<li>Promote democracy.<\/li>\n<\/ol>\n<\/section>\n<section>\n<h2>Civil Rule and the Constitution<\/h2>\n<div class=\"define\">\n<p>A <span class=\"term\">constitution<\/span> is the fundamental law containing the rules and principles by which a country is governed. It explains how government operates and states the rights and duties of citizens.<\/p>\n<p>In Nigeria, the Constitution is the supreme law of the land. No person or government is above it.<\/p>\n<\/div>\n<\/section>\n<section>\n<h2>Rule of Law<\/h2>\n<div class=\"define\">\n<p>The <span class=\"term\">rule of law<\/span> means that everyone, including government officials, is subject to the law.<\/p>\n<\/div>\n<p class=\"lead-in\">The rule of law:<\/p>\n<ol class=\"points\">\n<li>Promotes fairness.<\/li>\n<li>Protects citizens' rights.<\/li>\n<li>Prevents abuse of power.<\/li>\n<li>Makes leaders accountable.<\/li>\n<li>Maintains peace and order.<\/li>\n<\/ol>\n<\/section>\n<section>\n<h2>Features of Civil Rule<\/h2>\n<ol class=\"points\">\n<li>Election of leaders.<\/li>\n<li>Rule of law.<\/li>\n<li>Constitutional government.<\/li>\n<li>Protection of citizens' rights.<\/li>\n<li>Political participation.<\/li>\n<\/ol>\n<p>Civil rule also involves accountability, peaceful transfer of power and separation of powers among the Executive, Legislature and Judiciary.<\/p>\n<p>The Executive carries out the laws, the Legislature makes the laws, and the Judiciary explains the laws and settles disputes.<\/p>\n<\/section>\n<section>\n<h2>Civil Rule in Nigeria<\/h2>\n<div class=\"timeline\">\n<div class=\"stop\">\n<span class=\"date\">1 October 1960<\/span>\n<span class=\"what\">Nigeria became independent.<\/span>\n<\/div>\n<div class=\"stop\">\n<span class=\"date\">29 May 1999<\/span>\n<span class=\"what\">Nigeria returned to civilian democratic rule.<\/span>\n<\/div>\n<\/div>\n<p>The country later experienced periods of military rule.<\/p>\n<p>Civilian democratic rule has continued since 1999.<\/p>\n<\/section>\n<section>\n<h2>Importance of Civil Rule in Nigeria<\/h2>\n<ol class=\"points\">\n\n<li>Promotes democracy.<\/li>\n<li>Protects human rights.<\/li>\n\n<li>Promotes the rule of law.<\/li>\n<\/ol>\n<\/section>\n<section class=\"duties\">\n<h2>Duties of Citizens<\/h2>\n<ol class=\"points\">\n<li>Obey the laws.<\/li>\n<li>Respect other people's rights.<\/li>\n<li>Vote responsibly.<\/li>\n<li>Protect public property.<\/li>\n<li>Promote peace and unity.<\/li>\n<\/ol>\n<\/section>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer.<\/p>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>The arm of government responsible for making laws is the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Judiciary<\/li><li><b>B.<\/b>Legislature<\/li><li><b>C.<\/b>Executive<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Nigeria returned to civilian democratic rule in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1999<\/li><li><b>B.<\/b>1960<\/li><li><b>C.<\/b>1979<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>A responsible citizen should<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>sell votes<\/li><li><b>B.<\/b>cause electoral violence<\/li><li><b>C.<\/b>obey the law<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Civil rule means government by<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>traditional rulers<\/li><li><b>B.<\/b>elected civilians<\/li><li><b>C.<\/b>soldiers<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Everyone being subject to the law is called<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>political participation<\/li><li><b>B.<\/b>separation of powers<\/li><li><b>C.<\/b>rule of law<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>The head of a state government is the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Governor<\/li><li><b>B.<\/b>Senator<\/li><li><b>C.<\/b>President<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Civil rule allows citizens to<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>disregard constitutional laws<\/li><li><b>B.<\/b>choose leaders through elections<\/li><li><b>C.<\/b>change government through force<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>The supreme law guiding Nigeria is the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>government policy<\/li><li><b>B.<\/b>electoral law<\/li><li><b>C.<\/b>Constitution<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>Which is a feature of civil rule?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Election of leaders<\/li><li><b>B.<\/b>Military takeover<\/li><li><b>C.<\/b>Suspension of elections<\/li><\/ul>\n<\/div>\n<div class=\"q\">\n<div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Citizens choose their leaders mainly through<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>inheritance<\/li><li><b>B.<\/b>elections<\/li><li><b>C.<\/b>appointment<\/li><\/ul>\n<\/div>\n<\/section>\n<section>\n<h2>Objective Answers<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>B<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (1)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},

 1963. The country practised a parliamentary system of government.<\/p>\n<span class=\"system\">Parliamentary system<\/span>\n<ul class=\"people\">\n<li><span class=\"role\">Prime Minister<\/span><span>Abubakar Tafawa Balewa<\/span><\/li>\n<li><span class=\"role\">First President<\/span><span>Nnamdi Azikiwe<\/span><\/li>\n<li><span class=\"role\">Opposition Leader<\/span><span>Obafemi Awolowo<\/span><\/li>\n<li><span class=\"role\">Premier of Northern Region<\/span><span>Ahmadu Bello<\/span><\/li>\n<\/ul>\n<p>The government worked on education, agriculture and transport. Political disagreements, regional tensions and electoral disputes weakened the government.<\/p>\n<p class=\"end-note\"><strong>How it ended:<\/strong> A military coup on 15 January 1966 ended the First Republic.<\/p>\n<\/div>\n<\/article>\n<!-- SECOND REPUBLIC -->\n<article class=\"republic second\">\n<div class=\"r-head\">\n<h3>Second Republic<\/h3>\n<span class=\"r-years\">1979–1983<\/span>\n<\/div>\n<div class=\"r-body\">\n<p>Civilian rule returned in 1979, and Nigeria adopted a presidential system of government.<\/p>\n<span class=\"system\">Presidential system<\/span>\n<ul class=\"people\">\n<li><span class=\"role\">President<\/span><span>Shehu Shagari (1979–1983)<\/span><\/li>\n<\/ul>\n<p>The government focused on education, agriculture, housing and economic development. However, corruption, economic problems and political disputes affected the country.<\/p>\n<p class=\"end-note\"><strong>How it ended:<\/strong> A military coup on 31 December 1983 ended the Second Republic.<\/p>\n<\/div>\n<\/article>\n<!-- THIRD REPUBLIC -->\n\n<!-- FOURTH REPUBLIC -->\n\n<\/section><section><h2>Periods of Civil Rule in Nigeria (continued)<\/h2><article class=\"republic third\">\n<div class=\"r-head\">\n<h3>Third Republic<\/h3>\n<span class=\"r-years\">1993<\/span>\n<\/div>\n<div class=\"r-body\">\n<p>The Third Republic was an unsuccessful attempt to restore civilian rule. The 12 June 1993 presidential election, believed to have been won by M.K.O. Abiola, was annulled by General Ibrahim Babangida.<\/p>\n<p>An interim government led by Ernest Shonekan was later overthrown by General Sani Abacha on 17 November 1993, returning Nigeria to military rule.<\/p>\n<\/div>\n<\/article><article class=\"republic fourth\">\n<div class=\"r-head\">\n<h3>Fourth Republic<\/h3>\n<span class=\"r-years\">1999–Till Date<\/span>\n<\/div>\n<div class=\"r-body\">\n<p>Civilian democratic rule returned on 29 May 1999. Nigeria has operated a presidential system since then.<\/p>\n<span class=\"system\">Presidential system<\/span>\n<p class=\"lead-in\">Presidents of the Fourth Republic include:<\/p>\n<ol class=\"points\">\n<li>Olusegun Obasanjo <span class=\"yrs\">(1999–2007)<\/span><\/li>\n<li>Umaru Musa Yar’Adua <span class=\"yrs\">(2007–2010)<\/span><\/li>\n<li>Goodluck Jonathan <span class=\"yrs\">(2010–2015)<\/span><\/li>\n<li>Muhammadu Buhari <span class=\"yrs\">(2015–2023)<\/span><\/li>\n<li>Bola Ahmed Tinubu <span class=\"yrs\">(2023–present)<\/span><\/li>\n<\/ol>\n<p>The Fourth Republic has regular elections, a National Assembly that makes laws, and courts that interpret the law. It is Nigeria’s longest continuous period of civilian democratic rule since independence, although challenges such as corruption and insecurity remain.<\/p>\n<\/div>\n<\/article><\/section>\n\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Nigeria gained independence in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1963<\/li><li><b>B.<\/b>1960<\/li><li><b>C.<\/b>1979<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>The period 1960–1966 is known as the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Second Republic<\/li><li><b>B.<\/b>Fourth Republic<\/li><li><b>C.<\/b>First Republic<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>The Prime Minister of the First Republic was<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Tafawa Balewa<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Nigeria became a republic on<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1 October 1960<\/li><li><b>B.<\/b>29 May 1999<\/li><li><b>C.<\/b>1 October 1963<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>The First Republic ended in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1979<\/li><li><b>B.<\/b>1983<\/li><li><b>C.<\/b>1966<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>The Second Republic began in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1960<\/li><li><b>B.<\/b>1999<\/li><li><b>C.<\/b>1979<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>The President of the Second Republic was<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Nnamdi Azikiwe<\/li><li><b>C.<\/b>Ahmadu Bello<\/li><\/ul><\/div>\n\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>Nigeria’s longest continuous period of civilian democratic rule is the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>First Republic<\/li><li><b>B.<\/b>Second Republic<\/li><li><b>C.<\/b>Fourth Republic<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>The First Republic practised a<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Parliamentary system<\/li><li><b>B.<\/b>Presidential system<\/li><li><b>C.<\/b>Military system<\/li><\/ul><\/div>\n\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>The Fourth Republic began on<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1 October 1960<\/li><li><b>B.<\/b>1 October 1963<\/li><li><b>C.<\/b>29 May 1999<\/li><\/ul><\/div>\n\n<\/section>\n<section>\n<h2>Answers<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>C<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (2)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},

e>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (3)<\/h1>\n<p class=\"topic-line\">Dr Nnamdi Azikiwe and Sir Abubakar Tafawa Balewa<\/p>\n<\/header>\n<main>\n<!-- AZIKIWE -->\n<article class=\"leader azikiwe\">\n<div class=\"l-head\">\n<h2>Dr Nnamdi Azikiwe – Early Life<\/h2>\n<span class=\"tag\">Zik of Africa<\/span>\n<\/div>\n<div class=\"l-body\">\n<div class=\"facts\">\n<span class=\"fact\"><b>Born:<\/b> 16 November 1904<\/span>\n<span class=\"fact\"><b>Place:<\/b> Zungeru, Niger State<\/span>\n<\/div>\n<p>Dr Nnamdi Azikiwe was a Nigerian nationalist born on 16 November 1904 in Zungeru, Niger State. He was popularly known as Zik of Africa. He studied in Nigeria and the United States before becoming a journalist and politician.<\/p>\n<div class=\"define\">\n<p><span class=\"term\">Nationalism<\/span> is the love for one's country and the desire for its people to govern themselves.<\/p>\n<\/div>\n<p>Azikiwe used journalism, speeches and politics to encourage Nigerians to fight for independence from British colonial rule.<\/p>\n<p class=\"lead-in\">Azikiwe's Contributions<\/p>\n<ol class=\"points\">\n<li><strong>Journalism:<\/strong> Founded the West African Pilot newspaper in 1937 to promote nationalist ideas.<\/li>\n<li><strong>Politics:<\/strong> Participated in nationalist activities through the NCNC.<\/li>\n<li><strong>Independence:<\/strong> Worked with other nationalists towards Nigeria's independence on 1 October 1960.<\/li>\n<li><strong>Leadership:<\/strong> Became Nigeria's first indigenous Governor-General in 1960 and its first President when Nigeria became a republic in 1963.<\/li>\n<li><strong>National Unity:<\/strong> Encouraged cooperation among Nigeria's different ethnic groups.<\/li>\n<\/ol>\n<p class=\"end-note\">He served as President until the military takeover in January 1966.<\/p>\n<\/div>\n<\/article>\n<!-- BALEWA -->\n<article class=\"leader balewa\">\n<div class=\"l-head\">\n<h2>Sir Abubakar Tafawa Balewa – Early Life<\/h2>\n<span class=\"tag\">First Prime Minister of Nigeria<\/span>\n<\/div>\n<div class=\"l-body\">\n<div class=\"facts\">\n<span class=\"fact\"><b>Born:<\/b> December 1912<\/span>\n<span class=\"fact\"><b>Place:<\/b> Bauchi State<\/span>\n<\/div>\n<p>Sir Abubakar Tafawa Balewa was born in December 1912 in Bauchi State. He trained as a teacher and worked in education before entering politics.<\/p>\n<p>He joined the Northern People's Congress (NPC) and worked with other nationalists towards Nigerian self-government and independence. He promoted education, patriotism and national unity.<\/p>\n<p class=\"lead-in\">Balewa's Contributions<\/p>\n<ol class=\"points\">\n<li><strong>First Prime Minister:<\/strong> Became Nigeria's first Prime Minister on 1 October 1960.<\/li>\n<li><strong>Leadership:<\/strong> Led the federal government under the parliamentary system.<\/li>\n<li><strong>Education:<\/strong> Supported educational development.<\/li>\n<li><strong>Foreign Relations:<\/strong> Represented Nigeria internationally and promoted cooperation among African countries.<\/li>\n<li><strong>African Unity:<\/strong> Nigeria became a founding member of the Organisation of African Unity (OAU) in 1963.<\/li>\n<\/ol>\n<p class=\"end-note\">Balewa served until January 1966. He was killed during the military coup of 15 January 1966, which ended the First Republic.<\/p>\n<\/div>\n<\/article>\n<!-- COMPARISON -->\n<section class=\"compare\">\n<h2>Comparison and Lessons<\/h2>\n<h3 class=\"sub\">Similarities<\/h3>\n<ol class=\"points\">\n<li>Both were Nigerian nationalists.<\/li>\n<li>Both contributed to Nigeria's independence and political development.<\/li>\n<li>Both held important leadership positions during the First Republic.<\/li>\n<\/ol>\n\n\n<div class=\"lessons\">\n<p><strong>Lessons:<\/strong> Patriotism, education, national unity, responsible leadership and peaceful settlement of disagreements.<\/p>\n<\/div>\n<\/section>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer.<\/p>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Azikiwe founded the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>West African Pilot<\/li><li><b>B.<\/b>Daily Trust<\/li><li><b>C.<\/b>Nigerian Tribune<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>One lesson from these leaders is<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>disunity<\/li><li><b>B.<\/b>political violence<\/li><li><b>C.<\/b>patriotism and public service<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>Balewa was born in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Lagos<\/li><li><b>B.<\/b>Bauchi<\/li><li><b>C.<\/b>Ibadan<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Balewa worked as a <span class=\"blank\"> <\/span> before entering politics.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>teacher<\/li><li><b>B.<\/b>doctor<\/li><li><b>C.<\/b>pilot<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>Azikiwe was popularly known as<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Lion of the West<\/li><li><b>B.<\/b>Zik of Africa<\/li><li><b>C.<\/b>Eagle of the North<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Balewa was associated with the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>NPC<\/li><li><b>B.<\/b>UPN<\/li><li><b>C.<\/b>PRP<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Azikiwe became Nigeria's first President in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1960<\/li><li><b>B.<\/b>1966<\/li><li><b>C.<\/b>1963<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>The Prime Minister's main responsibility was to<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>lead the government<\/li><li><b>B.<\/b>serve as a traditional ruler<\/li><li><b>C.<\/b>replace the courts<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>Azikiwe was born in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1912<\/li><li><b>B.<\/b>1904<\/li><li><b>C.<\/b>1920<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Nigeria became a founding member of the OAU in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1960<\/li><li><b>B.<\/b>1966<\/li><li><b>C.<\/b>1963<\/li><\/ul><\/div>\n\n<\/section>\n<section>\n<h2>Answers<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>C<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (3)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},

age{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.l-head,.fact,.end-note,.highlight,.instruction,.ans,\n    ol.points li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub{break-after:avoid;page-break-after:avoid}\n    .leader{break-inside:avoid;page-break-inside:avoid}\n    .leader.obasanjo{break-inside:auto;page-break-inside:auto}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (4)<\/h1>\n<p class=\"topic-line\">Shehu Shagari, Olusegun Obasanjo and Umaru Musa Yar’Adua<\/p>\n<\/header>\n<main>\n<!-- SHAGARI -->\n<article class=\"leader shagari\">\n<div class=\"l-head\"><h2>Alhaji Shehu Shagari<\/h2><\/div>\n<div class=\"l-body\">\n<div class=\"facts\">\n<span class=\"fact\"><b>Born:<\/b> 25 February 1925<\/span>\n<span class=\"fact\"><b>Place:<\/b> Shagari, Sokoto State<\/span>\n<\/div>\n<p>Shehu Shagari was born on 25 February 1925 in Shagari, Sokoto State. He worked as a teacher before entering politics and was associated with the Northern People's Congress (NPC) and later the National Party of Nigeria (NPN).<\/p>\n<p>He became Nigeria's first executive President on 1 October 1979, under the presidential system of the Second Republic.<\/p>\n<h3 class=\"sub\">Contributions<\/h3>\n<ol class=\"points\">\n<li>Introduced the Green Revolution Programme to increase food production.<\/li>\n<li>Supported education and housing development.<\/li>\n<li>Promoted economic development and international cooperation.<\/li>\n<\/ol>\n<h3 class=\"sub\">Challenges and End of Government<\/h3>\n<p class=\"end-note\">His government faced economic difficulties, corruption allegations and electoral disputes. On 31 December 1983, a military coup overthrew his government, ending the Second Republic.<\/p>\n<\/div>\n<\/article>\n<!-- OBASANJO -->\n<article class=\"leader obasanjo\">\n<div class=\"l-head\"><h2>Chief Olusegun Obasanjo<\/h2><\/div>\n<div class=\"l-body\">\n<div class=\"facts\">\n<span class=\"fact\"><b>Born:<\/b> 5 March 1937<\/span>\n<span class=\"fact\"><b>Place:<\/b> Ogun State<\/span>\n<\/div>\n<p>Olusegun Obasanjo was born on 5 March 1937 in Ogun State. He joined the Nigerian Army in 1958 and served as military Head of State from 1976 to 1979.<\/p>\n<h3 class=\"sub\">Return to Civilian Rule<\/h3>\n<p>On 1 October 1979, Obasanjo handed power to Shehu Shagari after an election, restoring civilian democratic government.<\/p>\n<h3 class=\"sub\">Civilian Presidency (1999–2007)<\/h3>\n<p>Obasanjo won the 1999 presidential election under the People's Democratic Party (PDP). He became President on 29 May 1999 and was re-elected in 2003.<\/p>\n<h3 class=\"sub\">Contributions<\/h3>\n<ol class=\"points\">\n<li>Helped restore democratic institutions.<\/li>\n<li>Established the Economic and Financial Crimes Commission (EFCC) in 2003.<\/li>\n<li>Secured major external debt relief in 2005.<\/li>\n<li>Supported the expansion of mobile telephone services.<\/li>\n<\/ol>\n\n<\/div>\n<\/article>\n<!-- YAR'ADUA -->\n<article class=\"leader yaradua\">\n<div class=\"l-head\"><h2>Alhaji Umaru Musa Yar’Adua<\/h2><\/div>\n<div class=\"l-body\">\n<div class=\"facts\">\n<span class=\"fact\"><b>Born:<\/b> 16 August 1951<\/span>\n<span class=\"fact\"><b>Place:<\/b> Katsina State<\/span>\n<\/div>\n<p>Umaru Musa Yar’Adua was born on 16 August 1951 in Katsina State. He studied chemistry at Ahmadu Bello University and served as Governor of Katsina State from 1999 to 2007.<\/p>\n<p>He became President on 29 May 2007, succeeding Olusegun Obasanjo.<\/p>\n<h3 class=\"sub\">Contributions<\/h3>\n<ol class=\"points\">\n<li>Promoted respect for the rule of law.<\/li>\n<li>Supported electoral reform.<\/li>\n<li>Introduced the Seven-Point Agenda for national development.<\/li>\n<li>Introduced the 2009 Niger Delta amnesty programme to encourage militants to surrender their weapons and promote peace.<\/li>\n<\/ol>\n<p class=\"end-note\">Yar’Adua died in office on 5 May 2010. Vice-President Goodluck Jonathan succeeded him as President.<\/p>\n<\/div>\n<\/article>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer.<\/p>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Who succeeded Umaru Musa Yar’Adua as President?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Goodluck Jonathan<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>The Green Revolution Programme was introduced by<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Umaru Musa Yar’Adua<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>Obasanjo handed power to Shehu Shagari in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1966<\/li><li><b>B.<\/b>1979<\/li><li><b>C.<\/b>1999<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Yar’Adua introduced the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Green Revolution Programme<\/li><li><b>B.<\/b>Seven-Point Agenda<\/li><li><b>C.<\/b>Operation Feed the Nation<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>The EFCC was established in 2003 during the civilian presidency of<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Olusegun Obasanjo<\/li><li><b>C.<\/b>Umaru Musa Yar’Adua<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Yar’Adua was born in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Ogun State<\/li><li><b>B.<\/b>Sokoto State<\/li><li><b>C.<\/b>Katsina State<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Shagari’s government was overthrown in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1979<\/li><li><b>B.<\/b>1983<\/li><li><b>C.<\/b>1999<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>The Niger Delta amnesty programme aimed to<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>promote peace<\/li><li><b>B.<\/b>increase violence<\/li><li><b>C.<\/b>end elections<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>Yar’Adua died in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>2007<\/li><li><b>B.<\/b>2010<\/li><li><b>C.<\/b>2015<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Which leader served as both military Head of State and elected civilian President?<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Shehu Shagari<\/li><li><b>B.<\/b>Umaru Musa Yar’Adua<\/li><li><b>C.<\/b>Olusegun Obasanjo<\/li><\/ul><\/div>\n\n\n\n<\/section>\n<section>\n<h2>Answers<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>C<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (4)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|1|5":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/>\n<title>History – Primary 6: Civic Rules in Nigeria (5)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n  .topic-line{\n    margin:10px 0 0;\n    font-size:19px;\n    font-style:italic;\n    color:#dfe6f4;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Leader blocks */\n  .leader{\n    margin-top:30px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .leader.jonathan{--accent:var(--navy)}\n  .leader.buhari{--accent:var(--crimson)}\n  .leader.democracy{--accent:var(--gold)}\n\n  .l-part{padding:16px 22px 6px}\n  .l-part + .l-part{border-top:1px solid var(--line)}\n  .l-part:first-child{background:var(--tint);border-bottom:1px solid var(--line)}\n  .l-part:first-child + .l-part{border-top:none}\n\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:20px;\n    line-height:1.25;\n    color:var(--navy);\n    margin:0 0 12px;\n    padding-left:12px;\n    border-left:5px solid var(--accent);\n  }\n  h2.main{font-size:22px;border-left-color:var(--gold);margin-top:34px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:16px 0 8px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n\n  .facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}\n  .fact{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:14px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-radius:20px;\n    padding:3px 14px;\n    color:var(--navy);\n  }\n  .fact b{margin-right:4px}\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n  ol.points li strong{color:var(--navy)}\n\n  /* Achievements vs challenges */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 16px 6px;\n    background:#fff;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    margin:12px 0 6px;\n    padding:4px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel.good{border-top:4px solid var(--navy)}\n  .panel.good h3{background:var(--navy)}\n  .panel.hard{border-top:4px solid var(--crimson)}\n  .panel.hard h3{background:var(--crimson)}\n  .panel.hard ol.points li::before{background:var(--crimson)}\n  .panel.good ol.points li::before{background:var(--navy)}\n  .panel ol.points li{padding-left:40px}\n  .panel ol.points li::before{width:26px;height:26px;line-height:26px;font-size:13px}\n\n  .end-note{\n    background:var(--gold-tint);\n    border-left:5px solid var(--crimson);\n    padding:10px 16px;\n    margin:4px 0 14px;\n  }\n\n  /* Focus areas */\n  .focus{\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    gap:12px;\n    margin:6px 0 14px;\n  }\n  .tile{\n    background:var(--crimson-tint);\n    border:1px solid #e6c9ce;\n    border-top:4px solid var(--crimson);\n    border-radius:4px;\n    padding:10px 14px;\n    font-size:15.5px;\n    line-height:1.5;\n  }\n  .tile strong{\n    display:block;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:var(--crimson);\n    margin-bottom:2px;\n  }\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:12px 18px;\n    margin:0 0 14px;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n  .lead-in{font-weight:700;color:var(--navy);margin:14px 0 6px}\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{border-left-color:var(--gold);font-size:22px}\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 26px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .blank{\n    display:inline-block;\n    min-width:60px;\n    border-bottom:2px solid var(--ink);\n    transform:translateY(-3px);\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .l-part{padding-left:16px;padding-right:16px}\n    .two-col,.focus{grid-template-columns:1fr}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(3,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.l-part:first-child,.fact,.panel h3,.end-note,.tile,\n    .define,.instruction,.ans,ol.points li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub{break-after:avoid;page-break-after:avoid}\n    .l-part,.panel,.tile{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (5)<\/h1>\n<p class=\"topic-line\">Dr Goodluck Jonathan and Muhammadu Buhari<\/p>\n<\/header>\n<main>\n<!-- JONATHAN -->\n<article class=\"leader jonathan\">\n<div class=\"l-part\">\n<h2>Dr Goodluck Jonathan – Early Life<\/h2>\n<div class=\"facts\">\n<span class=\"fact\"><b>Born:<\/b> 20 November 1957<\/span>\n<span class=\"fact\"><b>Place:<\/b> Otuoke, Bayelsa State<\/span>\n<\/div>\n<p>Dr Goodluck Ebele Jonathan was born on 20 November 1957 in Otuoke, Bayelsa State. He studied Zoology at the University of Port Harcourt and obtained a bachelor's degree, a master's degree and a doctorate.<\/p>\n<p>Before entering politics, he worked as an education inspector, lecturer and environmental protection officer.<\/p>\n<p>Jonathan became Deputy Governor of Bayelsa State in 1999 and Governor in 2005. In 2007, he became Vice President of Nigeria alongside President Umaru Musa Yar’Adua.<\/p>\n<\/div>\n<div class=\"l-part\">\n<h2>Goodluck Jonathan – Presidency and Achievements<\/h2>\n<p>Jonathan became Acting President in February 2010 and was sworn in as President on 6 May 2010 after Yar’Adua's death. He won the 2011 presidential election. He belonged to the People's Democratic Party (PDP).<\/p>\n<div class=\"two-col\">\n<div class=\"panel good\">\n<h3>Achievements<\/h3>\n<ol class=\"points\">\n<li>Supported education programmes, including the Almajiri education initiative.<\/li>\n<li>Introduced agricultural reforms to improve food production.<\/li>\n<li>Pursued electricity-sector reforms.<\/li>\n<li>Supported road construction and other infrastructure projects.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel hard\">\n<h3>Challenges<\/h3>\n<ol class=\"points\">\n<li>Boko Haram insurgency and insecurity.<\/li>\n<li>The kidnapping of the Chibok schoolgirls in 2014.<\/li>\n<li>Corruption allegations, unemployment and poverty.<\/li>\n<li>Criticism from opposition parties.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<p class=\"end-note\">Jonathan lost the 2015 presidential election to Muhammadu Buhari of the All Progressives Congress (APC). He peacefully handed over power to Buhari on 29 May 2015.<\/p>\n<\/div>\n<\/article>\n<!-- BUHARI -->\n<article class=\"leader buhari\">\n<div class=\"l-part\">\n<h2>Muhammadu Buhari – Early Life and Military Career<\/h2>\n<div class=\"facts\">\n<span class=\"fact\"><b>Born:<\/b> 17 December 1942<\/span>\n<span class=\"fact\"><b>Place:<\/b> Daura, Katsina State<\/span>\n<\/div>\n<p>Muhammadu Buhari was born on 17 December 1942 in Daura, Katsina State. He joined the Nigerian Army and received military training in Nigeria and abroad.<\/p>\n<p>Buhari became Nigeria's military Head of State on 31 December 1983, following the overthrow of Shehu Shagari's government. He ruled until August 1985, when General Ibrahim Babangida removed him through a military coup.<\/p>\n<h3 class=\"sub\">Policies during his military rule<\/h3>\n<ol class=\"points\">\n<li><strong>War Against Indiscipline (WAI):<\/strong> Encouraged discipline, punctuality and respect for public rules.<\/li>\n<li>Introduced measures intended to fight corruption.<\/li>\n<li>Introduced strict economic policies.<\/li>\n<li>Restricted political activities and some civil liberties.<\/li>\n<\/ol>\n<\/div>\n<div class=\"l-part\">\n<h2>Buhari – Return to Democratic Politics<\/h2>\n<p>Buhari contested presidential elections in 2003, 2007 and 2011 but lost. In 2015, he contested under the All Progressives Congress (APC) and won the presidential election.<\/p>\n<p>He became President on 29 May 2015 and won re-election in 2019.<\/p>\n<p class=\"lead-in\">His administration focused on three major areas:<\/p>\n<div class=\"focus\">\n<div class=\"tile\"><strong>Security<\/strong>Fighting terrorism and other crimes.<\/div>\n<div class=\"tile\"><strong>Anti-corruption<\/strong>Investigating corruption and recovering public funds.<\/div>\n<div class=\"tile\"><strong>Economic development<\/strong>Improving the economy, creating jobs and reducing poverty.<\/div>\n<\/div>\n<\/div>\n<div class=\"l-part\">\n<h2>Buhari – Achievements and Challenges<\/h2>\n<div class=\"two-col\">\n<div class=\"panel good\">\n<h3>Achievements<\/h3>\n<ol class=\"points\">\n<li>Continued or started road, bridge, railway and airport projects.<\/li>\n<li>Introduced social investment programmes to support eligible low-income households.<\/li>\n<li>Promoted local food production.<\/li>\n\n<li>Developed railway projects, including the Abuja–Kaduna and Lagos–Ibadan railways.<\/li>\n<\/ol>\n<\/div>\n<div class=\"panel hard\">\n<h3>Challenges<\/h3>\n<ol class=\"points\">\n<li>Insecurity, including banditry, kidnapping and terrorism.<\/li>\n<li>Unemployment and poverty.<\/li>\n<li>Rising prices of food and other essential goods.<\/li>\n<li>Economic recessions and other financial difficulties.<\/li>\n<li>Fuel shortages and criticism of government policies.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<p class=\"end-note\">Buhari completed his second term on 29 May 2023 and handed over power to Bola Ahmed Tinubu.<\/p>\n<\/div>\n<\/article>\n<!-- DEMOCRATIC RULE -->\n<article class=\"leader democracy\">\n<div class=\"l-part\">\n<h2>Importance of Democratic Rule<\/h2>\n<div class=\"define\">\n<p>Nigeria's Fourth Republic began on <strong>29 May 1999<\/strong>. <span class=\"term\">Democratic rule<\/span> means government by leaders chosen by the people through elections.<\/p>\n<\/div>\n<p class=\"lead-in\">In a democracy:<\/p>\n<ol class=\"points\">\n<li>Citizens vote to choose their leaders.<\/li>\n<li>Elections allow peaceful changes of government.<\/li>\n<li>Leaders are expected to obey the Constitution.<\/li>\n<li>Citizens can express their opinions.<\/li>\n<li>Leaders are accountable to the people.<\/li>\n<\/ol>\n<\/div>\n<\/article>\n<!-- QUESTIONS -->\n<div class=\"exam\">\n<section>\n<h2>Objective Questions<\/h2>\n<p class=\"instruction\">Choose the correct answer.<\/p>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">1.<\/span><span>Goodluck Jonathan was born in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Daura<\/li><li><b>B.<\/b>Otuoke<\/li><li><b>C.<\/b>Kano<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">2.<\/span><span>Before becoming President, Jonathan was Nigeria's<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Chief Justice<\/li><li><b>B.<\/b>Vice President<\/li><li><b>C.<\/b>Senate President<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">3.<\/span><span>Jonathan lost the 2015 presidential election to<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Atiku Abubakar<\/li><li><b>B.<\/b>Muhammadu Buhari<\/li><li><b>C.<\/b>Bola Ahmed Tinubu<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">4.<\/span><span>Buhari first became military Head of State in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>1960<\/li><li><b>B.<\/b>1979<\/li><li><b>C.<\/b>1983<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">5.<\/span><span>WAI means<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>War Against Indiscipline<\/li><li><b>B.<\/b>Workers Against Inflation<\/li><li><b>C.<\/b>War Against Illiteracy<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">6.<\/span><span>Buhari was removed from military power by<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Olusegun Obasanjo<\/li><li><b>B.<\/b>Ibrahim Babangida<\/li><li><b>C.<\/b>Shehu Shagari<\/li><\/ul><\/div>\n\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">7.<\/span><span>Buhari contested the 2015 election under the<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>PDP<\/li><li><b>B.<\/b>APC<\/li><li><b>C.<\/b>NPC<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">8.<\/span><span>Buhari was re-elected President in<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>2015<\/li><li><b>B.<\/b>2017<\/li><li><b>C.<\/b>2019<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">9.<\/span><span>One major goal of Buhari's administration was to fight<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>education<\/li><li><b>B.<\/b>corruption<\/li><li><b>C.<\/b>farming<\/li><\/ul><\/div>\n<div class=\"q\"><div class=\"q-text\"><span class=\"q-num\">10.<\/span><span>Buhari handed over power to <span class=\"blank\"> <\/span> in 2023.<\/span><\/div>\n<ul class=\"opts\"><li><b>A.<\/b>Goodluck Jonathan<\/li><li><b>B.<\/b>Atiku Abubakar<\/li><li><b>C.<\/b>Bola Ahmed Tinubu<\/li><\/ul><\/div>\n\n<\/section>\n<section>\n<h2>Answers<\/h2>\n<div class=\"answers\">\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<div class=\"ans\"><span>1<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>2<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>3<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>4<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>5<\/span><strong>A<\/strong><\/div><div class=\"ans\"><span>6<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>7<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>8<\/span><strong>C<\/strong><\/div><div class=\"ans\"><span>9<\/span><strong>B<\/strong><\/div><div class=\"ans\"><span>10<\/span><strong>C<\/strong><\/div><\/div>\n<\/section>\n<\/div>\n<\/main>\n<footer>History – Primary 6 · Civic Rules in Nigeria (5)<\/footer>\n<\/div>\n<\/body>\n<\/html>\n"},
"hist|1|6":{file:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/>\n<title>History – Primary 6: Civic Rules in Nigeria (6)<\/title>\n<style>\n  :root{\n    --navy:#1F3864;\n    --gold:#B8860B;\n    --crimson:#8B1E2D;\n    --ink:#22262e;\n    --paper:#ffffff;\n    --tint:#f3f5f9;\n    --gold-tint:#fbf5e4;\n    --crimson-tint:#f9eef0;\n    --line:#d5dae4;\n    --accent:var(--navy);\n  }\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{\n    margin:0;\n    background:#e9ecf2;\n    color:var(--ink);\n    font-family:Georgia,\"Palatino Linotype\",Palatino,\"Times New Roman\",serif;\n    font-size:17px;\n    line-height:1.65;\n  }\n  .page{\n    max-width:820px;\n    margin:0 auto;\n    background:var(--paper);\n    box-shadow:0 2px 14px rgba(31,56,100,.15);\n  }\n\n  header.cover{\n    background:var(--navy);\n    color:#fff;\n    padding:36px 44px 30px;\n    border-bottom:6px solid var(--gold);\n  }\n  .subject{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:15px;\n    letter-spacing:.04em;\n    color:#e7cf8e;\n    margin:0 0 6px;\n  }\n  header.cover h1{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:34px;\n    line-height:1.15;\n    margin:0;\n    font-weight:700;\n  }\n  .topic-line{\n    margin:10px 0 0;\n    font-size:19px;\n    font-style:italic;\n    color:#dfe6f4;\n  }\n\n  main{padding:12px 44px 40px}\n  p{margin:0 0 12px}\n\n  /* Section cards */\n  .card{\n    margin-top:30px;\n    border:1px solid var(--line);\n    border-top:6px solid var(--accent);\n    border-radius:4px;\n  }\n  .card.navy{--accent:var(--navy)}\n  .card.gold{--accent:var(--gold)}\n  .card.crimson{--accent:var(--crimson)}\n  .c-head{\n    padding:12px 22px 10px;\n    background:var(--tint);\n    border-bottom:1px solid var(--line);\n  }\n  h2{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:21px;\n    line-height:1.25;\n    color:var(--navy);\n    margin:0;\n  }\n  .c-body{padding:16px 22px 8px}\n\n  h3.sub{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:17px;\n    color:var(--navy);\n    margin:18px 0 8px;\n    padding-bottom:4px;\n    border-bottom:2px solid var(--accent);\n  }\n  .lead-in{font-weight:700;color:var(--navy);margin:14px 0 8px}\n\n  .define{\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-left:5px solid var(--navy);\n    border-radius:4px;\n    padding:14px 18px;\n    margin:0 0 14px;\n  }\n  .define p:last-child{margin-bottom:0}\n  .define .term{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    color:var(--navy);\n  }\n\n  /* Party examples */\n  .parties{\n    display:grid;\n    grid-template-columns:repeat(2,1fr);\n    gap:10px;\n    list-style:none;\n    margin:0 0 14px;\n    padding:0;\n  }\n  .parties li{\n    display:flex;\n    align-items:center;\n    gap:12px;\n    background:var(--gold-tint);\n    border:1px solid #e6d49a;\n    border-radius:4px;\n    padding:10px 14px;\n    line-height:1.35;\n  }\n  .parties .abbr{\n    flex:0 0 58px;\n    text-align:center;\n    background:var(--navy);\n    color:#fff;\n    border-radius:3px;\n    padding:4px 0;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    letter-spacing:.03em;\n  }\n\n  /* Numbered lists */\n  ol.points{list-style:none;counter-reset:n;margin:0 0 14px;padding:0}\n  ol.points li{\n    counter-increment:n;\n    position:relative;\n    padding:7px 0 7px 46px;\n    border-bottom:1px dotted var(--line);\n  }\n  ol.points li:last-child{border-bottom:none}\n  ol.points li::before{\n    content:counter(n);\n    position:absolute;\n    left:0;\n    top:8px;\n    width:30px;\n    height:30px;\n    border-radius:50%;\n    background:var(--accent);\n    color:#fff;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:15px;\n    line-height:30px;\n    text-align:center;\n  }\n\n  /* Step flow */\n  ol.steps{list-style:none;counter-reset:s;margin:4px 0 14px;padding:0}\n  ol.steps li{\n    counter-increment:s;\n    position:relative;\n    margin:0 0 0 0;\n    padding:4px 0 18px 54px;\n  }\n  ol.steps li::before{\n    content:counter(s);\n    position:absolute;\n    left:0;\n    top:0;\n    width:38px;\n    height:38px;\n    border-radius:50%;\n    background:var(--navy);\n    color:#fff;\n    border:3px solid var(--gold);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-weight:700;\n    font-size:16px;\n    line-height:32px;\n    text-align:center;\n    z-index:1;\n  }\n  ol.steps li::after{\n    content:\"\";\n    position:absolute;\n    left:18px;\n    top:38px;\n    bottom:0;\n    width:3px;\n    background:var(--line);\n  }\n  ol.steps li:last-child{padding-bottom:4px}\n  ol.steps li:last-child::after{display:none}\n\n  /* Bullet lists */\n  ul.bullets{list-style:none;margin:0 0 14px;padding:0}\n  ul.bullets li{\n    position:relative;\n    padding:6px 0 6px 28px;\n    border-bottom:1px dotted var(--line);\n  }\n  ul.bullets li:last-child{border-bottom:none}\n  ul.bullets li::before{\n    content:\"\";\n    position:absolute;\n    left:4px;\n    top:15px;\n    width:10px;\n    height:10px;\n    background:var(--accent);\n    transform:rotate(45deg);\n  }\n\n  /* Importance vs problems */\n  .two-col{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n    margin:6px 0 14px;\n  }\n  .panel{\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:4px 16px 8px;\n  }\n  .panel h3{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:16px;\n    margin:12px 0 6px;\n    padding:4px 12px;\n    border-radius:3px;\n    color:#fff;\n  }\n  .panel.good{border-top:4px solid var(--navy);--accent:var(--navy)}\n  .panel.good h3{background:var(--navy)}\n  .panel.hard{border-top:4px solid var(--crimson);--accent:var(--crimson)}\n  .panel.hard h3{background:var(--crimson)}\n  .panel ol.points li{padding-left:40px}\n  .panel ol.points li::before{width:26px;height:26px;line-height:26px;font-size:13px}\n\n  .conduct{\n    background:var(--navy);\n    color:#fff;\n    border-left:6px solid var(--gold);\n    border-radius:4px;\n    padding:14px 22px;\n    margin:6px 0 18px;\n  }\n  .conduct p{margin:0}\n  .conduct strong{\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    color:#e7cf8e;\n  }\n\n  /* Questions */\n  .exam{\n    border-top:3px double var(--navy);\n    margin-top:44px;\n    padding-top:6px;\n  }\n  .exam section{margin-top:30px}\n  .exam h2{\n    padding-left:14px;\n    border-left:5px solid var(--gold);\n    font-size:22px;\n    margin-bottom:12px;\n  }\n  .instruction{\n    font-style:italic;\n    background:var(--gold-tint);\n    border-left:5px solid var(--gold);\n    padding:10px 16px;\n    margin-bottom:18px;\n  }\n  .q{\n    margin:0 0 16px;\n    padding-bottom:12px;\n    border-bottom:1px dotted var(--line);\n    break-inside:avoid;\n    page-break-inside:avoid;\n  }\n  .q:last-child{border-bottom:none}\n  .q-text{display:flex;gap:10px;font-weight:700;margin-bottom:6px}\n  .q-num{\n    flex:0 0 30px;\n    color:var(--crimson);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .opts{\n    list-style:none;\n    margin:0 0 0 40px;\n    padding:0;\n    display:flex;\n    flex-wrap:wrap;\n    gap:2px 26px;\n  }\n  .opts li{white-space:nowrap}\n  .opts b{\n    margin-right:6px;\n    color:var(--navy);\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n\n  .answers{\n    display:grid;\n    grid-template-columns:repeat(6,1fr);\n    gap:10px;\n    margin-top:10px;\n  }\n  .ans{\n    text-align:center;\n    background:var(--tint);\n    border:1px solid var(--line);\n    border-radius:4px;\n    padding:8px 4px;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n  }\n  .ans span{display:block;font-size:13px;color:#5b6475}\n  .ans strong{font-size:22px;color:var(--navy)}\n\n  footer{\n    background:var(--navy);\n    color:#cdd7ec;\n    text-align:center;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n    font-size:13px;\n    padding:12px;\n    border-top:4px solid var(--gold);\n  }\n\n  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  @media (max-width:640px){\n    body{font-size:16px}\n    header.cover{padding:26px 22px 22px}\n    header.cover h1{font-size:26px}\n    main{padding:6px 16px 30px}\n    .c-head,.c-body{padding-left:16px;padding-right:16px}\n    .parties,.two-col{grid-template-columns:1fr}\n    .opts{flex-direction:column}\n    .opts li{white-space:normal}\n    .answers{grid-template-columns:repeat(4,1fr)}\n  }\n\n  @media print{\n    @page{size:A4;margin:14mm}\n    body{background:#fff;font-size:12pt}\n    .page{box-shadow:none;max-width:none}\n    header.cover,footer,.c-head,.define,.parties li,.parties .abbr,.panel h3,\n    .conduct,.instruction,.ans,ol.points li::before,ol.steps li::before,\n    ul.bullets li::before{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n    }\n    header.cover{padding:20px 24px 18px}\n    main{padding:4px 24px 20px}\n    h2,h3.sub{break-after:avoid;page-break-after:avoid}\n    .card,.panel,.conduct{break-inside:avoid;page-break-inside:avoid}\n    ol.steps li{break-inside:avoid;page-break-inside:avoid}\n    .exam{break-before:page;page-break-before:always;margin-top:0}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"cover\">\n<h1>Civic Rules in Nigeria (6)<\/h1>\n<p class=\"topic-line\">Formation of Political Parties<\/p>\n<\/header>\n<main>\n<!-- MEANING -->\n<article class=\"card navy\">\n<div class=\"c-head\"><h2>Meaning of Political Parties<\/h2><\/div>\n<div class=\"c-body\">\n<div class=\"define\">\n<p>A <span class=\"term\">political party<\/s
